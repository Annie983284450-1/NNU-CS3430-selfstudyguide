<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Segments placed separately, the holes they leave, and the heap&#x27;s free list</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="10.0" y="8.0" width="440.0" height="32.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="0"/><text x="230.0" y="29.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">1  SEGMENTS (OSTEP 16)</text><rect x="520.0" y="8.0" width="470.0" height="32.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="0"/><text x="755.0" y="29.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">2  THE HOLES THEY LEAVE (OSTEP 16.6, 17)</text><text x="80.0" y="66.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">address space</text><text x="300.0" y="66.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">physical memory</text><rect x="40.0" y="80.0" width="90.0" height="40.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="85.0" y="104.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle">code</text><rect x="40.0" y="120.0" width="90.0" height="40.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><rect x="40.0" y="160.0" width="90.0" height="60.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="85.0" y="194.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle">heap</text><rect x="40.0" y="220.0" width="90.0" height="140.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="85.0" y="294.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#7a8291" text-anchor="middle">(free)</text><rect x="40.0" y="360.0" width="90.0" height="40.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="85.0" y="384.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle">stack</text><text x="34.0" y="84.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="end">0K</text><text x="34.0" y="164.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="end">4K</text><text x="34.0" y="224.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="end">7K</text><text x="34.0" y="364.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="end">14K</text><text x="34.0" y="404.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="end">16K</text><rect x="250.0" y="80.0" width="100.0" height="156.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><rect x="250.0" y="236.0" width="100.0" height="26.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="300.0" y="253.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle">stack</text><rect x="250.0" y="262.0" width="100.0" height="26.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><rect x="250.0" y="288.0" width="100.0" height="26.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="300.0" y="305.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle">code</text><rect x="250.0" y="314.0" width="100.0" height="39.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="300.0" y="338.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle">heap</text><rect x="250.0" y="353.0" width="100.0" height="52.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="356.0" y="84.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">16K</text><text x="356.0" y="240.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">28K</text><text x="356.0" y="292.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">32K</text><text x="356.0" y="318.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">34K</text><text x="356.0" y="357.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">37K</text><line x1="132.0" y1="100.0" x2="248.0" y2="301.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><line x1="132.0" y1="190.0" x2="248.0" y2="333.5" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><line x1="132.0" y1="380.0" x2="248.0" y2="249.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><text x="20.0" y="432.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">Each segment has its own base and size: code 32K / 2K, heap 34K / 3K,</text><text x="20.0" y="449.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">stack 28K / 2K. The 7 KB free middle of the address space gets no</text><text x="20.0" y="466.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">physical memory.</text><text x="540.0" y="56.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">64 KB of physical memory, not compacted (OSTEP Figure 16.6)</text><rect x="540.0" y="60.0" width="110.0" height="72.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="595.0" y="100.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle">OS</text><rect x="540.0" y="132.0" width="110.0" height="36.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="658.0" y="154.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start">8 KB free</text><rect x="540.0" y="168.0" width="110.0" height="36.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="595.0" y="190.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle">used</text><rect x="540.0" y="204.0" width="110.0" height="36.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="658.0" y="226.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start">8 KB free</text><rect x="540.0" y="240.0" width="110.0" height="36.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="595.0" y="262.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle">used</text><rect x="540.0" y="276.0" width="110.0" height="36.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="658.0" y="298.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start">8 KB free</text><rect x="540.0" y="312.0" width="110.0" height="36.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="595.0" y="334.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle">used</text><text x="534.0" y="63.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7a8291" text-anchor="end">0</text><text x="534.0" y="135.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7a8291" text-anchor="end">16</text><text x="534.0" y="171.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7a8291" text-anchor="end">24</text><text x="534.0" y="207.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7a8291" text-anchor="end">32</text><text x="534.0" y="243.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7a8291" text-anchor="end">40</text><text x="534.0" y="279.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7a8291" text-anchor="end">48</text><text x="534.0" y="315.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7a8291" text-anchor="end">56</text><text x="534.0" y="351.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7a8291" text-anchor="end">64</text><text x="735.0" y="84.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">A request for a 20 KB segment: 24 KB is free</text><text x="735.0" y="101.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">in total, but no single hole is 20 KB, so the</text><text x="735.0" y="118.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">request fails.</text><text x="735.0" y="174.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start">External fragmentation: free space in pieces</text><text x="735.0" y="191.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start">of different sizes, so a request fails even</text><text x="735.0" y="208.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start">though the total would be enough.</text><text x="540.0" y="374.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">the heap&#x27;s free list has the same problem (OSTEP 17)</text><rect x="540.0" y="385.0" width="120.0" height="34.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="600.0" y="406.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle">free 10</text><rect x="660.0" y="385.0" width="120.0" height="34.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="720.0" y="406.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle">used 10</text><rect x="780.0" y="385.0" width="120.0" height="34.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="840.0" y="406.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle">free 10</text><text x="540.0" y="440.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">20 bytes are free, but in two pieces of 10, so a request for 15 bytes still fails.</text></svg>
