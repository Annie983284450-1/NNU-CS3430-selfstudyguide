<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" width="620" height="260" role="img"><title>Free pages against the two watermarks: the swap daemon wakes below low and works until high</title><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="10.0" y="18.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">free pages (not to scale)</text><rect x="40.0" y="30.0" width="70.0" height="200.0" rx="0" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><line x1="30.0" y1="80.0" x2="120.0" y2="80.0" stroke="#2e7d32" stroke-width="2"/><text x="130.0" y="76.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="start" font-weight="700">high watermark (HW)</text><text x="130.0" y="94.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">the daemon stops evicting and sleeps</text><line x1="30.0" y1="150.0" x2="120.0" y2="150.0" stroke="#b8560f" stroke-width="2"/><text x="130.0" y="146.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b8560f" text-anchor="start" font-weight="700">low watermark (LW)</text><text x="130.0" y="164.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">fewer free pages than this: the swap daemon wakes</text><line x1="30.0" y1="200.0" x2="120.0" y2="200.0" stroke="#b23a48" stroke-width="2"/><text x="130.0" y="196.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start" font-weight="700">min</text><text x="130.0" y="214.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">only the kernel&#x27;s most urgent requests may go below</text><text x="10.0" y="252.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">Zone Normal on an Ubuntu 24.04 machine: min 8309, low 10386, high 12463 pages.</text></svg>
