x="470.0" y="122.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">V: does the page exist? (invalid means a</text><text x="470.0" y="139.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">trap)</text><text x="470.0" y="164.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">R W X: may it be read, written, executed?</text><text x="470.0" y="206.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">U: may a user program touch it?</text><rect x="750.0" y="8.0" width="240.0" height="32.0" rx="4" fill="#1e6b3a" stroke="#1e6b3a" stroke-width="0"/><text x="870.0" y="29.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">3  THE TLB (OSTEP 19)</text><rect x="750.0" y="62.0" width="240.0" height="58.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="870.0" y="87.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">a small, fast cache of recent</text><text x="870.0" y="103.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">VPN → PFN translations, in the MMU</text><text x="750.0" y="144.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">int a[10] at address 100, 16-byte pages</text><rect x="750.0" y="155.0" width="22.0" height="30.0" rx="3" fill="#f8e3e6" stroke="#9aa3b2" stroke-width="1.2"/><text x="761.0" y="174.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle" font-weight="700">M</text><rect x="774.0" y="155.0" width="22.0" height="30.0" rx="3" fill="#e3f1e4" stroke="#9aa3b2" stroke