<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img"><title>Why one read no longer finds the entry: last week&#x27;s table was one block, the tree&#x27;s pieces are scattered</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="10.0" y="20.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">last week: the table is one unbroken block</text><rect x="10.0" y="40.0" width="90.0" height="34.0" rx="6" fill="#fbe9da" stroke="#1f3864" stroke-width="1.2"/><text x="55.0" y="61.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">PTBR</text><rect x="130.0" y="40.0" width="36.0" height="34.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><rect x="166.0" y="40.0" width="36.0" height="34.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><rect x="202.0" y="40.0" width="36.0" height="34.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><rect x="238.0" y="40.0" width="36.0" height="34.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><rect x="274.0" y="40.0" width="36.0" height="34.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><rect x="310.0" y="40.0" width="36.0" height="34.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><rect x="346.0" y="40.0" width="36.0" height="34.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><rect x="382.0" y="40.0" width="36.0" height="34.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="130.0" y="93.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">row 0</text><text x="382.0" y="93.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">row 7</text><line x1="100.0" y1="57.0" x2="128.0" y2="57.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><path d="M 115 75 Q 230 140 310 76" stroke="#b23a48" stroke-width="1.6" fill="none" marker-end="url(#ahb23a48)"/><rect x="10.0" y="120.0" width="400.0" height="38.0" rx="4" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="210.0" y="144.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#b23a48" text-anchor="middle" font-weight="700">PTEAddr = PTBR + VPN × sizeof(PTE)</text><text x="10.0" y="184.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">One base, and each row at a fixed distance from it: one read finds any</text><text x="10.0" y="201.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">row.</text><text x="470.0" y="20.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">now: the pieces sit in frames of their own</text><rect x="470.0" y="40.0" width="90.0" height="34.0" rx="6" fill="#fbe9da" stroke="#1f3864" stroke-width="1.2"/><text x="515.0" y="61.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">PDBR</text><rect x="600.0" y="40.0" width="190.0" height="34.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="695.0" y="61.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b2430" text-anchor="middle">directory, frame 200</text><line x1="560.0" y1="57.0" x2="598.0" y2="57.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><rect x="470.0" y="120.0" width="68.0" height="46.0" rx="0" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1"/><rect x="538.0" y="120.0" width="68.0" height="46.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="572.0" y="139.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">piece</text><text x="572.0" y="154.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">201</text><rect x="606.0" y="120.0" width="68.0" height="46.0" rx="0" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1"/><rect x="674.0" y="120.0" width="68.0" height="46.0" rx="0" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1"/><rect x="742.0" y="120.0" width="68.0" height="46.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="776.0" y="139.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">piece</text><text x="776.0" y="154.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">204</text><rect x="810.0" y="120.0" width="68.0" height="46.0" rx="0" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1"/><text x="504.0" y="181.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#7a8291" text-anchor="middle"></text><text x="572.0" y="181.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#7a8291" text-anchor="middle">frame 201</text><text x="640.0" y="181.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#7a8291" text-anchor="middle">frame 202</text><text x="708.0" y="181.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#7a8291" text-anchor="middle">frame 203</text><text x="776.0" y="181.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#7a8291" text-anchor="middle">frame 204</text><text x="844.0" y="181.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#7a8291" text-anchor="middle">frame 205</text><line x1="690.0" y1="76.0" x2="538.0" y2="118.0" stroke="#1f3864" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah1f3864)"/><line x1="700.0" y1="76.0" x2="742.0" y2="118.0" stroke="#1f3864" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah1f3864)"/><text x="470.0" y="210.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">Frames 201 and 204 hold the two pieces; the frames between them</text><text x="470.0" y="227.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">belong to other things. There is no single base to add the VPN to, so one</text><text x="470.0" y="244.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">read cannot find the row.</text></svg>
