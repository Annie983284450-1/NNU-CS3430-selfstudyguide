<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 5 614 113" width="614" height="113" role="img"><title>Internal fragmentation: 100 bytes of data in a 16 KB page</title><defs></defs><rect x="3" y="5" width="614" height="113" fill="#ffffff"/><text x="10.0" y="20.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">one 16 KB page (not to scale)</text><rect x="10.0" y="32.0" width="600.0" height="50.0" rx="0" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><rect x="10.0" y="32.0" width="60.0" height="50.0" rx="0" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="40.0" y="61.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">100 B</text><text x="330.0" y="61.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6675" text-anchor="middle">the rest of the page: handed out, but empty</text><text x="10.0" y="108.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">The program asked for 100 bytes and got a whole page; the waste is inside the page.</text></svg>
