<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 744 80" width="744" height="80" role="img"><title>One page-table entry, with the present bit beside the bits you know</title><defs></defs><rect x="3" y="3" width="744" height="80" fill="#ffffff"/><rect x="10.0" y="10.0" width="250.0" height="40.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="135.0" y="34.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">PFN (frame number)</text><rect x="260.0" y="10.0" width="90.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.2"/><text x="305.0" y="34.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">valid</text><rect x="350.0" y="10.0" width="90.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.2"/><text x="395.0" y="34.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">prot</text><rect x="440.0" y="10.0" width="100.0" height="40.0" rx="0" fill="#fdf2d6" stroke="#9aa3b2" stroke-width="1.2"/><text x="490.0" y="34.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">present</text><rect x="540.0" y="10.0" width="100.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.2"/><text x="590.0" y="34.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">dirty</text><rect x="640.0" y="10.0" width="100.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.2"/><text x="690.0" y="34.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">use</text><text x="10.0" y="74.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">OSTEP Figure 20.2&#x27;s entry plus three bits: present (is the page in memory?), dirty (was it written?) and use (was it touched recently?).</text></svg>
