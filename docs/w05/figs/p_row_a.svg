<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2 839 189" width="839" height="189" role="img"><title>The row of a page that was just moved to disk, and the two things it could say</title><defs></defs><rect x="3" y="2" width="839" height="189" fill="#ffffff"/><text x="10.0" y="18.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">the row of a page that was just moved to disk</text><rect x="10.0" y="30.0" width="110.0" height="34.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="65.0" y="51.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">PFN 23</text><rect x="120.0" y="30.0" width="100.0" height="34.0" rx="0" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1"/><text x="170.0" y="51.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">valid 1</text><rect x="220.0" y="30.0" width="110.0" height="34.0" rx="0" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1"/><text x="275.0" y="51.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">prot rw-</text><text x="10.0" y="94.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">and frame 23 now</text><rect x="10.0" y="106.0" width="90.0" height="44.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="55.0" y="132.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">22</text><rect x="100.0" y="106.0" width="90.0" height="44.0" rx="0" fill="#f8e3e6" stroke="#9aa3b2" stroke-width="1"/><text x="145.0" y="124.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">23: someone</text><text x="145.0" y="139.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">else&#x27;s page</text><rect x="190.0" y="106.0" width="90.0" height="44.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="235.0" y="132.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">24</text><rect x="280.0" y="106.0" width="90.0" height="44.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="325.0" y="132.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">25</text><text x="10.0" y="174.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">The row still says 23, but frame 23 belongs to another program now.</text><text x="450.0" y="18.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">the two things the row could say</text><rect x="450.0" y="30.0" width="110.0" height="34.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="505.0" y="51.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">PFN 23</text><rect x="560.0" y="30.0" width="100.0" height="34.0" rx="0" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1"/><text x="610.0" y="51.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">valid 1</text><text x="672.0" y="44.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b23a48" text-anchor="start" font-weight="700">wrong: the program reads</text><text x="672.0" y="59.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b23a48" text-anchor="start" font-weight="700">another program&#x27;s data</text><rect x="450.0" y="90.0" width="110.0" height="34.0" rx="0" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1"/><text x="505.0" y="111.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#7a8291" text-anchor="middle" font-weight="700">PFN –</text><rect x="560.0" y="90.0" width="100.0" height="34.0" rx="0" fill="#f8e3e6" stroke="#9aa3b2" stroke-width="1"/><text x="610.0" y="111.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">valid 0</text><text x="672.0" y="104.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b23a48" text-anchor="start" font-weight="700">wrong: valid = 0 means not</text><text x="672.0" y="119.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b23a48" text-anchor="start" font-weight="700">yours, and the program is</text><text x="672.0" y="135.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b23a48" text-anchor="start" font-weight="700">killed</text><text x="450.0" y="164.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">This page is the program&#x27;s own, so neither answer is right. The row</text><text x="450.0" y="181.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">needs a way to say: yours, but not here right now.</text></svg>
