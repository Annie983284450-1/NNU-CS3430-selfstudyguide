<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img"><title>Why the capped run misses every time: the cap holds 4 of 16 cells, and the loop always wants the oldest</title><defs><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="10.0" y="18.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">the 256 MiB file as 16 cells of 16 MiB; the loop reads them left to right, then starts again</text><rect x="10.0" y="54.0" width="44.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="32.0" y="78.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#7a8291" text-anchor="middle">0</text><rect x="56.0" y="54.0" width="44.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="78.0" y="78.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#7a8291" text-anchor="middle">1</text><rect x="102.0" y="54.0" width="44.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="124.0" y="78.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#7a8291" text-anchor="middle">2</text><rect x="148.0" y="54.0" width="44.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="170.0" y="78.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#7a8291" text-anchor="middle">3</text><rect x="194.0" y="54.0" width="44.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="