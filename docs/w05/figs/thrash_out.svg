dth="1.4"/><text x="584.0" y="78.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">12</text><rect x="608.0" y="54.0" width="44.0" height="40.0" rx="0" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.4"/><text x="630.0" y="78.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">13</text><rect x="654.0" y="54.0" width="44.0" height="40.0" rx="0" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.4"/><text x="676.0" y="78.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">14</text><rect x="700.0" y="54.0" width="44.0" height="40.0" rx="0" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.4"/><text x="722.0" y="78.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">15</text><rect x="559.0" y="50.0" width="188.0" height="48.0" rx="4" fill="none" stroke="#1f3864" stroke-width="2"/><text x="750.0" y="42.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="end" font-weight="700">in memory: the 4 most recent cells (the 64 MiB cap)</text><path d="M 690 98 C 690 160, 40 160, 32 100" stroke="#b23a48" stroke-width="1.8" fill="none" marker-end="url(#ahb23a48)"/><text x="330.0" y="178.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b23a48" text-anchor="middle" font-weight="700">next wanted: cell 0, the oldest, evicted long ago, so every read is a disk read</text></svg>
