<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 96" width="700" height="96" role="img"><title>One 64-bit Sv39 page table entry</title><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="10.0" y="30.0" width="120.0" height="40.0" rx="0" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="70.0" y="54.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#7a8291" text-anchor="middle">63..54  unused</text><rect x="130.0" y="30.0" width="400.0" height="40.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="330.0" y="54.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">PPN, bits 53..10  (44 bits)</text><rect x="530.0" y="30.0" width="160.0" height="40.0" rx="0" fill="#fbe9da" stroke="#9aa3b2" stroke-width="1.2"/><text x="610.0" y="54.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">flags 9..0</text><text x="530.0" y="19.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">bits 0 to 4: V R W X U</text><text x="10.0" y="90.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">PTE2PA: shift the flags off (&gt;&gt; 10), then the frame number into place (&lt;&lt; 12).</text></svg>
