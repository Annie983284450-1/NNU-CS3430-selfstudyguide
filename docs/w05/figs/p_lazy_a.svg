<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2 848 171" width="848" height="171" role="img"><title>Eager and lazy sbrk: when the frames and rows arrive</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="ah2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="as2e7d32" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker></defs><rect x="3" y="2" width="848" height="171" fill="#ffffff"/><text x="10.0" y="18.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">eager (xv6&#x27;s sbrk until now): every row at once</text><rect x="10.0" y="30.0" width="110.0" height="40.0" rx="8" fill="#eef3fa" stroke="#1f3864" stroke-width="1.4"/><text x="65.0" y="54.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">sbrk(n)</text><line x1="124.0" y1="50.0" x2="160.0" y2="50.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><rect x="164.0" y="30.0" width="230.0" height="40.0" rx="8" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="279.0" y="54.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">kalloc + mappages, n ÷ 4096 times</text><rect x="10.0" y="90.0" width="64.0" height="34.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="42.0" y="111.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">row 0</text><rect x="74.0" y="90.0" width="64.0" height="34.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="106.0" y="111.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">row 1</text><rect x="138.0" y="90.0" width="64.0" height="34.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="170.0" y="111.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">row 2</text><rect x="202.0" y="90.0" width="64.0" height="34.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="234.0" y="111.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">row 3</text><rect x="266.0" y="90.0" width="64.0" height="34.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="298.0" y="111.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">row 4</text><rect x="330.0" y="90.0" width="64.0" height="34.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="362.0" y="111.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">row 5</text><text x="10.0" y="148.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">Every promised page gets a frame and a row before the program touches</text><text x="10.0" y="163.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">any of them. Ask for 1 GiB: 2^30 ÷ 2^12 = 262,144 frames and rows up front.</text><text x="450.0" y="18.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1e6b3a" text-anchor="start" font-weight="700">lazy: promise now, deliver on first touch</text><rect x="450.0" y="30.0" width="130.0" height="40.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.4"/><text x="515.0" y="54.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">sbrklazy(n)</text><line x1="584.0" y1="50.0" x2="620.0" y2="50.0" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#ah2e7d32)"/><rect x="624.0" y="30.0" width="220.0" height="40.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="734.0" y="54.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">only sz grows: sz += n</text><rect x="450.0" y="90.0" width="64.0" height="34.0" rx="0" fill="#e3f1e4" stroke="#9aa3b2" stroke-width="1"/><text x="482.0" y="111.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">row 0</text><rect x="514.0" y="90.0" width="64.0" height="34.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1" stroke-dasharray="4 3"/><rect x="578.0" y="90.0" width="64.0" height="34.0" rx="0" fill="#e3f1e4" stroke="#9aa3b2" stroke-width="1"/><text x="610.0" y="111.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">row 2</text><rect x="642.0" y="90.0" width="64.0" height="34.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1" stroke-dasharray="4 3"/><rect x="706.0" y="90.0" width="64.0" height="34.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1" stroke-dasharray="4 3"/><rect x="770.0" y="90.0" width="64.0" height="34.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1" stroke-dasharray="4 3"/><text x="450.0" y="148.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">A row is built only when its page is first touched (here pages 0 and 2): the</text><text x="450.0" y="163.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">page fault is the signal, and the handler delivers the page.</text></svg>
