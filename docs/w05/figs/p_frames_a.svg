<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2 836 251" width="836" height="251" role="img"><title>Pages in frames, and a machine whose programs want more pages than it has frames</title><defs></defs><rect x="3" y="2" width="836" height="251" fill="#ffffff"/><text x="10.0" y="18.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">what we have: pages in frames, the table pointing at them</text><rect x="10.0" y="30.0" width="96.0" height="44.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="58.0" y="56.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">P0 pg 0</text><rect x="106.0" y="30.0" width="96.0" height="44.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="154.0" y="56.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">P0 pg 1</text><rect x="202.0" y="30.0" width="96.0" height="44.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="250.0" y="56.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">P1 pg 0</text><rect x="298.0" y="30.0" width="96.0" height="44.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="346.0" y="56.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">P1 pg 1</text><rect x="10.0" y="74.0" width="96.0" height="44.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="58.0" y="100.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">P2 pg 0</text><rect x="106.0" y="74.0" width="96.0" height="44.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="154.0" y="100.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">P2 pg 1</text><rect x="202.0" y="74.0" width="96.0" height="44.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="250.0" y="100.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">P2 pg 2</text><rect x="298.0" y="74.0" width="96.0" height="44.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="346.0" y="100.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">P3 pg 0</text><text x="10.0" y="140.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">8 frames, 8 pages: full</text><rect x="10.0" y="156.0" width="120.0" height="34.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="70.0" y="177.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">PFN 5</text><rect x="130.0" y="156.0" width="110.0" height="34.0" rx="0" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1"/><text x="185.0" y="177.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">valid 1</text><rect x="240.0" y="156.0" width="120.0" height="34.0" rx="0" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1"/><text x="300.0" y="177.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">prot rw-</text><text x="10.0" y="208.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">one row of P2&#x27;s table: page 1 is in frame 5</text><text x="450.0" y="18.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">where it breaks: an Ubuntu 24.04 x86-64 machine</text><rect x="450.0" y="36.0" width="372.4" height="30.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="450.0" y="84.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">memory: MemTotal 8,224,868 kB, about 7.8 GiB</text><rect x="450.0" y="100.0" width="380.0" height="30.0" rx="0" fill="#fbe9da" stroke="#9aa3b2" stroke-width="1.2"/><line x1="497.5" y1="100.0" x2="497.5" y2="130.0" stroke="#9aa3b2" stroke-width="0.8"/><line x1="545.0" y1="100.0" x2="545.0" y2="130.0" stroke="#9aa3b2" stroke-width="0.8"/><line x1="592.5" y1="100.0" x2="592.5" y2="130.0" stroke="#9aa3b2" stroke-width="0.8"/><line x1="640.0" y1="100.0" x2="640.0" y2="130.0" stroke="#9aa3b2" stroke-width="0.8"/><line x1="687.5" y1="100.0" x2="687.5" y2="130.0" stroke="#9aa3b2" stroke-width="0.8"/><line x1="735.0" y1="100.0" x2="735.0" y2="130.0" stroke="#9aa3b2" stroke-width="0.8"/><line x1="782.5" y1="100.0" x2="782.5" y2="130.0" stroke="#9aa3b2" stroke-width="0.8"/><rect x="822.4" y="100.0" width="9.6" height="30.0" rx="0" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.6"/><text x="450.0" y="148.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">eight programs that each touch 1 GiB: 8 GiB of pages</text><text x="450.0" y="180.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start" font-weight="700">The last pages have no frame to go to: the drawing on the left</text><text x="450.0" y="197.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start" font-weight="700">cannot be drawn.</text><text x="450.0" y="243.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7a8291" text-anchor="start">bars to scale: 1 GiB per segment</text></svg>
