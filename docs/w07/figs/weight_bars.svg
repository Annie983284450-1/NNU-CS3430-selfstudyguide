<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 2 993 167" width="993" height="167" role="img"><title>One 48 ms window with A at nice -5 and B at nice 0</title><defs></defs><rect x="4" y="2" width="993" height="167" fill="#ffffff"/><text x="10.0" y="19.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="start" font-weight="700">A and B run 36 and 12 ms per window; their vruntimes rise by the same amount</text><text x="10.0" y="64.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">A, nice −5</text><rect x="150.0" y="40.0" width="468.0" height="40.0" rx="0" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="384.0" y="64.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">ran 36 ms</text><text x="10.0" y="120.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">B, nice 0</text><rect x="150.0" y="96.0" width="156.0" height="40.0" rx="0" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.2"/><text x="228.0" y="120.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">ran 12 ms</text><rect x="800.0" y="40.0" width="190.0" height="40.0" rx="2" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="895.0" y="65.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">+12</text><rect x="800.0" y="96.0" width="190.0" height="40.0" rx="2" fill="#dff0f5" stroke="#1f3864" stroke-width="1.2"/><text x="895.0" y="121.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">+12</text><text x="150.0" y="160.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">real CPU time in one 48 ms window</text><text x="800.0" y="160.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">vruntime gained</text></svg>
