<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 1 886 368" width="886" height="368" role="img"><title>Two caches can disagree, and one queue has two readers</title><defs><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect x="3" y="1" width="886" height="368" fill="#ffffff"/><text x="10.0" y="19.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#b23a48" text-anchor="start" font-weight="700">two caches can disagree; one queue, two readers</text><rect x="10.0" y="34.0" width="280.0" height="110.0" rx="12" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><rect x="22.0" y="46.0" width="32.0" height="32.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="38.0" y="67.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="64.0" y="64.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">CPU 0 reads D from memory and</text><text x="64.0" y="83.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">keeps a copy in its cache</text><rect x="306.0" y="34.0" width="280.0" height="110.0" rx="12" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><rect x="318.0" y="46.0" width="32.0" height="32.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="334.0" y="67.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="360.0" y="64.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">CPU 0 changes it to D&#x27;. Only its</text><text x="360.0" y="83.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">own cache knows; memory still</text><text x="360.0" y="101.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">says D</text><rect x="602.0" y="34.0" width="280.0" height="110.0" rx="12" fill="#ffffff" stroke="#b23a48" stroke-width="1.6"/><rect x="614.0" y="46.0" width="32.0" height="32.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="630.0" y="67.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="656.0" y="64.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">the job moves to CPU 1, which</text><text x="656.0" y="83.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">reads memory and gets the old D.</text><text x="656.0" y="101.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">Wrong!</text><text x="10.0" y="172.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">the hardware watches the bus and throws the stale copy away: cache coherence. Correct, but CPU 1 now fetches everything from memory.</text><rect x="20.0" y="220.0" width="160.0" height="50.0" rx="8" fill="#eef3fa" stroke="#1f3864" stroke-width="1.6"/><text x="100.0" y="250.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">CPU 0</text><rect x="230.0" y="220.0" width="160.0" height="50.0" rx="8" fill="#eef3fa" stroke="#1f3864" stroke-width="1.6"/><text x="310.0" y="250.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">CPU 1</text><text x="20.0" y="345.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="start" font-weight="700">queue</text><rect x="100.0" y="318.0" width="66.0" height="44.0" rx="0" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="133.0" y="345.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">A</text><rect x="172.0" y="318.0" width="66.0" height="44.0" rx="0" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.2"/><text x="205.0" y="345.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">B</text><rect x="244.0" y="318.0" width="66.0" height="44.0" rx="0" fill="#b8560f" stroke="#b8560f" stroke-width="1.2"/><text x="277.0" y="345.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">C</text><line x1="100.0" y1="272.0" x2="160.0" y2="314.0" stroke="#b23a48" stroke-width="2.2" marker-end="url(#ahb23a48)"/><line x1="310.0" y1="272.0" x2="175.0" y2="314.0" stroke="#b23a48" stroke-width="2.2" marker-end="url(#ahb23a48)"/><text x="440.0" y="241.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">both CPUs read the head of the queue at the same instant: both</text><text x="440.0" y="260.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">take A, nobody takes B</text></svg>
