<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 20 612 360" width="612" height="360" role="img"><title>The eight turns as a staircase</title><defs></defs><rect x="24" y="20" width="612" height="360" fill="#ffffff"/><line x1="60.0" y1="50.0" x2="630.0" y2="50.0" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="8 5"/><text x="60.0" y="36.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="700">counter 200: all three level again, so one cycle (one lap) is over</text><text x="50.0" y="54.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="end">200</text><text x="50.0" y="354.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="end">0</text><line x1="60.0" y1="350.0" x2="630.0" y2="350.0" stroke="#5b6675" stroke-width="1.2"/><rect x="80.0" y="200.0" width="160.0" height="150.0" rx="0" fill="#1f3864" stroke="#ffffff" stroke-width="1.2"/><text x="160.0" y="279.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">turn 1: +100</text><rect x="80.0" y="50.0" width="160.0" height="150.0" rx="0" fill="#1f3864" stroke="#ffffff" stroke-width="1.2"/><text x="160.0" y="129.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">turn 6: +100</text><text x="160.0" y="373.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f3864" text-anchor="middle" font-weight="700">A</text><rect x="265.0" y="50.0" width="160.0" height="300.0" rx="0" fill="#1f6f8b" stroke="#ffffff" stroke-width="1.2"/><text x="345.0" y="204.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">turn 2: +200</text><text x="345.0" y="373.6" font-family="Helvetica Neue, Helvetica