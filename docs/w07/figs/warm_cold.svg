<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 7 780 171" width="780" height="171" role="img"><title>A likely reason the bounce is slow</title><defs><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect x="3" y="7" width="780" height="171" fill="#ffffff"/><rect x="10.0" y="14.0" width="260.0" height="50.0" rx="8" fill="#eef3fa" stroke="#1f3864" stroke-width="1.6"/><text x="140.0" y="44.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">CPU 0, warm</text><rect x="25.0" y="72.0" width="230.0" height="34.0" rx="4" fill="#fdf2d6" stroke="#b8560f" stroke-width="1.2"/><text x="140.0" y="93.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b8560f" text-anchor="middle" font-weight="700">cache: the list</text><text x="140.0" y="134.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">each step: a few ns, from the cache</text><rect x="360.0" y="14.0" width="260.0" height="50.0" rx="8" fill="#eef3fa" stroke="#1f3864" stroke-width="1.6"/><text x="490.0" y="44.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">CPU 1, cold</text><rect x="375.0" y="72.0" width="230.0" height="34.0" rx="4" fill="#fdf2d6" stroke="#b8560f" stroke-width="1.2"/><text x="490.0" y="93.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b8560f" text-anchor="middle" font-weight="700">cache</text><line x1="274.0" y1="38.0" x2="356.0" y2="38.0" stroke="#b23a48" stroke-width="2" marker-end="url(#ahb23a48)"/><text x="490.0" y="134.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">each step: a trip to the shared L3 (a bigger</text><text x="490.0" y="151.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">cache all cores share) or memory until the</text><text x="490.0" y="168.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">cache fills again</text><text x="650.0" y="43.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b23a48" text-anchor="start" font-weight="700">6101 moves in 7 s</text></svg>
