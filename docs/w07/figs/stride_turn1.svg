<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2 794 437" width="794" height="437" role="img"><title>Turn 1 of stride: the counters before, the four steps, and the counters after</title><defs></defs><rect x="3" y="2" width="794" height="437" fill="#ffffff"/><text x="10.0" y="18.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">before turn 1: the three counters</text><rect x="10.0" y="28.0" width="210.0" height="92.0" rx="10" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/><text x="22.0" y="52.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">job A · 100 tickets</text><text x="22.0" y="76.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start" font-weight="700">counter 0</text><text x="22.0" y="102.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">step 100  (10000 ÷ tickets)</text><rect x="240.0" y="28.0" width="210.0" height="92.0" rx="10" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="252.0" y="52.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f6f8b" text-anchor="start" font-weight="700">job B · 50 tickets</text><text x="252.0" y="76.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start" font-weight="700">counter 0</text><text x="252.0" y="102.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">step 200  (10000 ÷ tickets)</text><rect x="470.0" y="28.0" width="210.0" height="92.0" rx="10" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="482.0" y="52.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b8560f" text-anchor="start" font-weight="700">job C · 250 tickets</text><text x="482.0" y="76.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start" font-weight="700">counter 0</text><text x="482.0" y="102.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">step 40  (10000 ÷ tickets)</text><text x="10.0" y="144.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">what the scheduler does in this turn</text><rect x="10.0" y="154.0" width="420.0" height="32.0" rx="3" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.2"/><text x="22.0" y="174.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">1  find the job with the lowest counter</text><text x="450.0" y="174.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">lowest: A (all three are 0, a tie; a tie goes to any of them, here A)</text><rect x="10.0" y="192.0" width="420.0" height="32.0" rx="3" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.2"/><text x="22.0" y="212.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">2  run it for one time slice</text><text x="450.0" y="212.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">A runs for one time slice</text><rect x="10.0" y="230.0" width="420.0" height="32.0" rx="3" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.2"/><text x="22.0" y="250.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">3  add its step to its counter</text><text x="450.0" y="250.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">A: 0 + 100 = 100</text><rect x="10.0" y="268.0" width="420.0" height="32.0" rx="3" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.2"/><text x="22.0" y="288.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">4  put it back and decide again</text><text x="450.0" y="288.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">back in the set; look for the lowest again</text><text x="10.0" y="330.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">after turn 1</text><rect x="10.0" y="340.0" width="210.0" height="92.0" rx="10" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="22.0" y="364.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">job A · 100 tickets</text><text x="22.0" y="388.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#b23a48" text-anchor="start" font-weight="700">counter 100  (was 0)</text><text x="22.0" y="414.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">step 100  (10000 ÷ tickets)</text><rect x="240.0" y="340.0" width="210.0" height="92.0" rx="10" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="252.0" y="364.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f6f8b" text-anchor="start" font-weight="700">job B · 50 tickets</text><text x="252.0" y="388.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start" font-weight="700">counter 0</text><text x="252.0" y="414.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">step 200  (10000 ÷ tickets)</text><rect x="470.0" y="340.0" width="210.0" height="92.0" rx="10" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="482.0" y="364.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b8560f" text-anchor="start" font-weight="700">job C · 250 tickets</text><text x="482.0" y="388.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start" font-weight="700">counter 0</text><text x="482.0" y="414.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">step 40  (10000 ÷ tickets)</text></svg>
