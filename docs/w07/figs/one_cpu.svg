<svg xmlns="http://www.w3.org/2000/svg" viewBox="23 13 867 220" width="867" height="220" role="img"><title>One CPU with a small fast cache in front of a slow memory, and one queue of runnable jobs</title><defs></defs><rect x="23" y="13" width="867" height="220" fill="#ffffff"/><rect x="60.0" y="20.0" width="260.0" height="50.0" rx="8" fill="#eef3fa" stroke="#1f3864" stroke-width="1.6"/><text x="190.0" y="50.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">CPU</text><rect x="75.0" y="78.0" width="230.0" height="34.0" rx="4" fill="#fdf2d6" stroke="#b8560f" stroke-width="1.2"/><text x="190.0" y="99.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b8560f" text-anchor="middle" font-weight="700">cache</text><line x1="190.0" y1="114.0" x2="190.0" y2="170.0" stroke="#5b6675" stroke-width="2"/><rect x="30.0" y="170.0" width="320.0" height="56.0" rx="0" fill="#f3f4f6" stroke="#5b6675" stroke-width="1.6"/><text x="190.0" y="204.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1b2430" text-anchor="middle" font-weight="700">memory</text><text x="440.0" y="54.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="start" font-weight="700">queue</text><rect x="520.0" y="26.0" width="70.0" height="46.0" rx="0" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="555.0" y="54.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">A</text><rect x="596.0" y="26.0" width="70.0" height="46.0" rx="0" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.2"/><text x="631.0" y="54.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">B</text><rect x="672.0" y="26.0" width="70.0" height="46.0" rx="0" fill="#b8560f" stroke="#b8560f" stroke-width="1.2"/><text x="707.0" y="54.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">C</text><text x="440.0" y="125.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">a cache: a small fast memory that keeps copies of recently used</text><text x="440.0" y="144.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">data. First fetch from memory: tens to hundreds of nanoseconds. A</text><text x="440.0" y="164.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">repeat from the cache: a few.</text></svg>
