<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1000" height="560" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Without a dummy node the empty queue is a special case, and both ends must change together</text><rect x="20" y="46" width="960" height="220" rx="6" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.2"/><text x="34" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#B03A2E" text-anchor="start" font-weight="bold">No dummy</text><text x="50" y="100" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">empty:</text><text x="50" y="120" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">head = NULL</text><text x="50" y="140" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">tail = NULL</text><text x="250" y="100" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="start" font-weight="bold">enqueue 5 into the empty queue</text><rect x="290" y="150" width="70" height="36" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.4"/><text x="325" y="173" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">5</text><text x="270" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#B03A2E" text-anchor="middle" font-weight="bold">head</text><defs><marker id="mB03A2E" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B03A2E"/></marker></defs><line x1="270" y1="126" x2="300" y2="148" stroke="#B03A2E" stroke-width="1.5" marker-end="url(#mB03A2E)"/><text x="370" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="middle" font-weight="bold">tail</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="370" y1="126" x2="345" y2="148" stroke="#1F3864" stroke-width="1.5" marker-end="url(#m1F3864)"/><text x="250" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B03A2E" text-anchor="start" font-weight="bold">must write head AND tail:</text><text x="250" y="228" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B03A2E" text-anchor="start">needs both locks</text><text x="510" y="100" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="start" font-weight="bold">dequeue the last item</text><text x="510" y="128" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">head = NULL</text><text x="510" y="148" font-family="'Courier New', monospace" font-size="12.5" fill="#B03A2E" text-anchor="start" font-weight="bold">tail = NULL</text><text x="510" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B03A2E" text-anchor="start" font-weight="bold">must write head AND tail:</text><text x="510" y="228" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B03A2E" text-anchor="start">needs both locks</text><rect x="730" y="88" width="236" height="160" rx="6" fill="#fff" stroke="#B03A2E" stroke-width="1.2"/><text x="742" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">enqueuer: tail lock, then head</text><text x="742" y="132" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">dequeuer: head lock, then tail</text><text x="742" y="154" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">each can hold one and wait</text><text x="742" y="176" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">for the other: deadlock.</text><text x="742" y="198" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">Or both always take both</text><text x="742" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">locks: no concurrency left.</text><rect x="20" y="282" width="960" height="196" rx="6" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.2"/><text x="34" y="306" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2E7D32" text-anchor="start" font-weight="bold">With the dummy (Queue_Init makes one empty node D)</text><text x="50" y="336" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start" font-weight="bold">empty</text><rect x="50" y="380" width="70" height="36" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.4"/><text x="85" y="403" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">D</text><text x="60" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="middle" font-weight="bold">head</text><line x1="60" y1="364" x2="70" y2="378" stroke="#1F3864" stroke-width="1.5" marker-end="url(#m1F3864)"/><text x="110" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="middle" font-weight="bold">tail</text><line x1="110" y1="364" x2="105" y2="378" stroke="#1F3864" stroke-width="1.5" marker-end="url(#m1F3864)"/><text x="230" y="336" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start" font-weight="bold">enqueue 5: tail side only</text><rect x="230" y="380" width="70" height="36" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.4"/><text x="265" y="403" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">D</text><rect x="340" y="380" width="70" height="36" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.4"/><text x="375" y="403" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">5</text><line x1="300" y1="398" x2="338" y2="398" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><text x="250" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="middle" font-weight="bold">head</text><line x1="250" y1="364" x2="262" y2="378" stroke="#1F3864" stroke-width="1.5" marker-end="url(#m1F3864)"/><text x="390" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="middle" font-weight="bold">tail</text><line x1="390" y1="364" x2="375" y2="378" stroke="#1F3864" stroke-width="1.5" marker-end="url(#m1F3864)"/><text x="230" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2E7D32" text-anchor="start">writes D-&gt;next and tail</text><text x="500" y="336" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start" font-weight="bold">dequeue: head side only</text><rect x="500" y="380" width="70" height="36" rx="4" fill="#D6D6D6" stroke="#1F3864" stroke-width="1.4"/><text x="535" y="403" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">D</text><rect x="610" y="380" width="70" height="36" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.4"/><text x="645" y="403" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">5</text><defs><marker id="m8A8A8A" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8A8A8A"/></marker></defs><line x1="570" y1="398" x2="608" y2="398" stroke="#8A8A8A" stroke-width="1.8" marker-end="url(#m8A8A8A)"/><text x="640" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="middle" font-weight="bold">head</text><line x1="640" y1="364" x2="640" y2="378" stroke="#1F3864" stroke-width="1.5" marker-end="url(#m1F3864)"/><text x="690" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="middle" font-weight="bold">tail</text><line x1="690" y1="364" x2="670" y2="378" stroke="#1F3864" stroke-width="1.5" marker-end="url(#m1F3864)"/><text x="500" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">reads 5 from D-&gt;next, moves head to it,</text><text x="500" y="455" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">frees D; node 5 is the new dummy</text><rect x="780" y="330" width="186" height="132" rx="6" fill="#fff" stroke="#2E7D32" stroke-width="1.2"/><text x="792" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">Empty is now</text><text x="792" y="371" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">head-&gt;next == NULL,</text><text x="792" y="390" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">seen from the head</text><text x="792" y="409" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">side alone. Enqueue</text><text x="792" y="428" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">never writes head;</text><text x="792" y="447" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">dequeue never tail.</text><rect x="20" y="492" width="960" height="56" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="32" y="514" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">Michael and Scott, 1996: &quot;Because of the dummy node, enqueuers never have to access Head, and dequeuers never</text><text x="32" y="533.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">have to access Tail, thus avoiding potential deadlock problems that arise from processes trying to acquire the locks in different orders.&quot;</text></svg>