<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="980" height="330" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Why the sentence is easy to misread: in the PDF it sits under the wrong figure</text><rect x="30" y="50" width="420" height="266" rx="4" fill="#fff" stroke="#8A8A8A" stroke-width="1.4"/><text x="240" y="72" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle" font-style="italic">OSTEP chapter 29, as the PDF lays it out (sketch)</text><rect x="50" y="86" width="380" height="70" rx="2" fill="#EAF0F8" stroke="#1F3864" stroke-width="1"/><text x="60" y="108" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="start">int get(counter_t *c) {</text><text x="60" y="126" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="start">    return c-&gt;value;  }</text><text x="240" y="176" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#B03A2E" text-anchor="middle" font-weight="bold">Figure 29.1: A Counter Without Locks</text><rect x="50" y="192" width="380" height="50" rx="2" fill="#FFF3CC" stroke="#C9A227" stroke-width="1.4"/><text x="60" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">&quot;This concurrent counter is simple and</text><text x="60" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">works correctly. ... it simply adds a single lock&quot;</text><line x1="40" y1="256" x2="440" y2="256" stroke="#8A8A8A" stroke-width="1.2" stroke-dasharray="6 4"/><text x="240" y="284" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">next page: Figure 29.2: A Counter With Locks</text><defs><marker id="m2E7D32" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2E7D32"/></marker></defs><path d="M 432 216 C 520 216, 520 280, 420 280" stroke="#2E7D32" stroke-width="1.8" fill="none" marker-end="url(#m2E7D32)"/><text x="530" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2E7D32" text-anchor="start" font-weight="bold">the sentence describes this one</text><rect x="500" y="60" width="460" height="120" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="512" y="82" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">What each counter does</text><text x="512" y="102.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Without a lock: counter++ is load, add, store, and</text><text x="512" y="119.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">a second thread in the gap loses an add. Four</text><text x="512" y="137.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">threads lose most of their adds (W09 Section 1.2).</text><text x="512" y="154.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">With one lock: correct every run, but slow.</text></svg>