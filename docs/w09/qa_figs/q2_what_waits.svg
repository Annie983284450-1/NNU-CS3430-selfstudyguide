<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="940" height="430" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Nothing is &quot;locked&quot; except the variable L. Only a thread that calls lock(&amp;L) waits for it.</text><rect x="330" y="60" width="280" height="70" rx="6" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="470" y="84" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">memory: the lock variable L</text><text x="470" y="110" font-family="'Courier New', monospace" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">L = 1   (held by thread A)</text><rect x="30" y="170" width="270" height="110" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="45" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">CPU 1 runs thread A</text><text x="45" y="218.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">inside its critical section,</text><text x="45" y="235.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">running at full speed;</text><text x="45" y="253.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">A is not slowed or stopped</text><rect x="640" y="170" width="270" height="110" rx="6" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.5"/><text x="655" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#B03A2E" text-anchor="start" font-weight="bold">CPU 2 runs thread B</text><text x="655" y="218.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">B called lock(&amp;L) and is running</text><text x="655" y="235.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">while (TestAndSet(&amp;L,1) == 1) ;</text><text x="655" y="253.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">ordinary instructions: CPU 2 is busy</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="300" y1="210" x2="405" y2="132" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><text x="320" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="start">holds</text><defs><marker id="mB03A2E" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B03A2E"/></marker></defs><line x1="640" y1="210" x2="540" y2="132" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#mB03A2E)"/><text x="585" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B03A2E" text-anchor="start">swaps, again and again</text><rect x="30" y="310" width="520" height="100" rx="6" fill="#fff" stroke="#8A8A8A" stroke-width="1.2" stroke-dasharray="5 4"/><text x="45" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#2E7D32" text-anchor="start" font-weight="bold">Waiting for a CPU (ready), never for L:</text><rect x="45" y="350" width="150" height="44" rx="4" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="120.0" y="376.68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="middle">process P</text><rect x="210" y="350" width="150" height="44" rx="4" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="285.0" y="376.14" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#262626" text-anchor="middle">thread C of A&#x27;s program</text><rect x="375" y="350" width="160" height="44" rx="4" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="455.0" y="376.68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="middle">a new process</text><rect x="570" y="310" width="350" height="100" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="582" y="332" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">Can CPU 2 run P instead of B?</text><text x="582" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Yes. At the next timer interrupt the OS can</text><text x="582" y="369.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">switch CPU 2 to any ready thread. It just</text><text x="582" y="387.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">cannot tell that B&#x27;s loop is pointless.</text></svg>