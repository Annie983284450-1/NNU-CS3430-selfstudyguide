<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1000" height="470" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">How Linux gets both: a cheap rough reading, and an exact sum only when the rough one is not enough</text><rect x="20" y="50" width="960" height="92" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="32" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">Linux&#x27;s approximate counter (struct percpu_counter, lib/percpu_counter.c)</text><text x="32" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">S is called the batch. Linux sets it when CPUs come and go:  percpu_counter_batch = max(32, nr*2), nr = CPUs online.</text><text x="32" y="113.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">percpu_counter_read(): just the global count; fast, may lag.   percpu_counter_sum(): adds every CPU&#x27;s local count to it;</text><text x="32" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">exact, but much slower. Comparing the counter against a limit uses the rough reading whenever it is far enough away.</text><text x="20" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">Case 1: the rough reading is far from the limit</text><line x1="80" y1="214" x2="920" y2="214" stroke="#262626" stroke-width="1.2"/><rect x="180.8" y="200" width="302.4" height="28" rx="3" fill="#FFF3CC" stroke="#C9A227" stroke-width="1.2"/><circle cx="332.0" cy="214" r="5" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="332.0" y="246" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F3864" text-anchor="middle">rough reading</text><text x="332.0" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle">the true total is somewhere in here: rough reading, plus or minus batch x CPUs</text><line x1="710.0" y1="196" x2="710.0" y2="236" stroke="#B03A2E" stroke-width="2.5"/><text x="710.0" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B03A2E" text-anchor="middle" font-weight="bold">limit</text><text x="910" y="266" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2E7D32" text-anchor="end" font-weight="bold">the whole band is below the limit: the rough answer is safe, no sum needed</text><text x="20" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">Case 2: the rough reading is close to the limit</text><line x1="80" y1="334" x2="920" y2="334" stroke="#262626" stroke-width="1.2"/><rect x="483.2" y="320" width="302.40000000000003" height="28" rx="3" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.2"/><circle cx="634.4" cy="334" r="5" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="634.4" y="366" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F3864" text-anchor="middle">rough reading</text><text x="634.4" y="306" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle">the true total is somewhere in here: rough reading, plus or minus batch x CPUs</text><line x1="710.0" y1="316" x2="710.0" y2="356" stroke="#B03A2E" stroke-width="2.5"/><text x="710.0" y="370" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B03A2E" text-anchor="middle" font-weight="bold">limit</text><text x="910" y="386" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#B03A2E" text-anchor="end" font-weight="bold">the band crosses the limit: add up every CPU&#x27;s count (percpu_counter_sum)</text><rect x="20" y="394" width="960" height="64" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="32" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">So the recipe for choosing S</text><text x="32" y="435.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">1. Decide how far behind a reading may be (tolerable lag). 2. S can be at most lag / CPUs. 3. Measure, and take the smallest S at the knee</text><text x="32" y="454.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">of the curve (about 32 on the 4-CPU VM). 4. If one use needs the exact value, sum the local counts for that use only.</text></svg>