<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="960" height="400" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">One lock per shared thing: four critical sections run at the same moment on four CPUs</text><rect x="20" y="54" width="220" height="150" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="130" y="78" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="middle" font-weight="bold">the counter</text><rect x="40" y="92" width="180" height="34" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="130.0" y="113.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">counter_lock: held</text><rect x="40" y="140" width="180" height="44" rx="4" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="130.0" y="166.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle" font-weight="bold">CPU 1: T1 inside</text><rect x="255" y="54" width="220" height="150" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="365" y="78" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="middle" font-weight="bold">hash bucket [57]</text><rect x="275" y="92" width="180" height="34" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="365.0" y="113.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">bucket 57&#x27;s lock: held</text><rect x="275" y="140" width="180" height="44" rx="4" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="365.0" y="166.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle" font-weight="bold">CPU 2: T2 inside</text><rect x="490" y="54" width="220" height="150" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="600" y="78" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="middle" font-weight="bold">hash bucket [2]</text><rect x="510" y="92" width="180" height="34" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="600.0" y="113.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">bucket 2&#x27;s lock: held</text><rect x="510" y="140" width="180" height="44" rx="4" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="600.0" y="166.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle" font-weight="bold">CPU 3: T3 inside</text><rect x="725" y="54" width="220" height="150" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="835" y="78" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="middle" font-weight="bold">xv6 free-page list</text><rect x="745" y="92" width="180" height="34" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="835.0" y="113.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">kmem.lock: held</text><rect x="745" y="140" width="180" height="44" rx="4" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="835.0" y="166.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle" font-weight="bold">CPU 4: T4 inside</text><rect x="20" y="226" width="455" height="76" rx="6" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.2"/><text x="36" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B03A2E" text-anchor="start" font-weight="bold">T5 calls lock(counter_lock): it waits.</text><text x="36" y="272" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">It asked for a lock that T1 holds. Nobody else</text><text x="36" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">is in its way, and it is in nobody&#x27;s way.</text><defs><marker id="mB03A2E" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B03A2E"/></marker></defs><line x1="150" y1="226" x2="120" y2="186" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#mB03A2E)"/><rect x="495" y="226" width="445" height="76" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="507" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">Mutual exclusion is per lock</text><text x="507" y="268.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">At most one thread inside the sections of ONE lock.</text><text x="507" y="285.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Different locks never exclude each other.</text><rect x="20" y="318" width="920" height="70" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="32" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">Once there really was one lock for everything: the Linux &quot;big kernel lock&quot;</text><text x="32" y="360.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Only one CPU at a time could run kernel code. As machines got more CPUs it became the bottleneck, and Linux replaced it with many locks.</text></svg>