<svg xmlns="http://www.w3.org/2000/svg" width="980" height="380" viewBox="0 0 980 380" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="980" height="380" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Named after its two authors, as most algorithms in this field are</text><rect x="330" y="52" width="320" height="96" rx="6" fill="#FFF3CC" stroke="#C9A227" stroke-width="1.5"/><text x="490" y="76" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">Maged M. Michael and Michael L. Scott</text><text x="490" y="98" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">University of Rochester</text><text x="490" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">PODC 1996: &quot;Simple, Fast, and Practical</text><text x="490" y="137" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#262626" text-anchor="middle">Non-Blocking and Blocking Concurrent Queue Algorithms&quot;</text><rect x="30" y="196" width="420" height="90" rx="6" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="42" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2E7D32" text-anchor="start" font-weight="bold">Algorithm 1: a queue with no locks at all</text><text x="42" y="244" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">built on compare-and-swap; Java&#x27;s ConcurrentLinkedQueue</text><text x="42" y="263" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">is based on it (its documentation cites the paper)</text><rect x="530" y="196" width="420" height="90" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="542" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">Algorithm 2: the two-lock queue</text><text x="542" y="244" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">a head lock, a tail lock and a dummy node: the one</text><text x="542" y="263" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">in OSTEP Figure 29.9 (OSTEP cites the 1998 journal version)</text><defs><marker id="m2E7D32" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2E7D32"/></marker></defs><line x1="420" y1="150" x2="260" y2="194" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#m2E7D32)"/><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="560" y1="150" x2="720" y2="194" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><rect x="30" y="302" width="920" height="64" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="42" y="324" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">Same naming habit elsewhere: Dekker&#x27;s and Peterson&#x27;s algorithms, Lamport&#x27;s bakery, the MCS lock</text><text x="42" y="344.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">MCS = Mellor-Crummey and Scott: the same Michael L. Scott. Linux&#x27;s mutex lines up its spinning waiters with an MCS-style lock.</text></svg>