<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="980" height="560" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F3864" text-anchor="start" font-weight="bold">Load-linked leaves a watch (a reservation) on the address; any other write erases it; store-conditional checks it</text><text x="210" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="middle" font-weight="bold">T1 on CPU 1</text><text x="520" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="middle" font-weight="bold">T2 on CPU 2</text><text x="800" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="middle" font-weight="bold">flag</text><text x="905" y="62" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#8A8A8A" text-anchor="middle">watches</text><circle cx="30" cy="96" r="11" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="30" y="100.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">1</text><rect x="60" y="80" width="300" height="34" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="210.0" y="101.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle">LoadLinked(&amp;flag) -&gt; 0</text><rect x="770" y="80" width="60" height="34" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="800.0" y="102.04" font-family="'Courier New', monospace" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">0</text><text x="905" y="101" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle">T1 watches</text><circle cx="30" cy="142" r="11" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="30" y="146.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">2</text><rect x="60" y="126" width="300" height="34" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="210.0" y="147.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">(interrupted, or just slower)</text><rect x="370" y="126" width="300" height="34" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="520.0" y="147.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle">LoadLinked(&amp;flag) -&gt; 0</text><rect x="770" y="126" width="60" height="34" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="800.0" y="148.04" font-family="'Courier New', monospace" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">0</text><text x="905" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle">T1, T2</text><circle cx="30" cy="188" r="11" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="30" y="192.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">3</text><rect x="370" y="172" width="300" height="34" rx="4" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="520.0" y="193.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle">StoreConditional(&amp;flag,1) -&gt; 1</text><rect x="770" y="172" width="60" height="34" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="800.0" y="194.04" font-family="'Courier New', monospace" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">1</text><text x="905" y="193" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle">none</text><circle cx="30" cy="234" r="11" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="30" y="238.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">4</text><rect x="370" y="218" width="300" height="34" rx="4" fill="#fff" stroke="#2E7D32" stroke-width="1.5"/><text x="520.0" y="239.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">lock is mine: inside</text><rect x="770" y="218" width="60" height="34" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="800.0" y="240.04" font-family="'Courier New', monospace" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">1</text><text x="905" y="239" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle"></text><circle cx="30" cy="280" r="11" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="30" y="284.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">5</text><rect x="60" y="264" width="300" height="34" rx="4" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.5"/><text x="210.0" y="285.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle">StoreConditional(&amp;flag,1) -&gt; 0</text><rect x="770" y="264" width="60" height="34" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="800.0" y="286.04" font-family="'Courier New', monospace" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">1</text><text x="905" y="285" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle"></text><circle cx="30" cy="326" r="11" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="30" y="330.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">6</text><rect x="60" y="310" width="300" height="34" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="210.0" y="331.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">back to LoadLinked: reads 1, spins</text><rect x="770" y="310" width="60" height="34" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="800.0" y="332.04" font-family="'Courier New', monospace" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">1</text><text x="905" y="331" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle"></text><text x="355" y="195" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#B03A2E" text-anchor="end">T2&#x27;s write erases T1&#x27;s watch:</text><text x="375" y="330" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#B03A2E" text-anchor="start">flag was written after T1&#x27;s</text><text x="375" y="344" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#B03A2E" text-anchor="start">load-linked: T1&#x27;s store fails,</text><text x="375" y="358" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#B03A2E" text-anchor="start">writes nothing, returns 0</text><rect x="20" y="380" width="940" height="166" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="34" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">The one-line lock, read left to right (C stops reading an || as soon as one side is true)</text><text x="34" y="430" font-family="'Courier New', monospace" font-size="13.5" fill="#262626" text-anchor="start" font-weight="bold">while ( LoadLinked(&amp;lock-&gt;flag)  ||  !StoreConditional(&amp;lock-&gt;flag, 1) ) ;</text><text x="34" y="458" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">LoadLinked returns 1: the lock is held. The left side is true, so C skips the right side and loops again.</text><text x="34" y="482" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">LoadLinked returns 0: free. Now C runs the right side. The store succeeds (returns 1): !1 is 0, both sides false, the loop ends: lock is yours.</text><text x="34" y="506" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">The store fails (returns 0): !0 is 1, true, so loop again from the load. Exactly the two-loop code of OSTEP Figure 28.6, in one line.</text></svg>