<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="980" height="470" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">The gap is &quot;decide to sleep&quot; and &quot;be asleep&quot; being two steps. Real systems close it in two ways.</text><rect x="20" y="50" width="300" height="300" rx="6" fill="#FFF3CC" stroke="#C9A227" stroke-width="1.5"/><text x="32" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">Solaris: remember the early wake-up</text><rect x="32" y="88" width="276" height="140" rx="4" fill="#fff" stroke="#C9A227" stroke-width="1.2"/><text x="44" y="112" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">setpark()</text><text x="44" y="136" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">unpark() arrives early</text><text x="44" y="160" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">-&gt; recorded</text><text x="44" y="184" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">park() sees the record</text><text x="44" y="208" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">-&gt; returns at once</text><text x="32" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">The waker may act in the gap;</text><text x="32" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">its knock is saved.</text><rect x="340" y="50" width="300" height="300" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="352" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">Linux: check and sleep in one step</text><rect x="352" y="88" width="276" height="140" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="364" y="112" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">futex_wait(addr, 2)</text><text x="364" y="136" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">kernel, holding the lock</text><text x="364" y="160" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">of addr&#x27;s queue:</text><text x="364" y="184" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">word still 2? -&gt; sleep</text><text x="364" y="208" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">word changed? -&gt; return</text><text x="352" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">The waker changes the word</text><text x="352" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">before futex_wake: the check</text><text x="352" y="302" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">catches it (EAGAIN).</text><rect x="660" y="50" width="300" height="300" rx="6" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="672" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">xv6: hand the guard to the kernel</text><rect x="672" y="88" width="276" height="140" rx="4" fill="#fff" stroke="#2E7D32" stroke-width="1.2"/><text x="684" y="112" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">acquire(&amp;p-&gt;lock);</text><text x="684" y="136" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">release(lk);</text><text x="684" y="160" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">p-&gt;state = SLEEPING;</text><text x="684" y="184" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">sched();</text><text x="684" y="208" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">wakeup() needs p-&gt;lock</text><text x="672" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Nobody can wake the process</text><text x="672" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">until it has finished lying</text><text x="672" y="302" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">down: no gap to land in.</text><text x="180" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C9A227" text-anchor="middle" font-weight="bold">kind 1: remember it</text><text x="660" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">kind 2: make the check and the sleep one step</text><line x1="30" y1="382" x2="330" y2="382" stroke="#C9A227" stroke-width="2"/><line x1="340" y1="382" x2="960" y2="382" stroke="#1F3864" stroke-width="2"/><rect x="20" y="396" width="940" height="60" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="32" y="418" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">In your own programs you never write this by hand</text><text x="32" y="438.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">pthread_mutex_lock() on Linux is built on futex_wait, so the gap is already closed for you.</text></svg>