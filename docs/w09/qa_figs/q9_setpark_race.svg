<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="980" height="640" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">One CPU. T1 holds the lock; T2 calls lock(). The race lives between line 21 and line 22.</text><text x="150" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F3864" text-anchor="middle" font-weight="bold">T2</text><text x="450" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F3864" text-anchor="middle" font-weight="bold">T1</text><text x="670" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#8A8A8A" text-anchor="middle">flag</text><text x="760" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#8A8A8A" text-anchor="middle">queue</text><text x="880" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#8A8A8A" text-anchor="middle">T2 is</text><circle cx="30" cy="89" r="11" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="30" y="93.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">1</text><rect x="50" y="72" width="220" height="34" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="160.0" y="93.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">line 14: take the guard</text><text x="670" y="94" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">1</text><text x="760" y="94" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">[ ]</text><text x="880" y="94" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">awake</text><circle cx="30" cy="129" r="11" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="30" y="133.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">2</text><rect x="50" y="112" width="220" height="34" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="160.0" y="133.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">line 20: queue_add(T2)</text><text x="670" y="134" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">1</text><text x="760" y="134" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">[T2]</text><text x="880" y="134" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">awake</text><circle cx="30" cy="169" r="11" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="30" y="173.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">3</text><rect x="50" y="152" width="220" height="34" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="160.0" y="173.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">line 21: guard = 0</text><text x="670" y="174" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">1</text><text x="760" y="174" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">[T2]</text><text x="880" y="174" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">awake</text><line x1="40" y1="210" x2="960" y2="210" stroke="#8A8A8A" stroke-width="1" stroke-dasharray="5 4"/><rect x="300" y="198" width="300" height="24" rx="4" fill="#fff" stroke="#fff" stroke-width="0"/><text x="450" y="215" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle" font-style="italic">timer interrupt: switch to T1</text><circle cx="30" cy="249" r="11" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="30" y="253.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">4</text><rect x="290" y="232" width="330" height="34" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="455.0" y="253.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">line 27: take the guard</text><text x="670" y="254" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">1</text><text x="760" y="254" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">[T2]</text><text x="880" y="254" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">awake</text><circle cx="30" cy="289" r="11" fill="#B03A2E" stroke="#B03A2E" stroke-width="1.5"/><text x="30" y="293.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">5</text><rect x="290" y="272" width="330" height="34" rx="4" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.5"/><text x="455.0" y="293.14" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#262626" text-anchor="middle">line 32: unpark(T2): T2 is not asleep, nothing happens</text><text x="670" y="294" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">1</text><text x="760" y="294" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">[ ]</text><text x="880" y="294" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">awake</text><circle cx="30" cy="329" r="11" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="30" y="333.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">6</text><rect x="290" y="312" width="330" height="34" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="455.0" y="333.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">line 34: guard = 0, carry on</text><text x="670" y="334" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">1</text><text x="760" y="334" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">[ ]</text><text x="880" y="334" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">awake</text><line x1="40" y1="370" x2="960" y2="370" stroke="#8A8A8A" stroke-width="1" stroke-dasharray="5 4"/><rect x="300" y="358" width="300" height="24" rx="4" fill="#fff" stroke="#fff" stroke-width="0"/><text x="450" y="375" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle" font-style="italic">later: switch back to T2</text><circle cx="30" cy="409" r="11" fill="#B03A2E" stroke="#B03A2E" stroke-width="1.5"/><text x="30" y="413.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">7</text><rect x="50" y="392" width="220" height="34" rx="4" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.5"/><text x="160.0" y="413.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">line 22: park()</text><text x="670" y="414" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">1</text><text x="760" y="414" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">[ ]</text><text x="880" y="414" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#B03A2E" text-anchor="middle" font-weight="bold">asleep forever</text><rect x="20" y="440" width="940" height="74" rx="6" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.2"/><text x="34" y="462" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#B03A2E" text-anchor="start" font-weight="bold">Result: the lock belongs to T2 (flag 1, T2 already removed from the queue), and T2 is asleep with nobody left to wake it.</text><text x="34" y="484" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Every later caller sees flag 1, queues, and sleeps too. The wake-up came in step 5, before the sleep in step 7, and an</text><text x="34" y="504" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">unpark() aimed at a thread that is awake leaves no trace.</text><rect x="20" y="528" width="940" height="98" rx="6" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.2"/><text x="34" y="550" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#2E7D32" text-anchor="start" font-weight="bold">With setpark() between steps 2 and 3</text><text x="34" y="574" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">T2 calls setpark(): &quot;I am about to park.&quot; Now the unpark in step 5 is not lost: the system records &quot;a wake-up is waiting for T2&quot;.</text><text x="34" y="596" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">In step 7, park() sees that record and returns at once instead of sleeping. T2 carries on as the owner of the lock.</text></svg>