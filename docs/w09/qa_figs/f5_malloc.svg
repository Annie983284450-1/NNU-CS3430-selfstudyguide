<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="980" height="320" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Why malloc() needs no list lock: the new node is private until two lines link it in</text><rect x="20" y="50" width="300" height="170" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.4"/><text x="34" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">1. no lock held</text><text x="34" y="100" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">new = malloc(...);</text><text x="34" y="122" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">new-&gt;key = key;</text><rect x="60" y="150" width="90" height="36" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="105.0" y="172.68" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">new: 42</text><text x="160" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">only this thread</text><text x="160" y="178" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">knows the address</text><rect x="340" y="50" width="300" height="170" rx="6" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.4"/><text x="354" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#2E7D32" text-anchor="start" font-weight="bold">2. lock held: 2 lines</text><text x="354" y="100" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">new-&gt;next = L-&gt;head;</text><text x="354" y="122" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">L-&gt;head = new;</text><rect x="360" y="150" width="70" height="36" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="395.0" y="172.68" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">42</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="432" y1="168" x2="470" y2="168" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><rect x="472" y="150" width="60" height="36" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="502.0" y="172.68" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">7</text><line x1="534" y1="168" x2="560" y2="168" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><rect x="562" y="150" width="60" height="36" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="592.0" y="172.68" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">3</text><text x="380" y="206" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2E7D32" text-anchor="start">now shared: every thread can reach it</text><rect x="660" y="50" width="300" height="170" rx="6" fill="#fff" stroke="#8A8A8A" stroke-width="1.4"/><text x="674" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">and malloc() itself?</text><text x="674" y="100" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">The C library guards its own</text><text x="674" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">heap data with its own lock,</text><text x="674" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">so many threads may call</text><text x="674" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">malloc() at once. That lock</text><text x="674" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">is the library&#x27;s business,</text><text x="674" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">not the list&#x27;s.</text><rect x="20" y="236" width="940" height="70" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="32" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">The rule: a lock is for shared data, not for &quot;items&quot; or &quot;space&quot;</text><text x="32" y="278.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Code that touches only memory no other thread can reach needs no lock. Moving it out also means the rare failure path</text><text x="32" y="295.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">(malloc returns NULL) has no lock to forget to release.</text></svg>