<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="980" height="520" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F3864" text-anchor="start" font-weight="bold">Two locks with two jobs: the guard is held for a few instructions, the flag for the whole critical section</text><text x="20" y="78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#8A8A8A" text-anchor="start">T1&#x27;s time</text><rect x="140" y="58" width="70" height="34" rx="3" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="175.0" y="80" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle" font-weight="bold">lock()</text><rect x="210" y="58" width="400" height="34" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="410.0" y="80" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">critical section (the user&#x27;s code)</text><rect x="610" y="58" width="90" height="34" rx="3" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="655.0" y="80" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle" font-weight="bold">unlock()</text><text x="20" y="128" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#C9A227" text-anchor="start" font-weight="bold">guard held</text><rect x="150" y="112" width="50" height="24" rx="3" fill="#FFF3CC" stroke="#C9A227" stroke-width="1.5"/><rect x="620" y="112" width="60" height="24" rx="3" fill="#FFF3CC" stroke="#C9A227" stroke-width="1.5"/><text x="280" y="129" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C9A227" text-anchor="start">only inside lock() and unlock(): a few instructions</text><text x="20" y="168" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="start" font-weight="bold">flag = 1</text><rect x="195" y="152" width="495" height="24" rx="3" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="440" y="169" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="middle">from lock() until unlock(): the lock the user asked for</text><rect x="720" y="52" width="240" height="128" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="732" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">In a restaurant</text><text x="732" y="93.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">flag: &quot;table taken&quot; sign</text><text x="732" y="110.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">queue: the waiting list</text><text x="732" y="126.8" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">guard: the host&#x27;s pen; one</text><text x="732" y="143.6" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">person writes on the list</text><text x="732" y="160.39999999999998" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">or flips the sign at a time</text><text x="20" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F3864" text-anchor="start" font-weight="bold">The hand-off: T1 unlocks while T2 sleeps first in the queue</text><rect x="20" y="236" width="300" height="130" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.4"/><text x="32" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">1. before: T1 holds the lock</text><text x="32" y="284" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="start" font-weight="bold">flag = 1</text><text x="32" y="308" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="start">queue: [T2, T3]</text><text x="32" y="332.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">T2 and T3 asleep in park()</text><rect x="340" y="236" width="300" height="130" rx="6" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.4"/><text x="352" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">2. unlock(): unpark(T2)</text><text x="352" y="284" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="start" font-weight="bold">flag = 1 (unchanged)</text><text x="352" y="308" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="start">queue: [T3]</text><text x="352" y="332.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">T2 is woken. The flag is not</text><text x="352" y="348.8" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">cleared: T2 owns the lock now.</text><rect x="660" y="236" width="300" height="130" rx="6" fill="#E3F2E1" stroke="#1F3864" stroke-width="1.4"/><text x="672" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">3. T2 returns from park()</text><text x="672" y="284" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="start" font-weight="bold">flag = 1</text><text x="672" y="308" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="start">queue: [T3]</text><text x="672" y="332.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">already the owner: straight into</text><text x="672" y="348.8" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">its critical section</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="322" y1="300" x2="338" y2="300" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><line x1="642" y1="300" x2="658" y2="300" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><rect x="20" y="384" width="940" height="120" rx="6" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.2"/><text x="34" y="408" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#B03A2E" text-anchor="start" font-weight="bold">Why not set flag = 0 and let T2 take the lock itself?</text><text x="34" y="432" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">T2 wakes up as if returning from park(), in the middle of lock(), without the guard, so it cannot safely look at the flag.</text><text x="34" y="454" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">To try again it would have to go back to the top and take the guard. Meanwhile a newcomer, T4, could find flag = 0 and take</text><text x="34" y="476" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">the lock first, and T2 would go back to sleep. Leaving the flag at 1 passes ownership in the same instant: nobody can slip in.</text></svg>