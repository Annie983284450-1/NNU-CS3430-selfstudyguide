<svg xmlns="http://www.w3.org/2000/svg" width="980" height="450" viewBox="0 0 980 450"><rect width="980" height="450" fill="#fff"/><text x="20" y="30" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Three cases at each signal: what the sleepers wait for, and what the signaling code can tell</text><text x="20" y="52" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#8A8A8A" text-anchor="start">It is the signaling code that must be able to tell, from what it knows at that line, not the reader of a trace.</text><rect x="20" y="70" width="300" height="280" rx="8" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="34" y="96" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2E7D32" text-anchor="start" font-weight="bold">Case 1. One kind of sleeper,</text><text x="34" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2E7D32" text-anchor="start" font-weight="bold">and the code knows one can go on</text><text x="34" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start" font-weight="bold">Signal is enough</text><text x="34" y="162" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Figure 30.12: only consumers sleep on fill.</text><text x="34" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">After put(), one item is there, and any</text><text x="34" y="198" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">consumer can take it.</text><rect x="34" y="222" width="78" height="28" rx="4" fill="#fff" stroke="#2E7D32" stroke-width="1.5"/><text x="73.0" y="240.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle">fill</text><rect x="120" y="222" width="30.6" height="28" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="135.3" y="240.14" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#262626" text-anchor="middle" font-weight="bold">Tc1</text><rect x="156.6" y="222" width="30.6" height="28" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="171.9" y="240.14" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#262626" text-anchor="middle" font-weight="bold">Tc2</text><text x="34" y="292" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">put() signals fill. Whichever</text><text x="34" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">consumer wakes can go on.</text><rect x="340" y="70" width="300" height="280" rx="8" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.5"/><text x="354" y="96" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#B03A2E" text-anchor="start" font-weight="bold">Case 2. Two kinds of sleeper</text><text x="354" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#B03A2E" text-anchor="start" font-weight="bold">on one queue</text><text x="354" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start" font-weight="bold">Give each kind its own queue</text><text x="354" y="162" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Figures 30.10 and 30.11: producers and</text><text x="354" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">consumers share cond. A consumer&#x27;s signal</text><text x="354" y="198" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">can wake the other consumer.</text><rect x="354" y="222" width="78" height="28" rx="4" fill="#fff" stroke="#B03A2E" stroke-width="1.5"/><text x="393.0" y="240.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle">cond</text><rect x="440" y="222" width="23.4" height="28" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="451.7" y="240.14" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#262626" text-anchor="middle" font-weight="bold">Tp</text><rect x="469.4" y="222" width="30.6" height="28" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="484.7" y="240.14" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#262626" text-anchor="middle" font-weight="bold">Tc2</text><text x="354" y="292" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Signal: all three end up asleep.</text><text x="354" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Broadcast works, but hides the flaw.</text><text x="354" y="328" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Fix: two queues (Figure 30.12).</text><rect x="660" y="70" width="300" height="280" rx="8" fill="#FFF3CC" stroke="#8a6d00" stroke-width="1.5"/><text x="674" y="96" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#8a6d00" text-anchor="start" font-weight="bold">Case 3. The code cannot tell</text><text x="674" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#8a6d00" text-anchor="start" font-weight="bold">which sleeper the change helps</text><text x="674" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start" font-weight="bold">Broadcast</text><text x="674" y="162" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Figure 30.15: after free(50), Tb (10) can</text><text x="674" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">go on and Ta (100) cannot. free() never</text><text x="674" y="198" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">sees their sizes.</text><rect x="674" y="222" width="78" height="28" rx="4" fill="#fff" stroke="#C9A227" stroke-width="1.5"/><text x="713.0" y="240.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle">c</text><rect x="760" y="222" width="59.4" height="28" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="789.7" y="240.14" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#262626" text-anchor="middle" font-weight="bold">Ta: 100</text><rect x="825.4" y="222" width="52.2" height="28" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="851.5" y="240.14" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#262626" text-anchor="middle" font-weight="bold">Tb: 10</text><text x="674" y="292" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Each woken thread checks its while.</text><text x="674" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">&quot;may be the most straightforward</text><text x="674" y="328" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">solution available&quot;</text><rect x="20" y="368" width="940" height="66" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="34" y="392" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F3864" text-anchor="start" font-weight="bold">In every case, keep the while loop</text><text x="34" y="416" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">A woken thread checks its condition again with the lock held. With broadcast, most of them find it still false and sleep again.</text></svg>