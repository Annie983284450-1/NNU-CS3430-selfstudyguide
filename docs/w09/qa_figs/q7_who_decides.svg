<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="980" height="400" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Two decisions: WHO may have the lock next (the lock&#x27;s rule) and WHEN they run (the scheduler)</text><rect x="20" y="50" width="225" height="250" rx="6" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.5"/><text x="32" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">Spin lock (test-and-set)</text><text x="32" y="102" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Who: nobody decides.</text><text x="32" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">The first thread whose swap</text><text x="32" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">returns 0 after the unlock</text><text x="32" y="168" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">wins. That depends on which</text><text x="32" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">threads happen to be on a</text><text x="32" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">CPU, and on hardware timing.</text><text x="32" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Unfair: a thread can lose</text><text x="32" y="256" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">every round.</text><rect x="260" y="50" width="225" height="250" rx="6" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="272" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">Ticket lock</text><text x="272" y="102" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Who: arrival order.</text><text x="272" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Your ticket number is fixed</text><text x="272" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">when you arrive; unlock</text><text x="272" y="168" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">moves turn on by 1.</text><text x="272" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">The scheduler only decides</text><text x="272" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">when the winner gets to run,</text><text x="272" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">not who wins.</text><text x="272" y="256" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Fair.</text><rect x="500" y="50" width="225" height="250" rx="6" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="512" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">Queue lock (Figure 28.9)</text><text x="512" y="102" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Who: the lock&#x27;s own queue.</text><text x="512" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">unlock() removes the first</text><text x="512" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">name and hands it the lock.</text><text x="512" y="168" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">The scheduler only decides</text><text x="512" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">when the woken thread gets</text><text x="512" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">a CPU to carry on.</text><text x="512" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start"></text><text x="512" y="256" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Fair.</text><rect x="740" y="50" width="225" height="250" rx="6" fill="#FFF3CC" stroke="#C9A227" stroke-width="1.5"/><text x="752" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">Linux mutex (futex)</text><text x="752" y="102" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Who: partly the kernel,</text><text x="752" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">partly timing. The kernel</text><text x="752" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">wakes one sleeper (no order</text><text x="752" y="168" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">promised); a thread that is</text><text x="752" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">already running can take</text><text x="752" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">the lock before it does.</text><text x="752" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start"></text><text x="752" y="256" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Fast, not strictly fair.</text><rect x="20" y="316" width="940" height="70" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="32" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">The scheduler decides who gets a CPU. The lock decides who gets in.</text><text x="32" y="358.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Spin and yield locks leave WHO gets in to chance, which is why OSTEP 28.14 opens with &quot;they leave too much to chance&quot;.</text></svg>