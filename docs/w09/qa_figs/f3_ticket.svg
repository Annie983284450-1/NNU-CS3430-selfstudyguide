<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="980" height="300" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Two numbers: the ticket you take, and the turn on the sign. You are in only when they match.</text><rect x="30" y="52" width="200" height="110" rx="6" fill="#FFF3CC" stroke="#C9A227" stroke-width="1.5"/><text x="130" y="76" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">ticket dispenser</text><text x="130" y="112" font-family="'Courier New', monospace" font-size="20" fill="#262626" text-anchor="middle" font-weight="bold">next: 3</text><text x="130" y="144" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#262626" text-anchor="middle">FetchAndAdd: take one</text><text x="130" y="158" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#262626" text-anchor="middle"></text><rect x="750" y="52" width="200" height="110" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="850" y="76" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">now serving (turn)</text><text x="850" y="112" font-family="'Courier New', monospace" font-size="26" fill="#262626" text-anchor="middle" font-weight="bold">1</text><text x="850" y="144" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#262626" text-anchor="middle">unlock moves it on by 1</text><rect x="270" y="60" width="140" height="96" rx="6" fill="#fff" stroke="#8A8A8A" stroke-width="1.4"/><text x="340" y="84" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">thread A</text><text x="340" y="108" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">myturn = 0</text><text x="340" y="136" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#8A8A8A" text-anchor="middle" font-weight="bold">done</text><rect x="430" y="60" width="140" height="96" rx="6" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.4"/><text x="500" y="84" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">thread B</text><text x="500" y="108" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">myturn = 1</text><text x="500" y="136" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">1 == 1: inside</text><rect x="590" y="60" width="140" height="96" rx="6" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.4"/><text x="660" y="84" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">thread C</text><text x="660" y="108" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">myturn = 2</text><text x="660" y="136" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#B03A2E" text-anchor="middle" font-weight="bold">2 != 1: waits</text><rect x="30" y="182" width="920" height="108" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="42" y="204" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F3864" text-anchor="start" font-weight="bold">Read the code with the two numbers in mind (OSTEP Figure 28.7)</text><text x="42" y="230" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="start" font-weight="bold">12  int myturn = FetchAndAdd(&amp;lock-&gt;ticket);</text><text x="460" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="start">take a number: this does NOT give you the lock</text><text x="42" y="252" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="start" font-weight="bold">13  while (lock-&gt;turn != myturn) ;</text><text x="460" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="start">wait for the sign to show your number: NOW the lock is yours</text><text x="42" y="274" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="start" font-weight="bold">18  lock-&gt;turn = lock-&gt;turn + 1;</text><text x="460" y="274" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="start">unlock: call the next number</text></svg>