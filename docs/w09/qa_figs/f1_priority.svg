<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="980" height="330" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Two meanings of &quot;correct&quot;: on one CPU the lock still excludes, but the system can hang</text><text x="20" y="72" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="start" font-weight="bold">T2 (high priority)</text><text x="20" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="start" font-weight="bold">T1 (low priority)</text><rect x="170" y="54" width="102" height="30" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="221.0" y="73.14" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="middle">blocked on I/O</text><rect x="272" y="54" width="646" height="30" rx="3" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.2"/><text x="595.0" y="73.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B03A2E" text-anchor="middle" font-weight="bold">I/O done: runs at once, wants the lock, spins forever</text><rect x="170" y="102" width="34" height="30" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><rect x="204" y="102" width="68" height="30" rx="3" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.2"/><text x="238.0" y="121.14" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#262626" text-anchor="middle">lock(); inside</text><rect x="272" y="102" width="646" height="30" rx="3" fill="#D6D6D6" stroke="#1F3864" stroke-width="1.2"/><text x="595.0" y="121.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle">never scheduled again: T2 always outranks it</text><line x1="272" y1="46" x2="272" y2="140" stroke="#C9A227" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="20" y="160" width="460" height="156" rx="6" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.2"/><text x="32" y="182" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#2E7D32" text-anchor="start" font-weight="bold">Mutual exclusion: fine</text><text x="32" y="202.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Only T1 was ever inside. The spin lock did</text><text x="32" y="219.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">exactly what a lock must do. In OSTEP 28.8&#x27;s</text><text x="32" y="237.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">sense (&quot;does it provide mutual exclusion?&quot;)</text><text x="32" y="254.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">the spin lock is correct.</text><rect x="500" y="160" width="460" height="156" rx="6" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.2"/><text x="512" y="182" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#B03A2E" text-anchor="start" font-weight="bold">The system: hung</text><text x="512" y="202.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">T1 must run to unlock, and the scheduler never</text><text x="512" y="219.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">runs it while T2 can run. That is the aside&#x27;s</text><text x="512" y="237.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">&quot;correctness&quot;. Fixes it offers: avoid spin locks</text><text x="512" y="254.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">here; more generally, priority inheritance</text><text x="512" y="272.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">(lend T1 the waiter&#x27;s priority); or give all</text><text x="512" y="289.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">threads the same priority.</text></svg>