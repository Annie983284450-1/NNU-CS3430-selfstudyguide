<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="980" height="520" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Rule 2 in a picture: spin for as long as one sleep-and-wake would cost (C), then sleep</text><line x1="90" y1="328" x2="550" y2="328" stroke="#262626" stroke-width="1.2"/><line x1="90" y1="60" x2="90" y2="328" stroke="#262626" stroke-width="1.2"/><text x="320.0" y="362" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle">how long the lock stays held after you arrive (W)</text><text x="20" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">your cost</text><line x1="243.33333333333331" y1="328" x2="243.33333333333331" y2="333" stroke="#262626" stroke-width="1"/><text x="243.33333333333331" y="346" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">C</text><line x1="396.66666666666663" y1="328" x2="396.66666666666663" y2="333" stroke="#262626" stroke-width="1"/><text x="396.66666666666663" y="346" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">2C</text><line x1="85" y1="206.1818181818182" x2="90" y2="206.1818181818182" stroke="#262626" stroke-width="1"/><text x="81" y="210.1818181818182" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="end">C</text><line x1="90" y1="206.1818181818182" x2="550" y2="206.1818181818182" stroke="#D6D6D6" stroke-width="0.8" stroke-dasharray="3 3"/><line x1="85" y1="84.36363636363637" x2="90" y2="84.36363636363637" stroke="#262626" stroke-width="1"/><text x="81" y="88.36363636363637" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="end">2C</text><line x1="90" y1="84.36363636363637" x2="550" y2="84.36363636363637" stroke="#D6D6D6" stroke-width="0.8" stroke-dasharray="3 3"/><path d="M 90.0 328.0 L 243.33333333333331 206.1818181818182 L 550.0 206.1818181818182" stroke="#2E7D32" stroke-width="3" fill="none"/><path d="M 90.0 328.0 L 243.33333333333331 206.1818181818182 L 243.33333333333331 84.36363636363637 L 550.0 84.36363636363637" stroke="#B03A2E" stroke-width="2.2" fill="none" stroke-dasharray="7 4"/><path d="M 90.0 200.1818181818182 L 550.0 200.1818181818182" stroke="#1F3864" stroke-width="1.6" fill="none" stroke-dasharray="2 3"/><path d="M 90.0 328.0 L 427.33333333333337 60.0" stroke="#C9A227" stroke-width="1.6" fill="none" stroke-dasharray="2 3"/><line x1="580" y1="80" x2="610" y2="80" stroke="#2E7D32" stroke-width="3"/><text x="620" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2E7D32" text-anchor="start" font-weight="bold">best possible, if you knew W in advance: min(W, C)</text><line x1="580" y1="108" x2="610" y2="108" stroke="#B03A2E" stroke-width="2.2" stroke-dasharray="7 4"/><text x="620" y="113" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B03A2E" text-anchor="start" font-weight="bold">spin up to C, then sleep: never above 2C</text><line x1="580" y1="136" x2="610" y2="136" stroke="#1F3864" stroke-width="1.6" stroke-dasharray="2 3"/><text x="620" y="141" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="start">always sleep at once: C, even when W is tiny</text><line x1="580" y1="164" x2="610" y2="164" stroke="#C9A227" stroke-width="1.6" stroke-dasharray="2 3"/><text x="620" y="169" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C9A227" text-anchor="start">always spin: W, without limit</text><rect x="580" y="196" width="380" height="164" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="592" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">Why &quot;at most twice the best&quot;</text><text x="592" y="237.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">W shorter than C: you spin W and get in.</text><text x="592" y="254.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">That is exactly the best possible.</text><text x="592" y="270.79999999999995" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">W longer than C: you spin C, then sleep for</text><text x="592" y="287.59999999999997" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">another C: 2C in total. The best possible</text><text x="592" y="304.4" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">was C (sleep at once). So you are never</text><text x="592" y="321.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">worse than twice the best, whatever W is.</text><rect x="20" y="396" width="940" height="112" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="32" y="418" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">What real systems do</text><text x="32" y="438.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Rule 1, a fixed count: glibc&#x27;s adaptive mutex spins at most glibc.pthread.mutex_spin_count times (100 by default), then sleeps.</text><text x="32" y="459.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Rule 2, this chart: spin for about the cost of a sleep and a wake-up; studied by Karlin and colleagues in 1991.</text><text x="32" y="480.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Rule 3, a better question: the Linux kernel&#x27;s mutex spins only while the lock&#x27;s owner is running on a CPU, and sleeps at once</text><text x="32" y="501.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">if the owner is not running, because then spinning cannot end soon.</text></svg>