<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="940" height="420" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Two CPUs, one spin lock: how long B spins is how long A stays inside</text><text x="20" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#2E7D32" text-anchor="start" font-weight="bold">Case 1. The critical section is short (a few instructions): the assumption holds</text><text x="20" y="100" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">CPU 1</text><text x="20" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="start" font-weight="bold">Thread A</text><text x="20" y="144" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">CPU 2</text><text x="20" y="159" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="start" font-weight="bold">Thread B</text><rect x="120" y="82" width="60" height="30" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="150.0" y="101.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">work</text><rect x="180" y="82" width="42.0" height="30" rx="3" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.2"/><text x="201.0" y="101.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">inside</text><rect x="222.0" y="82" width="258.0" height="30" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="351.0" y="101.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">other work (no lock held)</text><rect x="120" y="126" width="66.0" height="30" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="153.0" y="145.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">work</text><rect x="186.0" y="126" width="35.99999999999999" height="30" rx="3" fill="#F9E0DC" stroke="#1F3864" stroke-width="1.2"/><text x="204.0" y="145.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B03A2E" text-anchor="middle" font-weight="bold">spin</text><rect x="222.0" y="126" width="42.0" height="30" rx="3" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.2"/><text x="243.0" y="145.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">inside</text><rect x="264.0" y="126" width="216.0" height="30" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="372.0" y="145.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">work</text><text x="494" y="112" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2E7D32" text-anchor="start" font-weight="bold">B lost only a sliver</text><text x="494" y="128" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2E7D32" text-anchor="start">of CPU 2&#x27;s time</text><text x="20" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#B03A2E" text-anchor="start" font-weight="bold">Case 2. The critical section is long (say A reads a file while holding the lock): the assumption fails</text><text x="20" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">CPU 1</text><text x="20" y="249" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="start" font-weight="bold">Thread A</text><text x="20" y="278" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">CPU 2</text><text x="20" y="293" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="start" font-weight="bold">Thread B</text><rect x="120" y="216" width="60" height="30" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="150.0" y="235.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">work</text><rect x="180" y="216" width="252.0" height="30" rx="3" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.2"/><text x="306.0" y="235.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">inside, for a long time</text><rect x="432.0" y="216" width="47.999999999999986" height="30" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><rect x="120" y="260" width="66.0" height="30" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="153.0" y="279.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">work</text><rect x="186.0" y="260" width="245.99999999999997" height="30" rx="3" fill="#F9E0DC" stroke="#1F3864" stroke-width="1.2"/><text x="309.0" y="279.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B03A2E" text-anchor="middle" font-weight="bold">spin, spin, spin: wasted</text><rect x="432.0" y="260" width="47.999999999999986" height="30" rx="3" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.2"/><text x="456.0" y="278.96" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#262626" text-anchor="middle">in</text><text x="494" y="246" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B03A2E" text-anchor="start" font-weight="bold">B burned CPU 2</text><text x="494" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B03A2E" text-anchor="start">for the whole section</text><rect x="20" y="318" width="900" height="88" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="32" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">&quot;Presumably the critical section is short&quot; = &quot;we assume the programmer kept it short&quot;</text><text x="32" y="360.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">The number of CPUs does not make a section short; the code inside it does. Two CPUs only guarantee that A keeps</text><text x="32" y="377.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">running while B waits, so B&#x27;s wait ends when A&#x27;s section ends. Short section: spinning is cheap. Long section: spinning wastes a CPU.</text></svg>