<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="960" height="470" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">As a lock the two give the same answers. The difference shows when the cell holds a real value.</text><rect x="20" y="50" width="190" height="32" rx="0" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="30" y="71" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="start" font-weight="bold">the flag before</text><rect x="210" y="50" width="260" height="32" rx="0" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="220" y="71" font-family="'Courier New', monospace" font-size="12.5" fill="#1F3864" text-anchor="start" font-weight="bold">TestAndSet(&amp;flag, 1)</text><rect x="470" y="50" width="260" height="32" rx="0" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="480" y="71" font-family="'Courier New', monospace" font-size="12.5" fill="#1F3864" text-anchor="start" font-weight="bold">CompareAndSwap(&amp;flag, 0, 1)</text><rect x="730" y="50" width="210" height="32" rx="0" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="740" y="71" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="start" font-weight="bold">as a lock, this means</text><rect x="20" y="82" width="190" height="34" rx="0" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="30" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">0  (free)</text><rect x="210" y="82" width="260" height="34" rx="0" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="220" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">writes 1, returns 0</text><rect x="470" y="82" width="260" height="34" rx="0" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="480" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">0 == 0, so writes 1, returns 0</text><rect x="730" y="82" width="210" height="34" rx="0" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="740" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2E7D32" text-anchor="start" font-weight="bold">you got the lock</text><rect x="20" y="116" width="190" height="34" rx="0" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="30" y="138" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">1  (held)</text><rect x="210" y="116" width="260" height="34" rx="0" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="220" y="138" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">writes 1 (no change), returns 1</text><rect x="470" y="116" width="260" height="34" rx="0" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="480" y="138" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">1 != 0, so writes nothing, returns 1</text><rect x="730" y="116" width="210" height="34" rx="0" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="740" y="138" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#B03A2E" text-anchor="start" font-weight="bold">spin and try again</text><text x="20" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">Test-and-set: no questions asked, always writes.   Compare-and-swap: compares first, writes only on a match.</text><text x="20" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F3864" text-anchor="start" font-weight="bold">What only compare-and-swap can do: add 1 to a counter with no lock at all</text><rect x="20" y="226" width="230" height="64" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.4"/><circle cx="38" cy="246" r="11" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="38" y="250.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="56" y="251" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="start" font-weight="bold">read c</text><text x="56" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">old = 41</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="252" y1="258" x2="268" y2="258" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><rect x="270" y="226" width="230" height="64" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.4"/><circle cx="288" cy="246" r="11" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="288" y="250.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="306" y="251" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="start" font-weight="bold">compute</text><text x="306" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">new = 42</text><line x1="502" y1="258" x2="518" y2="258" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><rect x="520" y="226" width="230" height="64" rx="6" fill="#E3F2E1" stroke="#1F3864" stroke-width="1.4"/><circle cx="538" cy="246" r="11" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="538" y="250.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="556" y="251" font-family="'Courier New', monospace" font-size="11" fill="#1F3864" text-anchor="start" font-weight="bold">CompareAndSwap(&amp;c, 41, 42)</text><text x="556" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">c still 41? write 42</text><rect x="770" y="226" width="170" height="64" rx="6" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.4"/><text x="782" y="251" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2E7D32" text-anchor="start" font-weight="bold">returned 41:</text><text x="782" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">success, c = 42</text><defs><marker id="m2E7D32" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2E7D32"/></marker></defs><line x1="752" y1="258" x2="768" y2="258" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#m2E7D32)"/><rect x="20" y="310" width="920" height="70" rx="6" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.2"/><text x="34" y="333" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#B03A2E" text-anchor="start" font-weight="bold">If another thread changed c first (c is now 42), step 3 returns 42, not 41: nothing is written.</text><text x="34" y="355" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Go back to step 1 with 42 and try 42 to 43. No add is ever lost, and no thread ever waits on a lock.</text><rect x="20" y="396" width="920" height="62" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="32" y="418" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">Why test-and-set cannot do this</text><text x="32" y="438.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">It can only write a value you fix in advance. &quot;Make it 42, but only if it is still 41&quot; needs the compare step.</text></svg>