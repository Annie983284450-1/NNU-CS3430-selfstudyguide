<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1000" height="470" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">A hash table: many short lists, and a rule that computes from the key which list to look in</text><rect x="20" y="50" width="300" height="300" rx="6" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.2"/><text x="34" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#B03A2E" text-anchor="start" font-weight="bold">One list of 10,000 keys</text><rect x="40" y="90" width="70" height="24" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="75.0" y="106.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle">812</text><line x1="75" y1="114" x2="75" y2="120" stroke="#1F3864" stroke-width="1.2"/><rect x="40" y="120" width="70" height="24" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="75.0" y="136.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle">57</text><line x1="75" y1="144" x2="75" y2="150" stroke="#1F3864" stroke-width="1.2"/><rect x="40" y="150" width="70" height="24" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="75.0" y="166.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle">3</text><line x1="75" y1="174" x2="75" y2="180" stroke="#1F3864" stroke-width="1.2"/><rect x="40" y="180" width="70" height="24" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="75.0" y="196.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle">9411</text><line x1="75" y1="204" x2="75" y2="210" stroke="#1F3864" stroke-width="1.2"/><rect x="40" y="210" width="70" height="24" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="75.0" y="226.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle">103</text><line x1="75" y1="234" x2="75" y2="240" stroke="#1F3864" stroke-width="1.2"/><rect x="40" y="240" width="70" height="24" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="75.0" y="256.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle">...</text><line x1="75" y1="264" x2="75" y2="270" stroke="#1F3864" stroke-width="1.2"/><rect x="40" y="270" width="70" height="24" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="75.0" y="286.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle">...</text><line x1="75" y1="294" x2="75" y2="300" stroke="#1F3864" stroke-width="1.2"/><rect x="40" y="300" width="70" height="24" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="75.0" y="316.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle">6</text><text x="124" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">lookup(6): start at the</text><text x="124" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">front and compare key</text><text x="124" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">after key. Up to 10,000</text><text x="124" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">steps, and one lock for</text><text x="124" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">the whole walk.</text><rect x="340" y="50" width="640" height="300" rx="6" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.2"/><text x="354" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#2E7D32" text-anchor="start" font-weight="bold">101 short lists (buckets), each with its own lock: bucket = key % 101</text><rect x="360" y="92" width="64" height="28" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="392.0" y="110.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">[0]</text><rect x="432" y="92" width="40" height="28" rx="4" fill="#FFF3CC" stroke="#C9A227" stroke-width="1.5"/><text x="452.0" y="109.96" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#262626" text-anchor="middle" font-weight="bold">L</text><text x="486" y="111" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">202 -&gt; 0</text><rect x="360" y="126" width="64" height="28" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="392.0" y="144.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">[1]</text><rect x="432" y="126" width="40" height="28" rx="4" fill="#FFF3CC" stroke="#C9A227" stroke-width="1.5"/><text x="452.0" y="143.96" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#262626" text-anchor="middle" font-weight="bold">L</text><text x="486" y="145" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">...</text><rect x="360" y="160" width="64" height="28" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="392.0" y="178.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">[2]</text><rect x="432" y="160" width="40" height="28" rx="4" fill="#FFF3CC" stroke="#C9A227" stroke-width="1.5"/><text x="452.0" y="177.96" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#262626" text-anchor="middle" font-weight="bold">L</text><text x="486" y="179" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">103 -&gt; 2</text><rect x="360" y="194" width="64" height="28" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="392.0" y="212.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">...</text><rect x="360" y="228" width="64" height="28" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="392.0" y="246.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">[57]</text><rect x="432" y="228" width="40" height="28" rx="4" fill="#FFF3CC" stroke="#C9A227" stroke-width="1.5"/><text x="452.0" y="245.96" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#262626" text-anchor="middle" font-weight="bold">L</text><text x="486" y="247" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">57 -&gt; 57</text><rect x="360" y="262" width="64" height="28" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="392.0" y="280.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">...</text><rect x="360" y="296" width="64" height="28" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="392.0" y="314.32" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">[100]</text><rect x="432" y="296" width="40" height="28" rx="4" fill="#FFF3CC" stroke="#C9A227" stroke-width="1.5"/><text x="452.0" y="313.96" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#262626" text-anchor="middle" font-weight="bold">L</text><text x="486" y="315" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">...</text><text x="640" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Insert 103: 103 % 101 = 2,</text><text x="640" y="131" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">so it goes in bucket [2].</text><text x="640" y="152" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start"></text><text x="640" y="173" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Lookup 103: compute 2 again</text><text x="640" y="194" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">and walk only bucket [2]:</text><text x="640" y="215" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">about 10,000 / 101 = 99 keys</text><text x="640" y="236" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">instead of 10,000.</text><rect x="20" y="366" width="960" height="90" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="34" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">Why chapter 29 cares: one lock per bucket</text><text x="34" y="414" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">T1 looks up 57 and locks bucket [57]; T2 looks up 103 and locks bucket [2]. Different keys usually mean different</text><text x="34" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">buckets, so different locks, and the two walks run at the same time. Python&#x27;s dict and Java&#x27;s HashMap are hash tables too.</text></svg>