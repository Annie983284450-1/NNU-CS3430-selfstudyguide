<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="980" height="540" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Choosing a lock: three questions, in this order</text><rect x="40" y="50" width="400" height="56" rx="8" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="240.0" y="74" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="middle" font-weight="bold">1. Is the waiter somewhere it must not sleep?</text><text x="240.0" y="93" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">an interrupt handler, or kernel code with interrupts off</text><rect x="520" y="46" width="440" height="92" rx="6" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.5"/><text x="532" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B03A2E" text-anchor="start" font-weight="bold">yes: spin lock, the only option</text><text x="532" y="90" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">Sleeping means switching to another thread, and code</text><text x="532" y="108" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">that runs with interrupts off may not do that. xv6&#x27;s</text><text x="532" y="126" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">acquire() turns interrupts off for this reason.</text><defs><marker id="mB03A2E" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B03A2E"/></marker></defs><line x1="440" y1="78" x2="518" y2="78" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#mB03A2E)"/><text x="470" y="70" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B03A2E" text-anchor="start" font-weight="bold">yes</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="240" y1="106" x2="240" y2="158" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><text x="250" y="138" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="start" font-weight="bold">no</text><rect x="40" y="160" width="400" height="56" rx="8" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="240.0" y="184" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="middle" font-weight="bold">2. Can the holder stop running while it holds the lock?</text><text x="240.0" y="203" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">it waits for the disk, or more threads than CPUs, or one CPU</text><rect x="520" y="156" width="440" height="92" rx="6" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="532" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2E7D32" text-anchor="start" font-weight="bold">yes: sleeping lock</text><text x="532" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">A waiter would spin while the holder cannot finish.</text><text x="532" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">xv6 uses sleeplock for disk buffers and inodes,</text><text x="532" y="236" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">because it holds them while the disk works.</text><defs><marker id="m2E7D32" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2E7D32"/></marker></defs><line x1="440" y1="188" x2="518" y2="188" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#m2E7D32)"/><text x="470" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2E7D32" text-anchor="start" font-weight="bold">yes</text><line x1="240" y1="216" x2="240" y2="268" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><text x="250" y="248" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="start" font-weight="bold">no</text><rect x="40" y="270" width="400" height="56" rx="8" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="240.0" y="294" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="middle" font-weight="bold">3. Is the section a few instructions,</text><text x="240.0" y="313" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">and does each waiter have a CPU of its own?</text><rect x="520" y="266" width="440" height="92" rx="6" fill="#FFF3CC" stroke="#C9A227" stroke-width="1.5"/><text x="532" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C9A227" text-anchor="start" font-weight="bold">yes: spin lock is fine</text><text x="532" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">The wait ends when the section ends, sooner than a</text><text x="532" y="328" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">sleep and wake-up would. xv6 guards its free-page</text><text x="532" y="346" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">list (kmem.lock) with a spin lock.</text><defs><marker id="mC9A227" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#C9A227"/></marker></defs><line x1="440" y1="298" x2="518" y2="298" stroke="#C9A227" stroke-width="1.8" marker-end="url(#mC9A227)"/><text x="470" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C9A227" text-anchor="start" font-weight="bold">yes</text><line x1="240" y1="326" x2="240" y2="378" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><text x="250" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="start" font-weight="bold">no or unsure</text><rect x="40" y="380" width="920" height="76" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="52" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">Not sure: a sleeping lock that may spin briefly first (two-phase)</text><text x="52" y="424" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">In a user program that means pthread_mutex_t: the futex-based mutex sleeps in the kernel only when threads collide.</text><text x="52" y="442" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">Use pthread_spin_lock() only when you have answered question 3 with a clear yes.</text><rect x="40" y="468" width="920" height="58" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="52" y="490" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">The measurement that backs this (W08 Section 6.6, 1 ms sections)</text><text x="52" y="509.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">2 cores: spin 0.44 s, mutex 0.45 s, a tie. 1 core: spin 0.67 s, mutex 0.45 s: the spinner held the CPU the holder needed.</text></svg>