<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 3 983 126" width="983" height="126" role="img"><title>The lost signal</title><defs></defs><rect x="4" y="3" width="983" height="126" fill="#ffffff"/><text x="10.0" y="41.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1f3864" text-anchor="start" font-weight="700">parent</text><rect x="140.0" y="10.0" width="360.0" height="50.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.2"/><text x="320.0" y="40.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#7a8291" text-anchor="middle">(not asleep yet)</text><rect x="500.0" y="10.0" width="480.0" height="50.0" rx="0" fill="#f3f4f6" stroke="#5b6675" stroke-width="1.2"/><text x="740.0" y="40.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#7a8291" text-anchor="middle">wait(): asleep forever</text><text x="10.0" y="103.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#b8560f" text-anchor="start" font-weight="700">child</text><rect x="260.0" y="72.0" width="150.0" height="50.0" rx="0" fill="#b8560f" stroke="#b8560f" stroke-width="1.2"/><text x="335.0" y="102.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">signal: nobody</text></svg>
