<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 984 207" width="984" height="207" role="img"><title>The lock word of a Linux mutex: 0, 1 or 2</title><defs></defs><rect x="3" y="3" width="984" height="207" fill="#ffffff"/><rect x="10.0" y="10.0" width="310.0" height="74.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.4"/><text x="165.0" y="42.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="700">lock word = 0</text><text x="165.0" y="61.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="700">free</text><rect x="340.0" y="10.0" width="310.0" height="74.0" rx="8" fill="#fbe9da" stroke="#b8560f" stroke-width="1.4"/><text x="495.0" y="42.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b8560f" text-anchor="middle" font-weight="700">lock word = 1</text><text x="495.0" y="61.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b8560f" text-anchor="middle" font-weight="700">held; nobody waiting</text><rect x="670.0" y="10.0" width="310.0" height="74.0" rx="8" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.4"/><text x="825.0" y="42.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b23a48" text-anchor="middle" font-weight="700">lock word = 2</text><text x="825.0" y="61.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b23a48" text-anchor="middle" font-weight="700">held; somebody may be asleep</text><rect x="10.0" y="110.0" width="140.0" height="46.0" rx="6" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="80.0" y="138.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">T1</text><text x="170.0" y="138.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">inside the critical section, holding the lock (word = 2)</text><rect x="10.0" y="164.0" width="140.0" height="46.0" rx="6" fill="#b8560f" stroke="#b8560f" stroke-width="1.2"/><text x="80.0" y="192.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">T2 zz</text><text x="170.0" y="192.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">asleep in the kernel, on the queue for the lock word&#x27;s address</text></svg>
