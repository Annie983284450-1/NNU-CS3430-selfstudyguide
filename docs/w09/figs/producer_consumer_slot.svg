<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 994 120" width="994" height="120" role="img"><title>A producer, the slot, a consumer</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="ahb8560f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8560f"/></marker><marker id="asb8560f" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8560f"/></marker></defs><rect x="3" y="3" width="994" height="120" fill="#ffffff"/><rect x="10.0" y="10.0" width="310.0" height="70.0" rx="6" fill="#b8560f" stroke="#b8560f" stroke-width="1.2"/><text x="165.0" y="51.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="700">producer</text><rect x="680.0" y="10.0" width="310.0" height="70.0" rx="6" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="835.0" y="51.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="700">consumer</text><rect x="370.0" y="10.0" width="260.0" height="70.0" rx="0" fill="#f3f4f6" stroke="#1f3864" stroke-width="1.6"/><text x="500.0" y="40.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1f3864" text-anchor="middle" font-weight="700">the slot</text><text x="500.0" y="61.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1f3864" text-anchor="middle" font-weight="700">count = 0</text><line x1="324.0" y1="45.0" x2="366.0" y2="45.0" stroke="#b8560f" stroke-width="2" marker-end="url(#ahb8560f)"/><line x1="676.0" y1="45.0" x2="634.0" y2="45.0" stroke="#1f3864" stroke-width="2" marker-end="url(#ah1f3864)"/><text x="20.0" y="113.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b8560f" text-anchor="start">waits while the slot is full (count == 1)</text><text x="990.0" y="113.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="end">waits while the slot is empty (count == 0)</text></svg>
