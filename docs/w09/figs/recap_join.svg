<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2 994 171" width="994" height="171" role="img"><title>The join with a condition variable</title><defs></defs><rect x="3" y="2" width="994" height="171" fill="#ffffff"/><rect x="10.0" y="20.0" width="150.0" height="50.0" rx="6" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="85.0" y="50.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">parent</text><text x="180.0" y="50.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">lock; done is 0; wait(): asleep on c</text><text x="540.0" y="18.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">c&#x27;s queue</text><rect x="540.0" y="32.0" width="450.0" height="56.0" rx="6" fill="#f3f4f6" stroke="#1f3864" stroke-width="1.4"/><rect x="556.0" y="42.0" width="120.0" height="36.0" rx="4" fill="#dbe5f3" stroke="#dbe5f3" stroke-width="1.2"/><text x="616.0" y="64.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">parent zz</text><rect x="10.0" y="116.0" width="150.0" height="50.0" rx="6" fill="#b8560f" stroke="#b8560f" stroke-width="1.2"/><text x="85.0" y="146.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">child</text><text x="180.0" y="146.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">works; then lock; done = 1; signal(c): the parent moves to ready; unlock</text></svg>
