<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 1 994 106" width="994" height="106" role="img"><title>While T1 is inside increment(), T2 waits</title><defs></defs><rect x="3" y="1" width="994" height="106" fill="#ffffff"/><text x="10.0" y="19.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f3864" text-anchor="start" font-weight="700">while T1 is inside increment():</text><rect x="10.0" y="40.0" width="170.0" height="54.0" rx="6" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="95.0" y="73.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">T1</text><text x="200.0" y="72.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">inside, holding the lock</text><rect x="540.0" y="34.0" width="220.0" height="66.0" rx="6" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="650.0" y="62.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b23a48" text-anchor="middle" font-weight="700">lock</text><text x="650.0" y="81.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b23a48" text-anchor="middle" font-weight="700">held by T1</text><rect x="790.0" y="40.0" width="200.0" height="54.0" rx="6" fill="#b8560f" stroke="#b8560f" stroke-width="1.2"/><text x="890.0" y="73.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">T2 waits</text></svg>
