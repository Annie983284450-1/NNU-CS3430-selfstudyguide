e, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">A</text><rect x="918.7" y="28.0" width="30.7" height="30.0" rx="0" fill="#1f6f8b" stroke="#ffffff" stroke-width="1"/><text x="934.0" y="47.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">B</text><rect x="949.3" y="28.0" width="30.7" height="30.0" rx="0" fill="#b8560f" stroke="#ffffff" stroke-width="1"/><text x="964.7" y="47.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">C</text><line x1="520.0" y1="66.0" x2="980.0" y2="66.0" stroke="#5b6675" stroke-width="1"/><line x1="520.0" y1="63.0" x2="520.0" y2="69.0" stroke="#5b6675" stroke-width="1"/><text x="520.0" y="83.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">0</text><line x1="673.3" y1="63.0" x2="673.3" y2="69.0" stroke="#5b6675" stroke-width="1"/><text x="673.3" y="83.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">5</text><line x1="826.7" y1="63.0" x2="826.7" y2="69.0" stroke="#5b6675" stroke-width="1"/><text x="826.7" y="83.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">10</text><line x1="980.0" y1="63.0" x2="980.0" y2="69.0" stroke="#5b6675" stroke-width="1"/><text x="980.0" y="83.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">15</text><text x="520.0" y="99.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">response 1 instead of 5, turnaround 14 instead of 10; the slice is the knob</text><text x="10.0" y="142.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">jobs that wait: each CPU burst is a job, and the CPU runs someone else during the wait</text><text x="50.0" y="175.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="end" font-weight="700">CPU</text><text x="50.0" y="213.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="end" font-weight="700">disk</text><rect x="60.0" y="154.0" width="920.0" height="30.0" rx="0" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1"/><rect x="60.0" y="154.0" width="92.0" height="30.0" rx="0" fill="#1f3864" stroke="#ffffff" stroke-width="1"/><text x="106.0" y="173.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">A</text><rect x="152.0" y="154.0" width="92.0" height="30.0" rx="0" fill="#1f6f8b" stroke="#ffffff" stroke-width="1"/><text x="198.0" y="173.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">B</text><rect x="244.0" y="154.0" width="92.0" height="30.0" rx="0" fill="#1f3864" stroke="#ffffff" stroke-width="1"/><text x="290.0" y="173.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">A</text><rect x="336.0" y="154.0" width="92.0" height="30.0" rx="0" fill="#1f6f8b" stroke="#ffffff" stroke-width="1"/><text x="382.0" y="173.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">B</text><rect x="428.0" y="154.0" width="92.0" height="30.0" rx="0" fill="#1f3864" stroke="#ffffff" stroke-width="1"/><text x="474.0" y="173.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">A</text><rect x="520.0" y="154.0" width="92.0" height="30.0" rx="0" fill="#1f6f8b" stroke="#ffffff" stroke-width="1"/>