.0" y="192.0" width="92.0" height="30.0" rx="0" fill="#1f3864" stroke="#ffffff" stroke-width="1"/><text x="566.0" y="211.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">A</text><rect x="704.0" y="192.0" width="92.0" height="30.0" rx="0" fill="#1f3864" stroke="#ffffff" stroke-width="1"/><text x="750.0" y="211.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">A</text><rect x="888.0" y="192.0" width="92.0" height="30.0" rx="0" fill="#1f3864" stroke="#ffffff" stroke-width="1"/><text x="934.0" y="211.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">A</text><line x1="60.0" y1="230.0" x2="980.0" y2="230.0" stroke="#5b6675" stroke-width="1"/><line x1="60.0" y1="227.0" x2="60.0" y2="233.0" stroke="#5b6675" stroke-width="1"/><text x="60.0" y="247.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">0</text><line x1="520.0" y1="227.0" x2="520.0" y2="233.0" stroke="#5b6675" stroke-width="1"/><text x="520.0" y="247.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">50</text><line x1="980.0" y1="227.0" x2="980.0" y2="233.0" stroke="#5b6675" stroke-width="1"/><text x="980.0" y="247.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">100</text><text x="60.0" y="265.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">time in ms</text><text x="10.0" y="294.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">the five assumptions</text><rect x="10.0" y="306.0" width="180.0" height="56.0" rx="6" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.2"/><text x="100.0" y="331.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">1 every job runs for</text><text x="100.0" y="344.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">the same amount of time</text><line x1="14.0" y1="308.0" x2="186.0" y2="360.0" stroke="#b23a48" stroke-width="1.4"/><rect x="206.0" y="306.0" width="180.0" height="56.0" rx="6" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.2"/><text x="296.0" y="331.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">2 all jobs arrive</text><text x="296.0" y="344.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">at the same time</text><line x1="210.0" y1="308.0" x2="382.0" y2="360.0" stroke="#b23a48" stroke-width="1.4"/><rect x="402.0" y="306.0" width="180.0" height="56.0" rx="6" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.2"/><text x="492.0" y="331.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">3 once started, a job</text><text x="492.0" y="344.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">runs to completion</text><line x1="406.0" y1="308.0" x2="578.0" y2="360.0" stroke="#b23a48" stroke-width="1.4"/><rect x="598.0" y="306.0" width="180.0" height="56.0" rx="6" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.2"/><text x="688.0" y="331.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">4 jobs only use the CPU</text><text x="688.0" y="344.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">(they never wait for I/O)</text><line x1="602.0" y1="308.0" x2="774.0" y2="360.0" stroke="#b23a48" stroke-width="1.4"/><rect x="794.0" y="306.0" width="180.0" height="56.0" rx="6" fill="#fdf2d6" stroke="#b23a48" stroke-width="1.2"/><text x="884.0" y="331.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#b23a48" text-anchor="middle" font-weight="700">5 the run time of each</text><text x="884.0" y="344.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#b23a48" text-anchor="middle" font-weight="700">job is known in advance</text><text x="10.0" y="383.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">four are gone; the fifth, that the kernel knows how long each job will run, is the one no real kernel can grant, and shortest first depends on it</text></svg>
