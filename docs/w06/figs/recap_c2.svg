, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">120</text><text x="10.0" y="99.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">average 50 s, against 110 for FIFO; the third of three 5 s jobs waits 10 s to start</text><text x="520.0" y="16.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">round robin: best response</text><rect x="520.0" y="28.0" width="460.0" height="30.0" rx="0" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1"/><rect x="520.0" y="28.0" width="30.7" height="30.0" rx="0" fill="#1f3864" stroke="#ffffff" stroke-width="1"/><text x="535.3" y="47.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">A</text><rect x="550.7" y="28.0" width="30.7" height="30.0" rx="0" fill="#1f6f8b" stroke="#ffffff" stroke-width="1"/><text x="566.0" y="47.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">B</text><rect x="581.3" y="28.0" width="30.7" height="30.0" rx="0" fill="#b8560f" stroke="#ffffff" stroke-width="1"/><text x="596.7" y="47.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">C</text><rect x="612.0" y="28.0" width="30.7" height="30.0" rx="0" fill="#1f3864" stroke="#ffffff" stroke-width="1"/><text x="627.3" y="47.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">A</text><rect x="642.7" y="28.0" width="30.7" height="30.0" rx="0" fill="#1f6f8b" stroke="#ffffff" stroke-width="1"/><text x="658.0" y="47.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">B</text><rect x="673.3" y="28.0" width="30.7" height="30.0