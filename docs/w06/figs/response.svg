<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 4 989 156" width="989" height="156" role="img"><title>The typing user, and OSTEP Figure 7.6: three 5 s jobs under shortest first</title><defs><marker id="ah5b6675" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="as5b6675" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs><rect x="3" y="4" width="989" height="156" fill="#ffffff"/><rect x="10.0" y="10.0" width="200.0" height="30.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="0"/><text x="110.0" y="29.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">WHAT WE HAVE</text><text x="10.0" y="60.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="start" font-weight="700">job C is the shell waiting to echo one key</text><rect x="10.0" y="76.0" width="110.0" height="56.0" rx="6" fill="#fbe9da" stroke="#b8560f" stroke-width="1.2"/><text x="65.0" y="93.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b8560f" text-anchor="middle" font-weight="700">key</text><text x="65.0" y="108.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b8560f" text-anchor="middle" font-weight="700">pressed</text><text x="65.0" y="123.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b8560f" text-anchor="middle" font-weight="700">t = 0</text><rect x="300.0" y="76.0" width="110.0" height="56.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="355.0" y="93.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">letter</text><text x="355.0" y="108.2" f