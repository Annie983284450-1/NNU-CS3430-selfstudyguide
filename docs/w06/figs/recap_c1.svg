<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2 984 381" width="984" height="381" role="img"><title>The memory unit closed, the mechanism with a hole in it, and where this week sits</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="ah5b6675" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="as5b6675" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs><rect x="3" y="2" width="984" height="381" fill="#ffffff"/><text x="10.0" y="18.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">the last three weeks: memory</text><rect x="10.0" y="34.0" width="120.0" height="38.0" rx="4" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="70.0" y="57.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">pages</text><text x="142.0" y="49.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">fixed-size pieces, a table, a TLB</text><line x1="70.0" y1="74.0" x2="70.0" y2="90.0" stroke="#1f3864" stroke-width="1.2" marker-end="url(#ah1f3864)"/><rect x="10.0" y="92.0" width="120.0" height="38.0" rx="4" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="70.0" y="115.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">tree</text><text x="142.0" y="107.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">a table that stores only the pieces in use</text><line x1="70.0" y1="132.0" x2="70.0" y2="148.0" stroke="#1f3864" stroke-width="1.2" marker-end="url(#ah1f3864)"/><rect x="10.0" y="150.0" width="120.0" height="38.0" rx="4" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="70.0" y="173.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">present bit</text><text x="142.0" y="165.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">a page can live on disk; a page fault brings it back</text><line x1="70.0" y1="190.0" x2="70.0" y2="206.0" stroke="#1f3864" stroke-width="1.2" marker-end="url(#ah1f3864)"/><rect x="10.0" y="208.0" width="120.0" height="38.0" rx="4" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="70.0" y="231.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">the clock</text><text x="142.0" y="223.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">which page to throw out: a use bit and a sweeping hand</text><line x1="70.0" y1="248.0" x2="70.0" y2="264.0" stroke="#1f3864" stroke-width="1.2" marker-end="url(#ah1f3864)"/><rect x="10.0" y="266.0" width="120.0" height="38.0" rx="4" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="70.0" y="289.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">thrashing</text><text x="142.0" y="281.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">when the pages in use never fit: run fewer programs, or kill</text><text x="142.0" y="296.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">one</text><rect x="10.0" y="330.0" width="430.0" height="46.0" rx="4" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="225.0" y="349.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="700">memory is done: three weeks, from one block per program</text><text x="225.0" y="364.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="700">to pages that can live on disk</text><text x="530.0" y="18.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">two weeks before that: the mechanism, with a hole in it</text><rect x="530.0" y="34.0" width="130.0" height="46.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="595.0" y="53.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">process A</text><text x="595.0" y="68.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">running</text><rect x="695.0" y="34.0" width="120.0" height="46.0" rx="6" fill="#fbe9da" stroke="#b8560f" stroke-width="1.2"/><text x="755.0" y="53.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b8560f" text-anchor="middle" font-weight="700">timer</text><text x="755.0" y="68.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b8560f" text-anchor="middle" font-weight="700">interrupt</text><rect x="850.0" y="34.0" width="130.0" height="46.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="915.0" y="53.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">kernel:</text><text x="915.0" y="68.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">scheduler()</text><line x1="662.0" y1="57.0" x2="691.0" y2="57.0" stroke="#1f3864" stroke-width="1.4" marker-end="url(#ah1f3864)"/><line x1="817.0" y1="57.0" x2="846.0" y2="57.0" stroke="#1f3864" stroke-width="1.4" marker-end="url(#ah1f3864)"/><rect x="530.0" y="120.0" width="130.0" height="40.0" rx="3" fill="#dff0f5" stroke="#9aa3b2" stroke-width="1.2"/><text x="595.0" y="137.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1b2430" text-anchor="middle">process B,</text><text x="595.0" y="150.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1b2430" text-anchor="middle">ready</text><line x1="915.0" y1="82.0" x2="595.0" y2="118.0" stroke="#5b6675" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah5b6675)"/><rect x="690.0" y="120.0" width="130.0" height="40.0" rx="3" fill="#fbe9da" stroke="#9aa3b2" stroke-width="1.2"/><text x="755.0" y="137.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1b2430" text-anchor="middle">process C,</text><text x="755.0" y="150.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1b2430" text-anchor="middle">ready</text><line x1="915.0" y1="82.0" x2="755.0" y2="118.0" stroke="#5b6675" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah5b6675)"/><rect x="850.0" y="120.0" width="130.0" height="40.0" rx="3" fill="#ece6f5" stroke="#9aa3b2" stroke-width="1.2"/><text x="915.0" y="137.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1b2430" text-anchor="middle">process D,</text><text x="915.0" y="150.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1b2430" text-anchor="middle">ready</text><line x1="915.0" y1="82.0" x2="915.0" y2="118.0" stroke="#5b6675" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah5b6675)"/><text x="530.0" y="183.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">context switch (swtch) to one of them, and the question nobody answered: which one, and</text><text x="530.0" y="198.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">for how long</text><text x="530.0" y="240.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">the course map: piece 1, virtualization, has three parts</text><rect x="530.0" y="256.0" width="140.0" height="60.0" rx="6" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1.2"/><text x="600.0" y="282.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">the CPU, part 1:</text><text x="600.0" y="297.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">the process</text><rect x="682.0" y="256.0" width="140.0" height="60.0" rx="6" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1.2"/><text x="752.0" y="290.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">memory</text><rect x="834.0" y="256.0" width="140.0" height="60.0" rx="6" fill="#fdf2d6" stroke="#b23a48" stroke-width="2.2"/><text x="904.0" y="282.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle" font-weight="700">the CPU, part 2:</text><text x="904.0" y="297.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle" font-weight="700">scheduling</text><text x="530.0" y="340.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">we are here: the third part. Weeks 1 and 2 built the machinery; this week chooses</text><text x="530.0" y="355.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">the policy.</text></svg>
