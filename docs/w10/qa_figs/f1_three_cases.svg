<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" xmlns:c2pa="http://c2pa.org/manifest"><rect width="980" height="400" fill="#fff"/><text x="20" y="30" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Three event servers: where a lock is needed, and where only time is lost</text><text x="20" y="52" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#8A8A8A" text-anchor="start">Time runs left to right. A, B and C are event handlers. Each row is one CPU.</text><rect x="20" y="70" width="300" height="310" rx="8" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="34" y="96" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2E7D32" text-anchor="start" font-weight="bold">1. One thread,</text><text x="34" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2E7D32" text-anchor="start" font-weight="bold">one handler at a time</text><text x="34" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start" font-weight="bold">No locks needed (33.4)</text><text x="34" y="187" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">CPU 0</text><line x1="82" y1="202" x2="306" y2="202" stroke="#8A8A8A" stroke-width="1"/><rect x="84" y="172" width="66" height="28" rx="4" fill="#fff" stroke="#2E7D32" stroke-width="1.5"/><text x="117.0" y="190.68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">A</text><rect x="156" y="172" width="66" height="28" rx="4" fill="#fff" stroke="#2E7D32" stroke-width="1.5"/><text x="189.0" y="190.68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">B</text><rect x="228" y="172" width="66" height="28" rx="4" fill="#fff" stroke="#2E7D32" stroke-width="1.5"/><text x="261.0" y="190.68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">C</text><text x="34" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="start">Each handler runs to its end before</text><text x="34" y="269" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="start">the next one starts. No two handlers</text><text x="34" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="start">touch the same data at the same</text><text x="34" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="start">moment.</text><rect x="340" y="70" width="300" height="310" rx="8" fill="#FFF3CC" stroke="#C9A227" stroke-width="1.5"/><text x="354" y="96" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#C9A227" text-anchor="start" font-weight="bold">2. One thread,</text><text x="354" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#C9A227" text-anchor="start" font-weight="bold">and handler A blocks</text><text x="354" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start" font-weight="bold">Still no locks needed. Time is lost (33.5)</text><text x="354" y="187" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">CPU 0</text><line x1="402" y1="202" x2="626" y2="202" stroke="#8A8A8A" stroke-width="1"/><rect x="404" y="172" width="30" height="28" rx="4" fill="#fff" stroke="#C9A227" stroke-width="1.5"/><text x="419.0" y="190.68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">A</text><rect x="434" y="172" width="110" height="28" rx="4" fill="#fff" stroke="#C9A227" stroke-width="1.5" stroke-dasharray="5 4"/><text x="489" y="191" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C9A227" text-anchor="middle">A waits: 3 s</text><rect x="544" y="172" width="26" height="28" rx="4" fill="#fff" stroke="#C9A227" stroke-width="1.5"/><text x="557.0" y="190.68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">A</text><rect x="576" y="172" width="40" height="28" rx="4" fill="#fff" stroke="#C9A227" stroke-width="1.5"/><text x="596.0" y="190.68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">B</text><text x="354" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="start">B cannot start while A waits, so</text><text x="354" y="269" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="start">A and B still never overlap. B gets</text><text x="354" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="start">the right answer, 2.60 s late</text><text x="354" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="start">(W10 Extra 2).</text><rect x="660" y="70" width="300" height="310" rx="8" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.5"/><text x="674" y="96" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#B03A2E" text-anchor="start" font-weight="bold">3. Two CPUs,</text><text x="674" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#B03A2E" text-anchor="start" font-weight="bold">two handlers at once</text><text x="674" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start" font-weight="bold">Locks are needed again (33.8)</text><text x="674" y="177" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">CPU 0</text><line x1="722" y1="192" x2="946" y2="192" stroke="#8A8A8A" stroke-width="1"/><text x="674" y="219" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">CPU 1</text><line x1="722" y1="234" x2="946" y2="234" stroke="#8A8A8A" stroke-width="1"/><rect x="724" y="162" width="96" height="28" rx="4" fill="#fff" stroke="#B03A2E" stroke-width="1.5"/><text x="772.0" y="180.68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">A</text><rect x="760" y="204" width="96" height="28" rx="4" fill="#fff" stroke="#B03A2E" stroke-width="1.5"/><text x="808.0" y="222.68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">B</text><rect x="760" y="156" width="60" height="82" rx="4" fill="none" stroke="#B03A2E" stroke-width="1.5" stroke-dasharray="5 4"/><text x="674" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="start">Inside the dashed box, A and B run</text><text x="674" y="287" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="start">at the same moment. If both touch</text><text x="674" y="306" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="start">the same data, that is a critical</text><text x="674" y="325" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="start">section, and it needs a lock.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>