<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 994 314" width="994" height="314" role="img"><title>Two locks, two threads, two orders</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="ahb8560f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8560f"/></marker><marker id="asb8560f" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8560f"/></marker></defs><rect x="3" y="3" width="994" height="314" fill="#ffffff"/><rect x="10.0" y="10.0" width="400.0" height="80.0" rx="8" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="210.0" y="45.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">thread 1</text><text x="210.0" y="67.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">L1 first, then L2</text><rect x="590.0" y="10.0" width="400.0" height="80.0" rx="8" fill="#b8560f" stroke="#b8560f" stroke-width="1.2"/><text x="790.0" y="45.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">thread 2</text><text x="790.0" y="67.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">L2 first, then L1</text><text x="500.0" y="112.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6675" text-anchor="middle">each does its work with both locks, then unlocks both</text><rect x="10.0" y="240.0" width="300.0" height="70.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/><text x="160.0" y="282.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#2e7d32" text-anchor="middle" font-weight="700">lock L1</text><rect x="690.0" y="240.0" width="300.0" height="70.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/><text x="840.0" y="282.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#2e7d32" text-anchor="middle" font-weight="700">lock L2</text><line x1="100.0" y1="130.0" x2="100.0" y2="234.0" stroke="#1f3864" stroke-width="2.2" marker-end="url(#ah1f3864)"/><text x="110.0" y="184.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">1st (thread 1)</text><line x1="330.0" y1="130.0" x2="750.0" y2="234.0" stroke="#1f3864" stroke-width="2.2" marker-end="url(#ah1f3864)"/><text x="560.0" y="204.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">2nd</text><line x1="900.0" y1="130.0" x2="900.0" y2="234.0" stroke="#b8560f" stroke-width="2.2" marker-end="url(#ahb8560f)"/><text x="890.0" y="184.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b8560f" text-anchor="end" font-weight="700">1st (thread 2)</text><line x1="670.0" y1="130.0" x2="250.0" y2="234.0" stroke="#b8560f" stroke-width="2.2" marker-end="url(#ahb8560f)"/><text x="420.0" y="204.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b8560f" text-anchor="end" font-weight="700">2nd</text></svg>
