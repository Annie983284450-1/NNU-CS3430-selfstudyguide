<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2 994 516" width="994" height="516" role="img"><title>Last class in one picture</title><defs><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect x="3" y="2" width="994" height="516" fill="#ffffff"/><text x="10.0" y="19.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="start" font-weight="700">last class: the two bug classes</text><rect x="10.0" y="30.0" width="470.0" height="90.0" rx="12" fill="#fbe9da" stroke="#b8560f" stroke-width="1.4"/><text x="245.0" y="62.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle">non-deadlock: the program runs on, wrong</text><text x="245.0" y="79.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle">atomicity violation: a lock around every access</text><text x="245.0" y="97.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle">order violation: wait for a flag</text><rect x="520.0" y="30.0" width="470.0" height="90.0" rx="12" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.4"/><text x="755.0" y="71.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle">deadlock: the program stops</text><text x="755.0" y="88.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle">threads wait for each other in a circle, for ever</text><text x="10.0" y="153.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="start" font-weight="700">a deadlock, drawn as holds and wants</text><rect x="140.0" y="182.0" width="200.0" height="50.0" rx="6" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="240.0" y="212.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">thread 1</text><rect x="520.0" y="182.0" width="200.0" height="50.0" rx="6" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="620.0" y="212.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b23a48" text-anchor="middle" font-weight="700">lock L1</text><rect x="520.0" y="312.0" width="200.0" height="50.0" rx="6" fill="#b8560f" stroke="#b8560f" stroke-width="1.2"/><text x="620.0" y="342.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">thread 2</text><rect x="140.0" y="312.0" width="200.0" height="50.0" rx="6" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="240.0" y="342.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b23a48" text-anchor="middle" font-weight="700">lock L2</text><line x1="346.0" y1="207.0" x2="514.0" y2="207.0" stroke="#b23a48" stroke-width="1.8" marker-end="url(#ahb23a48)"/><text x="430.0" y="174.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">holds</text><line x1="620.0" y1="236.0" x2="620.0" y2="306.0" stroke="#b23a48" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ahb23a48)"/><text x="728.0" y="276.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start" font-weight="700">wanted by</text><line x1="514.0" y1="337.0" x2="346.0" y2="337.0" stroke="#b23a48" stroke-width="1.8" marker-end="url(#ahb23a48)"/><text x="430.0" y="384.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">holds</text><line x1="240.0" y1="308.0" x2="240.0" y2="238.0" stroke="#b23a48" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ahb23a48)"/><text x="132.0" y="276.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="end" font-weight="700">wanted by</text><text x="10.0" y="423.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="start" font-weight="700">the four conditions, all needed at once</text><rect x="10.0" y="434.0" width="232.0" height="44.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="126.0" y="460.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">1  mutual exclusion</text><rect x="257.0" y="434.0" width="232.0" height="44.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="373.0" y="460.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">2  hold-and-wait</text><rect x="504.0" y="434.0" width="232.0" height="44.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="620.0" y="460.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">3  no preemption</text><rect x="751.0" y="434.0" width="232.0" height="44.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="867.0" y="460.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">4  circular wait</text><text x="10.0" y="508.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="700">&quot;If any of these four conditions are not met, deadlock cannot occur.&quot; (OSTEP 32.3)</text></svg>
