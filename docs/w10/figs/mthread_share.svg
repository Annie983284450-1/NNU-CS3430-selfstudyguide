<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 984 290" width="984" height="290" role="img"><title>Thread 1 stores mThread; thread 2 reads it at once</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="ahb8560f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8560f"/></marker><marker id="asb8560f" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8560f"/></marker></defs><rect x="3" y="3" width="984" height="290" fill="#ffffff"/><rect x="10.0" y="10.0" width="360.0" height="66.0" rx="6" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="190.0" y="49.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">thread 1</text><text x="390.0" y="33.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">creates thread 2, then stores a pointer to thread 2&#x27;s record in a shared variable mThread</text><rect x="620.0" y="110.0" width="360.0" height="66.0" rx="6" fill="#b8560f" stroke="#b8560f" stroke-width="1.2"/><text x="800.0" y="149.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">thread 2</text><text x="160.0" y="127.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">reads a field of that record through mThread at once, assuming</text><text x="160.0" y="146.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">the pointer is already there</text><rect x="10.0" y="216.0" width="970.0" height="70.0" rx="8" fill="#eef3fa" stroke="#1f3864" stroke-width="1.6"/><text x="495.0" y="257.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1f3864" text-anchor="middle" font-weight="700">mThread: NULL at first, then a pointer to thread 2&#x27;s record</text><line x1="120.0" y1="80.0" x2="120.0" y2="210.0" stroke="#1f3864" stroke-width="2.2" marker-end="url(#ah1f3864)"/><text x="110.0" y="155.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="end" font-weight="700">stores</text><line x1="800.0" y1="180.0" x2="800.0" y2="210.0" stroke="#b8560f" stroke-width="2.2" marker-end="url(#ahb8560f)"/><text x="812.0" y="201.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b8560f" text-anchor="start" font-weight="700">reads</text></svg>
