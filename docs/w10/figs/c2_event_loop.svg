<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 994 124" width="994" height="124" role="img"><title>The event loop</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="ahb8560f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8560f"/></marker><marker id="asb8560f" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8560f"/></marker></defs><rect x="3" y="3" width="994" height="124" fill="#ffffff"/><rect x="10.0" y="10.0" width="300.0" height="50.0" rx="6" fill="#f3f4f6" stroke="#5b6675" stroke-width="1.2"/><text x="160.0" y="40.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#5b6675" text-anchor="middle" font-weight="700">wait for events</text><line x1="314.0" y1="35.0" x2="346.0" y2="35.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)"/><rect x="350.0" y="10.0" width="300.0" height="50.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="500.0" y="40.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">take the next event</text><line x1="654.0" y1="35.0" x2="686.0" y2="35.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)"/><rect x="690.0" y="10.0" width="300.0" height="50.0" rx="6" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="840.0" y="40.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="700">run its handler to the end</text>