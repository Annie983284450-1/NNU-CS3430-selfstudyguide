<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 13 994 317" width="994" height="317" role="img"><title>Where it breaks: two parts of an OS, and Java&#x27;s Vector</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect x="3" y="13" width="994" height="317" fill="#ffffff"/><rect x="10.0" y="20.0" width="320.0" height="110.0" rx="10" fill="#eef3fa" stroke="#1f3864" stroke-width="1.6"/><text x="170.0" y="69.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1f3864" text-anchor="middle" font-weight="700">memory</text><text x="170.0" y="94.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1f3864" text-anchor="middle" font-weight="700">manager</text><rect x="670.0" y="20.0" width="320.0" height="110.0" rx="10" fill="#eef3fa" stroke="#1f3864" stroke-width="1.6"/><text x="830.0" y="69.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1f3864" text-anchor="middle" font-weight="700">file</text><text x="830.0" y="94.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1f3864" text-anchor="middle" font-weight="700">system</text><line x1="336.0" y1="50.0" x2="664.0" y2="50.0" stroke="#1f3864" stroke-width="2.2" marker-end="url(#ah1f3864)"/><text x="500.0" y="35.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">1: read this data from disk for me</text><line x1="664.0" y1="100.0" x2="336.0" y2="100.0" stroke="#1f3864" stroke-width="2.2" marker-end="url(#ah1f3864)"/><text x="500.0" y="127.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">2: first give me memory to put it in</text><text x="10.0" y="168.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">two parts of an OS, each holding its own lock while it calls the other: a circle between whole components</text><rect x="10.0" y="196.0" width="980.0" height="92.0" rx="0" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1"/><text x="30.0" y="234.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1b2430" text-anchor="start">v1.AddAll(v2)   locks v1, then v2</text><text x="30.0" y="268.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1b2430" text-anchor="start">v2.AddAll(v1)   locks v2, then v1</text><text x="10.0" y="320.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">Java&#x27;s Vector, a list type in the Java language, has a lock inside each vector. AddAll() takes both; the callers never see them.</text></svg>
