<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 994 290" width="994" height="290" role="img"><title>Last week&#x27;s toolbox, around one shared thing</title><defs><marker id="ah5b6675" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="as5b6675" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs><rect x="3" y="3" width="994" height="290" fill="#ffffff"/><rect x="330.0" y="120.0" width="340.0" height="64.0" rx="8" fill="#eef3fa" stroke="#1f3864" stroke-width="1.4"/><text x="500.0" y="147.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">one shared structure</text><text x="500.0" y="166.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">(a counter, a buffer, a list)</text><rect x="10.0" y="10.0" width="330.0" height="64.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="175.0" y="38.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="700">lock</text><text x="175.0" y="55.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="700">one thread inside at a time</text><line x1="175.0" y1="74.0" x2="400.0" y2="116.0" stroke="#5b6675" stroke-width="1.4" marker-end="url(#ah5b6675)"/><rect x="660.0" y="10.0" width="330.0" height="64.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="825.0" y="38.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="700">condition variable</text><text x="825.0" y="55.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="700">sleep until another thread signals</text><line x1="825.0" y1="74.0" x2="600.0" y2="116.0" stroke="#5b6675" stroke-width="1.4" marker-end="url(#ah5b6675)"/><rect x="330.0" y="222.0" width="340.0" height="64.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="500.0" y="250.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="700">semaphore</text><text x="500.0" y="267.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="700">a counter to wait on: a lock or a signal</text><line x1="500.0" y1="220.0" x2="500.0" y2="188.0" stroke="#5b6675" stroke-width="1.4" marker-end="url(#ah5b6675)"/></svg>
