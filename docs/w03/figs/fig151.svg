 stroke="#9aa3b2" stroke-width="1"/><text x="757.5" y="130.8" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6675" text-anchor="middle">7 KB</text><line x1="860.0" y1="110.0" x2="860.0" y2="115.0" stroke="#9aa3b2" stroke-width="1"/><text x="860.0" y="130.8" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6675" text-anchor="middle">8 KB</text><text x="48.0" y="62.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="start" font-weight="700">code</text><text x="48.0" y="79.8" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#b23a48" text-anchor="start" font-weight="700">14</text><text x="74.0" y="79.8" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#1b2430" text-anchor="start">lw    a5,-20(s0)</text><text x="48.0" y="93.8" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#b23a48" text-anchor="start" font-weight="700">18</text><text x="74.0" y="93.8" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#1b2430" text-anchor="start">addiw a5,a5,2</text><text x="48.0" y="107.8" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#b23a48" text-anchor="start" font-weight="700">20</text><text x="74.0" y="107.8" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#1b2430" text-anchor="start">sw    a5,-20(s0)</text><text x="663.0" y="62.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="start" font-weight="700">stack</text><line x1="757.5" y1="40.0" x2="757.5" y2="110.0" stroke="#b23a48" stroke-width="2"/><text x="763.5" y="90.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#b23a48" text-anchor="start" font-weight="700">count = 40</text><text x="40.0" y="33.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">virtual addresses, counted from 0</text><text x="40.0" y="170.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">The code takes the first 2 KB; count lives in the stack at 7 KB (7,168 bytes). Every address in this picture is virtual.</text></svg>
