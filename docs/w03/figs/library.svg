<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 893 306" width="893" height="306" role="img"><title>Three layers: your program, the C library&#x27;s allocator in user space, and the kernel</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect x="3" y="3" width="893" height="306" fill="#ffffff"/><rect x="10.0" y="10.0" width="520.0" height="64.0" rx="4" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1"/><text x="24.0" y="34.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">your program</text><text x="24.0" y="58.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1b2430" text-anchor="start">malloc(24)   ·   free(p)</text><line x1="270.0" y1="78.0" x2="270.0" y2="112.0" stroke="#1f3864" stroke-width="2" marker-end="url(#ah1f3864)"/><text x="284.0" y="92.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="start" font-weight="700">a library call</text><text x="284.0" y="107.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">fast: nothing leaves your process</text><rect x="10.0" y="116.0" width="520.0" height="72.0" rx="4" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="24.0" y="140.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">the C library&#x27;s allocator, in USER space</text><text x="24.0" y="160.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1b2430" text-anchor="start">keeps a pool, carves your request out of it, remembers every block&#x27;s</text><text x="24.0" y="175.8" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1b2430" text-anchor="start">size</text><line x1="270.0" y1="192.0" x2="270.0" y2="226.0" stroke="#b23a48" stroke-width="2" marker-end="url(#ahb23a48)"/><text x="284.0" y="206.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b23a48" text-anchor="start" font-weight="700">a system call</text><text x="284.0" y="221.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">only when the pool runs dry</text><rect x="10.0" y="230.0" width="520.0" height="72.0" rx="4" fill="#e9ebef" stroke="#9aa3b2" stroke-width="1"/><text x="24.0" y="254.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">the kernel</text><text x="24.0" y="278.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1b2430" text-anchor="start">brk / sbrk: move the end of the heap</text><text x="24.0" y="296.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1b2430" text-anchor="start">mmap: create a whole new region</text><rect x="560.0" y="10.0" width="330.0" height="292.0" rx="8" fill="#f3f4f6" stroke="none" stroke-width="0"/><text x="576.0" y="38.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">why it is built this way</text><text x="576.0" y="62.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">A trap into the kernel costs far more than carving a block</text><text x="576.0" y="77.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">out of a pool you already own.</text><text x="576.0" y="103.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">So the library asks the kernel for territory in big pieces,</text><text x="576.0" y="119.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">rarely, and retails it to you in small pieces, often.</text><text x="576.0" y="144.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">Most malloc calls in your program never reach the kernel</text><text x="576.0" y="160.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">at all.</text></svg>
