<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 754 428" width="754" height="428" role="img"><title>The same process to scale, region by region: a few small islands in a 128 TiB ocean</title><defs></defs><rect x="3" y="3" width="754" height="428" fill="#ffffff"/><text x="10.0" y="18.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#5b6675" text-anchor="start">0x7ffffffff000   top of the program&#x27;s half (128 TiB)</text><rect x="10.0" y="30.0" width="740.0" height="52.0" rx="2" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.4"/><text x="24.0" y="50.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">[stack]  144 KiB</text><text x="24.0" y="69.8" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6675" text-anchor="start">0x7ffffffdb000 – 0x7ffffffff000   local @ 0x7fffffffac5c</text><rect x="10.0" y="92.0" width="740.0" height="34.0" rx="2" fill="#ffffff" stroke="#9aa3b2" stroke-width="1" stroke-dasharray="5,4"/><text x="24.0" y="113.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#7a8291" text-anchor="start" font-weight="700">gap: about 128 MiB of nothing</text><rect x="10.0" y="136.0" width="740.0" height="52.0" rx="2" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.4"/><text x="24.0" y="156.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">libc + loader + vdso  about 2 MiB</text><text x="24.0" y="175.8" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6675" text-anchor="start">one physical copy, mapped into every process</text><rect x="10.0" y="198.0" width="740.0" height="34.0" rx="2" fill="#ffffff" stroke="#9aa3b2" stroke-width="1" stroke-dasharray="5,4"/><text x="24.0" y="219.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#7a8291" text-anchor="start" font-weight="700">gap: 42.7 TiB of nothing</text><rect x="10.0" y="242.0" width="740.0" height="52.0" rx="2" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.4"/><text x="24.0" y="262.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">[heap]  132 KiB</text><text x="24.0" y="281.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6675" text-anchor="start">0x555555559000 – 0x55555557a000   p @ 0x5555555592a0</text><rect x="10.0" y="304.0" width="740.0" height="52.0" rx="2" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.4"/><text x="24.0" y="324.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">the program: ELF header, code, rodata, data  20 KiB</text><text x="24.0" y="343.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6675" text-anchor="start">code @ 0x5555555551e9   ·   global @ 0x555555558010</text><rect x="10.0" y="366.0" width="740.0" height="34.0" rx="2" fill="#ffffff" stroke="#9aa3b2" stroke-width="1" stroke-dasharray="5,4"/><text x="24.0" y="387.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#7a8291" text-anchor="start" font-weight="700">gap: about 85 TiB of nothing</text><text x="10.0" y="422.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#5b6675" text-anchor="start">0x0   nothing mapped down here: this is why a NULL pointer faults</text></svg>
