<svg xmlns="http://www.w3.org/2000/svg" viewBox="21 13 865 140" width="865" height="140" role="img"><title>The machine&#x27;s view: 128 KB of physical memory, the process placed at 72 KB</title><defs></defs><rect x="21" y="13" width="865" height="140" fill="#ffffff"/><rect x="40.0" y="40.0" width="205.0" height="56.0" rx="0" fill="#e9ebef" stroke="#9aa3b2" stroke-width="1"/><text x="142.5" y="76.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">OS</text><rect x="245.0" y="40.0" width="256.2" height="56.0" rx="0" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1"/><text x="373.1" y="76.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#7a8291" text-anchor="middle">(free)</text><rect x="501.2" y="40.0" width="51.2" height="56.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><rect x="552.5" y="40.0" width="307.5" height="56.0" rx="0" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1"/><text x="706.2" y="76.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#7a8291" text-anchor="middle">(free)</text><line x1="40.0" y1="96.0" x2="40.0" y2="101.0" stroke="#9aa3b2" stroke-width="1"/><text x="40.0" y="116.8" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6675" text-anchor="middle">0 KB</text><line x1="245.0" y1="96.0" x2="245.0" y2="101.0" stroke="#9aa3b2" stroke-width="1"/><text x="245.0" y="116.8" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6675" text-anchor="middle">32 KB</text><line x1="501.2" y1="96.0" x2="501.2" y2="101.0" stroke="#9aa3b2" stroke-width="1"/><text x="501.2" y="116.8" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6675" text-anchor="middle">72 KB</text><line x1="552.5" y1="96.0" x2="552.5" y2="101.0" stroke="#9aa3b2" stroke-width="1"/><text x="552.5" y="116.8" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6675" text-anchor="middle">80 KB</text><line x1="860.0" y1="96.0" x2="860.0" y2="101.0" stroke="#9aa3b2" stroke-width="1"/><text x="860.0" y="116.8" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6675" text-anchor="middle">128 KB</text><path d="M 527 38 L 527 20 L 424 20" stroke="#1f3864" stroke-width="1.4" fill="none"/><text x="418.4" y="28.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="end" font-weight="700">our process: code, heap and stack, all 8 KB in one piece</text><text x="40.0" y="144.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">physical addresses: real locations in the machine. The program does not know it sits at 72 KB.</text></svg>
