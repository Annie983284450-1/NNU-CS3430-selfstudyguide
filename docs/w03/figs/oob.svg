<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 854 114" width="854" height="114" role="img"><title>Base and bounds: virtual 20 KB in a 16 KB space is refused</title><defs><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect x="3" y="3" width="854" height="114" fill="#ffffff"/><rect x="10.0" y="10.0" width="230.0" height="100.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="24.0" y="34.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">the MMU (in the CPU)</text><text x="24.0" y="64.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">base   = 32 KB</text><text x="24.0" y="88.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">bounds = 16 KB</text><rect x="280.0" y="30.0" width="170.0" height="60.0" rx="4" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="365.0" y="56.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">virtual address</text><text x="365.0" y="72.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">20 KB</text><line x1="460.0" y1="60.0" x2="610.0" y2="60.0" stroke="#b23a48" stroke-width="3" marker-end="url(#ahb23a48)"/><text x="535.0" y="48.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b23a48" text-anchor="middle" font-weight="700">20 ≥ 16</text><rect x="620.0" y="30.0" width="230.0" height="60.0" rx="4" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="735.0" y="56.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">EXCEPTION</text><text x="735.0" y="72.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">no address is produced</text></svg>
