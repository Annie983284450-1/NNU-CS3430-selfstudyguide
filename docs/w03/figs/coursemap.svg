<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 1194 215" width="1194" height="215" role="img"><title>The course map: three pieces, five blocks, fourteen weeks, week 3 marked</title><defs></defs><rect x="3" y="3" width="1194" height="215" fill="#ffffff"/><rect x="10.0" y="10.0" width="590.0" height="56.0" rx="6" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="305.0" y="33.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">PIECE 1 · VIRTUALIZATION</text><text x="305.0" y="52.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">one computer pretends to be many</text><rect x="606.0" y="10.0" width="284.0" height="56.0" rx="6" fill="#1e6b3a" stroke="#1e6b3a" stroke-width="1.2"/><text x="748.0" y="33.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">PIECE 2 · CONCURRENCY</text><text x="748.0" y="52.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">many things at once, without chaos</text><rect x="896.0" y="10.0" width="294.0" height="56.0" rx="6" fill="#b8560f" stroke="#b8560f" stroke-width="1.2"/><text x="1043.0" y="33.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">PIECE 3 · PERSISTENCE</text><text x="1043.0" y="52.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">data that survives the power going off</text><rect x="10.0" y="76.0" width="170.0" height="58.0" rx="6" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="95.0" y="101.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">the CPU, part 1:</text><text x="95.0" y="117.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">the process</text><rect x="184.0" y="76.0" width="240.0" height="58.0" rx="6" fill="#fff3f3" stroke="#b23a48" stroke-width="2.4"/><text x="304.0" y="101.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle" font-weight="700">memory: private address spaces,</text><text x="304.0" y="117.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle" font-weight="700">pages, more memory than you have</text><rect x="428.0" y="76.0" width="172.0" height="58.0" rx="6" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="514.0" y="101.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">the CPU, part 2:</text><text x="514.0" y="117.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">scheduling</text><rect x="606.0" y="76.0" width="284.0" height="58.0" rx="6" fill="#e3f1e4" stroke="#9aa3b2" stroke-width="1.2"/><text x="748.0" y="109.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">threads, locks, and their bugs</text><rect x="896.0" y="76.0" width="294.0" height="58.0" rx="6" fill="#fbe9da" stroke="#9aa3b2" stroke-width="1.2"/><text x="1043.0" y="109.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">devices, files, crashes</text><rect x="11.0" y="146.0" width="82.3" height="38.0" rx="3" fill="#e9ebef" stroke="#9aa3b2" stroke-width="1.2"/><text x="52.1" y="170.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="middle">1</text><rect x="95.3" y="146.0" width="82.3" height="38.0" rx="3" fill="#e9ebef" stroke="#9aa3b2" stroke-width="1.2"/><