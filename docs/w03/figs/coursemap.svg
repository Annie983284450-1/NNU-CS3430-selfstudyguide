38.0" rx="3" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.2"/><text x="810.7" y="170.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#7a8291" text-anchor="middle">10</text><rect x="853.9" y="146.0" width="82.3" height="38.0" rx="3" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.2"/><text x="895.0" y="170.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#7a8291" text-anchor="middle">11</text><rect x="938.1" y="146.0" width="82.3" height="38.0" rx="3" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.2"/><text x="979.3" y="170.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#7a8291" text-anchor="middle">12</text><rect x="1022.4" y="146.0" width="82.3" height="38.0" rx="3" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.2"/><text x="1063.6" y="170.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#7a8291" text-anchor="middle">13</text><rect x="1106.7" y="146.0" width="82.3" height="38.0" rx="3" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.2"/><text x="1147.9" y="170.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#7a8291" text-anchor="middle">14</text><text x="1190.0" y="208.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6675" text-anchor="end">the weeks of the course; grey ones are done</text><text x="220.7" y="208.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#b23a48" text-anchor="middle" font-weight="700">we are here</text></svg>
