<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 13 794 266" width="794" height="266" role="img"><title>Limited direct execution: full speed, and the hardware hands the CPU back</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="ah2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="as2e7d32" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect x="3" y="13" width="794" height="266" fill="#ffffff"/><rect x="10.0" y="20.0" width="300.0" height="56.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="160.0" y="44.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">USER MODE: the program runs on the</text><text x="160.0" y="60.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">real CPU, at full speed</text><rect x="10.0" y="170.0" width="300.0" height="56.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="160.0" y="202.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">KERNEL MODE: the OS, with full power</text><line x1="100.0" y1="80.0" x2="100.0" y2="166.0" stroke="#b23a48" stroke-width="2" marker-end="url(#ahb23a48)"/><text x="110.0" y="116.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start" font-weight="700">ecall: a trap</text><text x="110.0" y="133.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#b23a48" text-anchor="start">about 100 ns a crossing</text><line x1="240.0" y1="166.0" x2="240.0" y2="80.0" stroke="#2e7d32" stroke-width="2" marker-end="url(#ah2e7d32)"/><text x="250.0" y="128.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#2e7d32" text-anchor="start" font-weight="700">sret</text><text x="10.0" y="243.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">A dangerous instruction in user mode is refused by the</text><text x="10.0" y="258.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">hardware; the kernel installed the one landing address at</text><text x="10.0" y="272.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">boot.</text><rect x="380.0" y="20.0" width="150.0" height="46.0" rx="6" fill="#fbe9da" stroke="#b8560f" stroke-width="1.2"/><text x="455.0" y="47.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">timer tick</text><line x1="532.0" y1="43.0" x2="596.0" y2="43.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)"/><rect x="600.0" y="20.0" width="150.0" height="46.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="675.0" y="47.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">the kernel runs</text><text x="380.0" y="83.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">Every few milliseconds, whatever the program is doing: a loop cannot keep</text><text x="380.0" y="98.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">the CPU.</text><rect x="380.0" y="150.0" width="170.0" height="60.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="465.0" y="176.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">A&#x27;s struct</text><text x="465.0" y="192.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">14 saved registers</text><line x1="552.0" y1="180.0" x2="616.0" y2="180.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)"/><rect x="620.0" y="150.0" width="170.0" height="60.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="705.0" y="176.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">B&#x27;s struct</text><text x="705.0" y="192.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">14 loaded, then return</text><text x="380.0" y="225.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">Context switch: save one process&#x27;s kernel registers, load another&#x27;s; about 1 µs.</text></svg>
