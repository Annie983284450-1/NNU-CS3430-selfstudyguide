nt-weight="700">0</text><rect x="170.0" y="212.0" width="40.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="190.0" y="238.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1f3864" text-anchor="middle" font-weight="700">0</text><rect x="210.0" y="212.0" width="40.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="230.0" y="238.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1f3864" text-anchor="middle" font-weight="700">0</text><rect x="250.0" y="212.0" width="40.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="270.0" y="238.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1f3864" text-anchor="middle" font-weight="700">0</text><text x="300.0" y="236.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#b23a48" text-anchor="start" font-weight="700">7 bits: there is no page 4</text><text x="10.0" y="280.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6675" text-anchor="start">No row can be looked up, so the hardware refuses: a trap into the OS.</text></svg>
