<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2 507 288" width="507" height="288" role="img"><title>Virtual address 63 translates to 47; virtual address 64 needs a seventh bit</title><defs></defs><rect x="3" y="2" width="507" height="288" fill="#ffffff"/><text x="10.0" y="19.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="start" font-weight="700">virtual address 63, the last byte</text><rect x="10.0" y="30.0" width="40.0" height="40.0" rx="0" fill="#fdf2d6" stroke="#9aa3b2" stroke-width="1"/><text x="30.0" y="56.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1f3864" text-anchor="middle" font-weight="700">1</text><rect x="50.0" y="30.0" width="40.0" height="40.0" rx="0" fill="#fdf2d6" stroke="#9aa3b2" stroke-width="1"/><text x="70.0" y="56.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1f3864" text-anchor="middle" font-weight="700">1</text><rect x="90.0" y="30.0" width="40.0" height="40.0" rx="0" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1"/><text x="110.0" y="56.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1f3864" text-anchor="middle" font-weight="700">1</text><rect x="130.0" y="30.0" width="40.0" height="40.0" rx="0" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1"/><text x="150.0" y="56.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1f3864" text-anchor="middle" font-weight="700">1</text><rect x="170.0" y="30.0" width="40.0" height="40.0" rx="0" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1"/><text x="190.0" y="56.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1f3864" text-anchor="middle" font-weight="700">1</text><rect x="210.0" y="30.0" width="40.0" height="40.0" rx="0" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1"/><text x="230.0" y="56.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1f3864" text-anchor="middle" font-weight="700">1</text><text x="260.0" y="54.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">page table[3] = frame 2 = 010</text><text x="10.0" y="88.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">VPN = 11 = page 3,  offset = 1111 = 15</text><rect x="10.0" y="100.0" width="40.0" height="40.0" rx="0" fill="#fdf2d6" stroke="#9aa3b2" stroke-width="1"/><text x="30.0" y="126.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1f3864" text-anchor="middle" font-weight="700">0</text><rect x="50.0" y="100.0" width="40.0" height="40.0" rx="0" fill="#fdf2d6" stroke="#9aa3b2" stroke-width="1"/><text x="70.0" y="126.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1f3864" text-anchor="middle" font-weight="700">1</text><rect x="90.0" y="100.0" width="40.0" height="40.0" rx="0" fill="#fdf2d6" stroke="#9aa3b2" stroke-width="1"/><text x="110.0" y="126.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1f3864" text-anchor="middle" font-weight="700">0</text><rect x="130.0" y="100.0" width="40.0" height="40.0" rx="0" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1"/><text x="150.0" y="126.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1f3864" text-anchor="middle" font-weight="700">1</text><rect x="170.0" y="100.0" width="40.0" height="40.0" rx="0" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1"/><text x="190.0" y="126.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1f3864" text-anchor="middle" font-weight="700">1</text><rect x="210.0" y="100.0" width="40.0" height="40.0" rx="0" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1"/><text x="230.0" y="126.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" 