<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 8 856 91" width="856" height="91" role="img"><title>The RISC-V Sv39 entry xv6 writes, 64 bits, from kernel/riscv.h</title><defs></defs><rect x="3" y="8" width="856" height="91" fill="#ffffff"/><rect x="10.0" y="26.0" width="130.0" height="46.0" rx="0" fill="#f3f4f6" stroke="#1f3864" stroke-width="1"/><text x="75.0" y="53.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">reserved (63..54)</text><text x="12.0" y="21.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#5b6675" text-anchor="start">63</text><text x="138.0" y="21.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#5b6675" text-anchor="end">54</text><rect x="140.0" y="26.0" width="360.0" height="46.0" rx="0" fill="#fbe9da" stroke="#1f3864" stroke-width="1"/><text x="320.0" y="53.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">PPN: physical page number (53..10)</text><text x="142.0" y="21.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#5b6675" text-anchor="start">53</text><text x="498.0" y="21.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#5b6675" text-anchor="end">10</text><rect x="500.0" y="26.0" width="64.0" height="46.0" rx="0" fill="#f3f4f6" stroke="#1f3864" stroke-width="1"/><text x="532.0" y="53.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">RSW</text><text x="502.0" y="21.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#5b6675" text-anchor="start">9</text><text x="562.0" y="21.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#5b6675" text-anchor="end">8</text><rect x="564.0" y="26.0" width="36.0" height="46.0" rx="0" fill="#e3f1e4" stroke="#1f3864" stroke-width="1"/><text x="582.0" y="53.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">D</text><text x="566.0" y="21.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#5b6675" text-anchor="start">7</text><rect x="600.0" y="26.0" width="36.0" height="46.0" rx="0" fill="#e3f1e4" stroke="#1f3864" stroke-width="1"/><text x="618.0" y="53.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">A</text><text x="602.0" y="21.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#5b6675" text-anchor="start">6</text><rect x="636.0" y="26.0" width="36.0" height="46.0" rx="0" fill="#f3f4f6" stroke="#1f3864" stroke-width="1"/><text x="654.0" y="53.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">G</text><text x="638.0" y="21.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#5b6675" text-anchor="start">5</text><rect x="672.0" y="26.0" width="36.0" height="46.0" rx="0" fill="#dbe5f3" stroke="#1f3864" stroke-width="1"/><text x="690.0" y="53.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">U</text><text x="674.0" y="21.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#5b6675" text-anchor="start">4</text><rect x="708.0" y="26.0" width="36.0" height="46.0" rx="0" fill="#dbe5f3" stroke="#1f3864" stroke-width="1"/><text x="726.0" y="53.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">X</text><text x="710.0" y="21.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#5b6675" text-anchor="start">3</text><rect x="744.0" y="26.0" width="36.0" height="46.0" rx="0" fill="#dbe5f3" stroke="#1f3864" stroke-width="1"/><text x="762.0" y="53.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">W</text><text x="746.0" y="21.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#5b6675" text-anchor="start">2</text><rect x="780.0" y="26.0" width="36.0" height="46.0" rx="0" fill="#dbe5f3" stroke="#1f3864" stroke-width="1"/><text x="798.0" y="53.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">R</text><text x="782.0" y="21.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#5b6675" text-anchor="start">1</text><rect x="816.0" y="26.0" width="36.0" height="46.0" rx="0" fill="#dbe5f3" stroke="#1f3864" stroke-width="1"/><text x="834.0" y="53.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">V</text><text x="818.0" y="21.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#5b6675" text-anchor="start">0</text><text x="10.0" y="89.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">Blue: valid and the permission bits (R, W, X, U). Green: set by hardware (A, D). G global, RSW for the OS; xv6 sets neither.</text></svg>
