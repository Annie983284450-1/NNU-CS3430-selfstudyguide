<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 2 980 390" width="980" height="390" role="img"><title>The free list of the 30-byte heap, splitting, and freeing with and without coalescing</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect x="0" y="2" width="980" height="390" fill="#ffffff"/><text x="10.0" y="18.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">the free list of the 30-byte heap</text><text x="10.0" y="53.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">head</text><line x1="54.0" y1="49.0" x2="84.0" y2="49.0" stroke="#1f3864" stroke-width="1.4" marker-end="url(#ah1f3864)"/><rect x="88.0" y="30.0" width="96.0" height="38.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="136.0" y="45.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">addr:0</text><text x="136.0" y="60.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">len:10</text><line x1="186.0" y1="49.0" x2="214.0" y2="49.0" stroke="#1f3864" stroke-width="1.4" marker-end="url(#ah1f3864)"/><rect x="218.0" y="30.0" width="96.0" height="38.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="266.0" y="45.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">addr:20</text><text x="266.0" y="60.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">len:10</text><line x1="316.0" y1="49.0" x2="344.0" y2="49.0" stroke="#1f3864" stroke-width="1.4" marker-end="url(#ah1f3864)"/><text x="348.0" y="53.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#7a8291" text-anchor="start" font-weight="700">NULL</text><rect x="0.0" y="92.0" width="470.0" height="140.0" rx="8" fill="#f3f4f6" stroke="none" stroke-width="0"/><text x="12.0" y="114.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">SPLITTING: a request for 1 byte, served from the second hole</text><text x="12.0" y="149.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">head</text><line x1="56.0" y1="145.0" x2="86.0" y2="145.0" stroke="#1f3864" stroke-width="1.4" marker-end="url(#ah1f3864)"/><rect x="90.0" y="126.0" width="96.0" height="38.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="138.0" y="141.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">addr:0</text><text x="138.0" y="156.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">len:10</text><line x1="188.0" y1="145.0" x2="216.0" y2="145.0" stroke="#1f3864" stroke-width="1.4" marker-end="url(#ah1f3864)"/><rect x="220.0" y="126.0" width="96.0" height="38.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="268.0" y="141.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">addr:21</text><text x="268.0" y="156.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">len:9</text><line x1="318.0" y1="145.0" x2="346.0" y2="145.0" stroke="#1f3864" stroke-width="1.4" marker-end="url(#ah1f3864)"/><text x="350.0" y="149.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#7a8291" text-anchor="start" font-weight="700">NULL</text><text x="12.0" y="190.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">Byte 20 goes to the caller; the rest stays on the list, now starting at 21 with 9 bytes.</text><rect x="490.0" y="92.0" width="490.0" height="140.0" rx="8" fill="#f8e3e6" stroke="none" stroke-width="0"/><text x="502.0" y="114.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start" font-weight="700">WITHOUT COALESCING: free(10) just pushes the chunk on the list</text><text x="502.0" y="149.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">head</text><line x1="546.0" y1="145.0" x2="570.0" y2="145.0" stroke="#1f3864" stroke-width="1.4" marker-end="url(#ah1f3864)"/><rect x="574.0" y="126.0" width="86.0" height="38.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="617.0" y="141.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">addr:10</text><text x="617.0" y="156.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">len:10</text><line x1="662.0" y1="145.0" x2="684.0" y2="145.0" stroke="#1f3864" stroke-width="1.4" marker-end="url(#ah1f3864)"/><rect x="688.0" y="126.0" width="86.0" height="38.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="731.0" y="141.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">addr:0</text><text x="731.0" y="156.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">len:10</text><line x1="776.0" y1="145.0" x2="798.0" y2="145.0" stroke="#1f3864" stroke-width="1.4" marker-end="url(#ah1f3864)"/><rect x="802.0" y="126.0" width="86.0" height="38.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="845.0" y="141.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">addr:20</text><text x="845.0" y="156.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">len:10</text><line x1="890.0" y1="145.0" x2="912.0" y2="145.0" stroke="#1f3864" stroke-width="1.4" marker-end="url(#ah1f3864)"/><text x="916.0" y="149.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#7a8291" text-anchor="start" font-weight="700">NULL</text><text x="502.0" y="190.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">All 30 bytes are free, but a request for 20 fails: the list says three holes of 10.</text><rect x="490.0" y="246.0" width="490.0" height="140.0" rx="8" fill="#e3f1e4" stroke="none" stroke-width="0"/><text x="502.0" y="268.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="start" font-weight="700">WITH COALESCING: merge the returned chunk with free neighbors</text><text x="502.0" y="303.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">head</text><line x1="546.0" y1="299.0" x2="576.0" y2="299.0" stroke="#1f3864" stroke-width="1.4" marker-end="url(#ah1f3864)"/><rect x="580.0" y="280.0" width="96.0" height="38.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="628.0" y="295.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">addr:0</text><text x="628.0" y="310.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">len:30</text><line x1="678.0" y1="299.0" x2="706.0" y2="299.0" stroke="#1f3864" stroke-width="1.4" marker-end="url(#ah1f3864)"/><text x="710.0" y="303.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#7a8291" text-anchor="start" font-weight="700">NULL</text><text x="502.0" y="344.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">The chunk at 10 touches 0 to 10 and 20 to 30: merge all three into one entry.</text><text x="12.0" y="268.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">Splitting protects big holes from small requests. Coalescing protects big</text><text x="12.0" y="285.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">holes from small returns.</text></svg>
