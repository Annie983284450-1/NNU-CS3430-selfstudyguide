<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2 856 317" width="856" height="317" role="img"><title>One copy of the C library&#x27;s code, two address spaces</title><defs><marker id="ah2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="as2e7d32" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker></defs><rect x="3" y="2" width="856" height="317" fill="#ffffff"/><text x="10.0" y="18.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">process 1092: its address space</text><rect x="10.0" y="28.0" width="230.0" height="30.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="125.0" y="46.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">code, data, heap of sleep</text><rect x="10.0" y="58.0" width="230.0" height="54.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="125.0" y="75.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="middle" font-weight="700">libc code r-xp</text><text x="125.0" y="88.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="middle" font-weight="700">0x7f2b4f428000</text><text x="125.0" y="102.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="middle" font-weight="700">Rss 992 kB, all resident</text><rect x="10.0" y="112.0" width="230.0" height="30.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="125.0" y="130.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">stack and the rest</text><text x="10.0" y="188.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">process 1093: its address space</text><rect x="10.0" y="198.0" width="230.0" height="30.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="125.0" y="216.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">code, data, heap of sleep</text><rect x="10.0" y="228.0" width="230.0" height="54.0" rx="3" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1.2"/><text x="125.0" y="245.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="middle" font-weight="700">libc code r-xp</text><text x="125.0" y="258.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="middle" font-weight="700">0x7fe954428000</text><text x="125.0" y="272.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="middle" font-weight="700">Rss 992 kB, all resident</text><rect x="10.0" y="282.0" width="230.0" height="30.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="125.0" y="300.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">stack and the rest</text><text x="700.0" y="18.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">physical memory</text><rect x="590.0" y="30.0" width="220.0" height="70.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="700.0" y="68.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7a8291" text-anchor="middle">(other pages)</text><rect x="590.0" y="100.0" width="220.0" height="70.0" rx="3" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="700.0" y="124.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="700">libc code pages</text><text x="700.0" y="139.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="700">992 kB, one copy</text><text x="700.0" y="154.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="700">Shared_Clean: read, never written</text><rect x="590.0" y="170.0" width="220.0" height="80.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="700.0" y="213.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7a8291" text-anchor="middle">(other pages)</text><line x1="242.0" y1="85.0" x2="586.0" y2="130.0" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#ah2e7d32)"/><line x1="242.0" y1="255.0" x2="586.0" y2="140.0" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#ah2e7d32)"/><text x="590.0" y="265.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">Read-only for everyone: no process can change these</text><text x="590.0" y="280.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">pages, so one copy is safe. Pss 106 kB in each: 992 /</text><text x="590.0" y="294.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">106 ≈ 9.4 sharers, each billed about a ninth.</text></svg>
