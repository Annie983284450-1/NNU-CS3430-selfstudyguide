<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2 993 394" width="993" height="394" role="img"><title>Last week&#x27;s second class: base and bounds, and the one complaint</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect x="3" y="2" width="993" height="394" fill="#ffffff"/><rect x="10.0" y="8.0" width="980.0" height="32.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="0"/><text x="500.0" y="29.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">1  BASE AND BOUNDS (OSTEP 15): ONE ADD, ONE COMPARE, IN HARDWARE</text><rect x="10.0" y="56.0" width="150.0" height="64.0" rx="8" fill="#c9d6ea" stroke="#1f3864" stroke-width="1.2"/><text x="85.0" y="76.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">the MMU</text><text x="85.0" y="92.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">base = 32 KB</text><text x="85.0" y="108.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">bounds = 16 KB</text><rect x="220.0" y="64.0" width="140.0" height="48.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="290.0" y="84.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">virtual</text><text x="290.0" y="101.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">15 KB</text><line x1="364.0" y1="88.0" x2="466.0" y2="88.0" stroke="#1f3864" stroke-width="2" marker-end="url(#ah1f3864)"/><text x="415.0" y="76.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle">15 &lt; 16? yes</text><text x="415.0" y="108.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">+ 32</text><rect x="470.0" y="64.0" width="140.0" height="48.0" rx="6" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="540.0" y="84.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">physical</text><text x="540.0" y="101.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">47 KB</text><text x="640.0" y="74.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">If the check fails, the hardware raises an exception; the shell</text><text x="640.0" y="89.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">reports it as a segmentation fault.</text><rect x="10.0" y="150.0" width="980.0" height="32.0" rx="4" fill="#b23a48" stroke="#b23a48" stroke-width="0"/><text x="500.0" y="171.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">2  THE ONE COMPLAINT: THE WHOLE ADDRESS SPACE MOVES AS ONE BLOCK</text><rect x="70.0" y="196.0" width="140.0" height="23.8" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="140.0" y="212.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">code</text><rect x="70.0" y="219.8" width="140.0" height="23.8" rx="0" fill="#fbe9da" stroke="#9aa3b2" stroke-width="1"/><text x="140.0" y="236.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">heap</text><rect x="70.0" y="243.5" width="140.0" height="118.8" rx="0" fill="#f8e3e6" stroke="#9aa3b2" stroke-width="1"/><text x="140.0" y="307.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#7a8291" text-anchor="middle">(free)</text><rect x="70.0" y="362.2" width="140.0" height="23.8" rx="0" fill="#e3f1e4" stroke="#9aa3b2" stroke-width="1"/><text x="140.0" y="378.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">stack</text><text x="64.0" y="199.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7a8291" text-anchor="end">32 KB</text><text x="64.0" y="389.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7a8291" text-anchor="end">48 KB</text><text x="220.0" y="210.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">the slot in physical memory</text><text x="220.0" y="240.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">The free middle is inside the slot, so it takes real</text><text x="220.0" y="257.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">memory while holding nothing: internal</text><text x="220.0" y="274.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">fragmentation.</text><rect x="600.0" y="206.0" width="380.0" height="120.0" rx="10" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.4"/><text x="790.0" y="234.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">in our own numbers</text><text x="790.0" y="260.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">128 TiB of address space on 7.8 GiB of RAM</text><text x="790.0" y="284.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle">128 TiB ÷ 7.8 GiB = about 16,710 to 1</text><text x="790.0" y="308.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle">one base and one bound cannot load it at all</text></svg>
