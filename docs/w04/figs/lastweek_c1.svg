<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2 994 415" width="994" height="415" role="img"><title>Last week&#x27;s first class: the address space, the memory API, and the three goals</title><defs></defs><rect x="3" y="2" width="994" height="415" fill="#ffffff"/><rect x="10.0" y="8.0" width="470.0" height="32.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="0"/><text x="245.0" y="29.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">1  THE ADDRESS SPACE (OSTEP 13)</text><rect x="60.0" y="56.0" width="130.0" height="27.5" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="125.0" y="74.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">code</text><rect x="60.0" y="83.5" width="130.0" height="27.5" rx="0" fill="#fbe9da" stroke="#9aa3b2" stroke-width="1"/><text x="125.0" y="101.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">heap</text><rect x="60.0" y="111.0" width="130.0" height="137.5" rx="0" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1"/><text x="125.0" y="184.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#7a8291" text-anchor="middle">(free)</text><rect x="60.0" y="248.5" width="130.0" height="27.5" rx="0" fill="#e3f1e4" stroke="#9aa3b2" stroke-width="1"/><text x="125.0" y="266.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">stack</text><text x="54.0" y="59.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7a8291" text-anchor="end">0</text><text x="54.0" y="279.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7a8291" text-anchor="end">16 KB</text><text x="210.0" y="70.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start">one process, as it sees itself: numbered from</text><text x="210.0" y="87.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start">0; the heap grows toward larger addresses,</text><text x="210.0" y="104.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start">the stack toward smaller ones</text><text x="210.0" y="174.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">Every address the program sees is virtual: a</text><text x="210.0" y="191.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">name in its own private map, not a place in</text><text x="210.0" y="208.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">the chips.</text><rect x="520.0" y="8.0" width="470.0" height="32.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="0"/><text x="755.0" y="29.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">2  THE MEMORY API (OSTEP 14)</text><rect x="540.0" y="56.0" width="200.0" height="44.0" rx="8" fill="#1f3864" stroke="#1f3864" stroke-width="1"/><text x="640.0" y="83.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">malloc(size)</text><rect x="770.0" y="56.0" width="200.0" height="44.0" rx="8" fill="#1f3864" stroke="#1f3864" stroke-width="1"/><text x="870.0" y="83.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">free(ptr)</text><text x="540.0" y="128.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">a library, not a system call: it carves pieces out of the heap and asks the</text><text x="540.0" y="145.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">kernel for more with brk</text><rect x="540.0" y="170.0" width="430.0" height="40.0" rx="6" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="755.0" y="194.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">6 classic errors: -Wall catches 4, valgrind the other 2</text><text x="540.0" y="236.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">/proc/PID/maps: a few small regions in a 128 TiB address space, on a</text><text x="540.0" y="253.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">machine with 7.8 GiB of RAM. A page costs nothing until it is touched.</text><rect x="10.0" y="300.0" width="980.0" height="32.0" rx="4" fill="#1e6b3a" stroke="#1e6b3a" stroke-width="0"/><text x="500.0" y="321.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">3  THE THREE GOALS (OSTEP 15)</text><rect x="10.0" y="344.0" width="320.0" height="66.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="170.0" y="366.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">transparency</text><text x="170.0" y="390.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">the program never knows it is being translated</text><rect x="340.0" y="344.0" width="320.0" height="66.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="500.0" y="366.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">efficiency</text><text x="500.0" y="390.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">translation costs almost nothing per access</text><rect x="670.0" y="344.0" width="320.0" height="66.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="830.0" y="366.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">protection</text><text x="830.0" y="390.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">no process can reach another&#x27;s memory, or the kernel&#x27;s</text></svg>
