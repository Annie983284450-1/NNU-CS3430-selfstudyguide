<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="960" height="330" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">A 3-slot TLB and a loop over pages 1, 2, 3, 4, 1, 2, 3, 4 …  under LRU every access misses</text><text x="20" y="75" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">access</text><text x="20" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">TLB after</text><text x="20" y="135" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">(3 slots)</text><text x="20" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">result</text><rect x="110" y="60" width="80" height="30" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="150" y="81" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">page 1</text><rect x="110" y="105" width="80" height="26" rx="4" fill="#E3F2E1" stroke="#1F3864" stroke-width="1"/><text x="150" y="123" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">1</text><rect x="110" y="133" width="80" height="26" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1"/><text x="150" y="151" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">·</text><rect x="110" y="161" width="80" height="26" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1"/><text x="150" y="179" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">·</text><text x="150" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B03A2E" text-anchor="middle" font-weight