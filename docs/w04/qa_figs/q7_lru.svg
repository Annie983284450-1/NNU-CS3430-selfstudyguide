stroke="#1F3864" stroke-width="1"/><text x="774" y="123" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">1</text><rect x="734" y="133" width="80" height="26" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1"/><text x="774" y="151" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">2</text><rect x="734" y="161" width="80" height="26" rx="4" fill="#E3F2E1" stroke="#1F3864" stroke-width="1"/><text x="774" y="179" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">3</text><text x="774" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B03A2E" text-anchor="middle" font-weight="bold">miss</text><text x="774" y="232" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle">out: 4</text><rect x="838" y="60" width="80" height="30" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="878" y="81" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">page 4</text><rect x="838" y="105" width="80" height="26" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1"/><text x="878" y="123" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">2</text><rect x="838" y="133" width="80" height="26" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1"/><text x="878" y="151" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">3</text><rect x="838" y="161" width="80" height="26" rx="4" fill="#E3F2E1" stroke="#1F3864" stroke-width="1"/><text x="878" y="179" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">4</text><text x="878" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B03A2E" text-anchor="middle" font-weight="bold">miss</text><text x="878" y="232" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle">out: 1</text><text x="20" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">LRU throws out the slot unused for the longest time, which here is always the page the loop needs next. Random would keep it some of the time.</text><text x="20" y="282" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Replacement is wired into the chip; the OS does not choose. Both LRU and random are used; the same two policies return for pages on disk.</text><text x="20" y="310" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-style="italic">Slots filled from the top; the newest translation goes in the bottom highlighted slot each time (the picture shows recency, not physical slot numbers).</text></svg>