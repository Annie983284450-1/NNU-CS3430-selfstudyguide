<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="940" height="300" fill="#fff"/><rect x="20" y="90" width="150" height="120" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="95" y="140" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="middle" font-weight="bold">CPU core</text><text x="95" y="162" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle">runs instructions</text><text x="95" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle">says: virtual address</text><rect x="260" y="50" width="320" height="200" rx="4" fill="#fff" stroke="#1F3864" stroke-width="2"/><text x="420" y="75" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F3864" text-anchor="middle" font-weight="bold">MMU  (memory management unit)</text><rect x="290" y="95" width="260" height="110" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="420" y="118" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="middle" font-weight="bold">TLB</text><text x="420" y="138" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle">a few dozen to a few thousand slots</text><text x="420" y="160" font-family="'Courier New', monospace" font-size="11.5" fill="#262626" text-anchor="middle">VPN 6 → PFN 23  r-x</text><text x="420" y="175" font-family="'Courier New', monospace" font-size="11.5" fill="#262626" text-anchor="middle">VPN 7 → PFN 11  rw-</text><text x="420" y="190" font-family="'Courier New', monospace" font-size="11.5" fill="#262626" text-anchor="middle">VPN 8 → PFN 40  rw-</text><text x="420" y="232" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="middle">miss: walk the page table in memory, then fill a slot</text><rect x="680" y="50" width="240" height="200" rx="4" fill="#fff" stroke="#8A8A8A" stroke-width="1.5"/><text x="800" y="75" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F3864" text-anchor="middle" font-weight="bold">memory (RAM)</text><rect x="700" y="95" width="200" height="50" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="800" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="middle">the page table</text><text x="800" y="133" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="middle">one row per page</text><rect x="700" y="165" width="200" height="70" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="800" y="195" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="middle">the program&#x27;s data</text><text x="800" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="middle">and code</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="172" y1="150" x2="258" y2="150" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><text x="215" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="middle">VA</text><defs><marker id="mB03A2E" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B03A2E"/></marker></defs><line x1="582" y1="120" x2="698" y2="120" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#mB03A2E)" stroke-dasharray="6 4"/><text x="640" y="110" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#B03A2E" text-anchor="middle">miss only</text><defs><marker id="m2E7D32" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2E7D32"/></marker></defs><line x1="582" y1="200" x2="698" y2="200" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#m2E7D32)"/><text x="640" y="190" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2E7D32" text-anchor="middle">PA, every access</text><text x="20" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">A hit never touches the page table: the frame number comes straight out of the slot, and the one memory access is the program&#x27;s own.</text></svg>