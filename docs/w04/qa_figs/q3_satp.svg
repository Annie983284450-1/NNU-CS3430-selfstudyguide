<svg xmlns="http://www.w3.org/2000/svg" width="940" height="260" viewBox="0 0 940 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="940" height="260" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Reading a row needs no translation, because satp already holds a physical address</text><rect x="20" y="60" width="300" height="70" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="170" y="82" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">satp register (inside the CPU)</text><text x="170" y="106" font-family="'Courier New', monospace" font-size="15" fill="#262626" text-anchor="middle" font-weight="bold">0x8000000000087f33</text><text x="170" y="124" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle">8 = Sv39 mode     0x87f33 = frame number of the table</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="322" y1="95" x2="470" y2="95" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><text x="396" y="85" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="middle">× 4096 (add three hex 0s)</text><rect x="472" y="60" width="250" height="70" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="597" y="82" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">table starts at physical</text><text x="597" y="108" font-family="'Courier New', monospace" font-size="15" fill="#262626" text-anchor="middle" font-weight="bold">0x87f33000</text><text x="20" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="start">row address = 0x87f33000 + VPN × 8   (physical + a number = physical).  The MMU reads memory there directly.</text><text x="20" y="195" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="start">The frame numbers stored inside the rows are physical too.  So the rule is simple:</text><text x="20" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">the OS writes only physical addresses into satp and into the table; the hardware translates only the addresses the program uses.</text></svg>