<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="960" height="440" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Step 1, the problem: one TLB, two processes, the same VPN 10</text><rect x="20" y="50" width="200" height="80" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="120" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">P1&#x27;s page table</text><text x="120" y="100" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">VPN 10 → frame 100</text><rect x="20" y="150" width="200" height="70" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="120" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">P2&#x27;s page table</text><text x="120" y="200" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">VPN 10 → frame 170</text><rect x="300" y="50" width="260" height="180" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="430" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">the TLB, after P1 ran</text><rect x="320" y="90" width="220" height="30" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="430" y="110" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="middle">VPN 10 → PFN 100   (P1&#x27;s)</text><rect x="320" y="128" width="220" height="30" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="430" y="148" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="middle">VPN 12 → PFN 51</text><rect x="320" y="166" width="220" height="30" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="430" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#8A8A8A" text-anchor="middle">·</text><defs><marker id="mB03A2E" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B03A2E"/></marker></defs><line x1="222" y1="190" x2="298" y2="110" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#mB03A2E)" stroke-dasharray="6 4"/><text x="226" y="212" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#B03A2E" text-anchor="start">P2 runs, asks VPN 10</text><rect x="600" y="50" width="340" height="180" rx="6" fill="#F9E0DC" stroke="#1F3864" stroke-width="1.2"/><text x="612" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">Where it breaks</text><text x="612" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">The TLB sees VPN 10 and answers &quot;frame 100&quot;.</text><text x="612" y="108.875" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">P2 reads P1&#x27;s memory. Protection is gone.</text><text x="612" y="125.75" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start"></text><text x="612" y="142.625" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">The entry does not say whose VPN 10 it is,</text><text x="612" y="159.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">so after the switch the hardware cannot tell</text><text x="612" y="176.375" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">a still-correct entry from a wrong one.</text><text x="20" y="270" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Step 2, two fixes</text><rect x="20" y="285" width="440" height="140" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="32" y="307" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">Fix 1: flush on every switch (xv6)</text><text x="32" y="327.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Set every TLB valid bit to 0 when satp changes.</text><text x="32" y="343.875" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">xv6: sfence.vma zero, zero  next to each csrw satp.</text><text x="32" y="360.75" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Safe and simple. Cost: every process starts cold</text><text x="32" y="377.625" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">and misses again on each page it uses.</text><rect x="490" y="285" width="450" height="140" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="502" y="307" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">Fix 2: stamp each entry with an ASID (Linux)</text><text x="502" y="327.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Each slot also stores a short process number.</text><text x="502" y="343.875" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">P1&#x27;s entry carries 1, P2&#x27;s carries 2; both stay.</text><text x="502" y="360.75" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">The lookup accepts a slot only if its ASID matches</text><text x="502" y="377.625" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">the running process&#x27;s. No cold start; one more field.</text></svg>