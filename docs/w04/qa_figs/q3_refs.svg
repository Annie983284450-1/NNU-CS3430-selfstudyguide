<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="960" height="400" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">One trip around  for (i = 0; i &lt; 1000; i++) array[i] = 0;  on RISC-V, with no TLB</text><text x="20" y="55" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A" text-anchor="start">loop body: three instructions</text><rect x="20" y="62" width="400" height="78" rx="3" fill="#F5F5F5" stroke="#8A8A8A" stroke-width="1"/><text x="30" y="84" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">0x10: sw   zero, 0(a5)    store 0 into array[i]</text><text x="30" y="106" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">0x14: addi a5, a5, 4      point at the next element</text><text x="30" y="128" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">0x16: bne  a5, a4, 0x10   back to the top unless done</text><text x="20" y="152" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A" text-anchor="start">memory references, in order</text><rect x="20" y="160" width="560" height="24" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1"/><circle cx="38" cy="172" r="9" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="38" y="177" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="56" y="177" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">read the code page&#x27;s row</text><text x="470" y="177" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#C9A227" text-anchor="start" font-weight="bold">overhead</text><rect x="20" y="187" width="560" height="24" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1"/><circle cx="38" cy="199" r="9" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="38" y="204" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="56" y="204" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">fetch sw from 0x10</text><text x="470" y="204" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="start" font-weight="bold">wanted</text><rect x="20" y="214" width="560" height="24" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1"/><circle cx="38" cy="226" r="9" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="38" y="231" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="56" y="231" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">read the array page&#x27;s row</text><text x="470" y="231" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#C9A227" text-anchor="start" font-weight="bold">overhead</text><rect x="20" y="241" width="560" height="24" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1"/><circle cx="38" cy="253" r="9" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="38" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="56" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">the store: array[i] = 0</text><text x="470" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="start" font-weight="bold">wanted</text><rect x="20" y="268" width="560" height="24" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1"/><circle cx="38" cy="280" r="9" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="38" y="285" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">5</text><text x="56" y="285" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">read the code page&#x27;s row  (again)</text><text x="470" y="285" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#C9A227" text-anchor="start" font-weight="bold">overhead</text><rect x="20" y="295" width="560" height="24" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1"/><circle cx="38" cy="307" r="9" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="38" y="312" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">6</text><text x="56" y="312" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">fetch addi from 0x14</text><text x="470" y="312" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="start" font-weight="bold">wanted</text><rect x="20" y="322" width="560" height="24" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1"/><circle cx="38" cy="334" r="9" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="38" y="339" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">7</text><text x="56" y="339" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">read the code page&#x27;s row  (again)</text><text x="470" y="339" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#C9A227" text-anchor="start" font-weight="bold">overhead</text><rect x="20" y="349" width="560" height="24" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1"/><circle cx="38" cy="361" r="9" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="38" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">8</text><text x="56" y="366" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">fetch bne from 0x16</text><text x="470" y="366" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="start" font-weight="bold">wanted</text><rect x="610" y="160" width="330" height="215" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="622" y="182" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">What decides &quot;wanted&quot;</text><text x="622" y="201.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">Wanted: the program&#x27;s own instruction caused it.</text><text x="622" y="216.7" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">That is every instruction fetch and every load</text><text x="622" y="232.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">or store the instruction does. 4 per trip.</text><text x="622" y="247.7" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start"></text><text x="622" y="263.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">Overhead: its only purpose is to read a row of</text><text x="622" y="278.7" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">the page table. The hardware adds it; the</text><text x="622" y="294.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">program never asked. 4 per trip.</text><text x="622" y="309.7" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start"></text><text x="622" y="325.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">Rows 1, 5 and 7 read the same row three times,</text><text x="622" y="340.7" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">because each of the three instructions must be</text><text x="622" y="356.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">fetched, and each fetch is translated afresh.</text></svg>