<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="900" height="330" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F3864" text-anchor="start" font-weight="bold">Two page tables point at the same frame; only one of them was used to write the zeros</text><rect x="20" y="60" width="270" height="110" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="155" y="82" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F3864" text-anchor="middle" font-weight="bold">kernel&#x27;s page table</text><text x="155" y="105" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle">maps all of RAM, address = address</text><rect x="35" y="118" width="240" height="36" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="155" y="141" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle">its row for 0x87f32000: used</text><rect x="20" y="200" width="270" height="110" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="155" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F3864" text-anchor="middle" font-weight="bold">the process&#x27;s page table</text><text x="155" y="245" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle">the one info mem printed</text><rect x="35" y="258" width="240" height="36" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="155" y="281" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="middle">row 0x4000 → 0x87f32: a = 0</text><rect x="560" y="120" width="160" height="120" rx="4" fill="#fff" stroke="#1F3864" stroke-width="2"/><text x="640" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F3864" text-anchor="middle" font-weight="bold">frame</text><text x="640" y="172" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle">0x87f32000</text><text x="640" y="196" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle">4096 zero bytes</text><text x="640" y="216" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle">(memset wrote them)</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="277" y1="136" x2="558" y2="160" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><text x="300" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="start">kernel&#x27;s memset went this way</text><defs><marker id="m8A8A8A" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8A8A8A"/></marker></defs><line x1="277" y1="276" x2="558" y2="210" stroke="#8A8A8A" stroke-width="1.8" marker-end="url(#m8A8A8A)" stroke-dasharray="6 4"/><text x="330" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">not used yet: the program has not touched 0x4000</text><rect x="740" y="60" width="150" height="250" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="752" y="82" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">So</text><text x="752" y="101.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">The a bit lives in</text><text x="752" y="117.4" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">the row, not in</text><text x="752" y="133.60000000000002" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">the frame.</text><text x="752" y="149.8" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start"></text><text x="752" y="166.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">Each table has its</text><text x="752" y="182.20000000000002" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">own row for that</text><text x="752" y="198.40000000000003" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">frame, and only</text><text x="752" y="214.60000000000002" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">a row that the</text><text x="752" y="230.8" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">MMU used gets</text><text x="752" y="247.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">its a set.</text></svg>