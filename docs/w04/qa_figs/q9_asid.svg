<svg xmlns="http://www.w3.org/2000/svg" width="960" height="436" viewBox="0 0 960 436" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="960" height="436" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F3864" text-anchor="start" font-weight="bold">With ASIDs, each slot holds a stamp, and the comparator checks the stamp and the VPN together</text><rect x="20" y="60" width="190" height="90" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="115" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle">running process</text><text x="115" y="104" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">ASID 2  (from satp)</text><text x="115" y="128" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">asks VPN 10</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="212" y1="105" x2="300" y2="78" stroke="#1F3864" stroke-width="1.2" marker-end="url(#m1F3864)"/><rect x="302" y="60" width="70" height="36" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="337" y="83" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="middle" font-weight="bold">=? =?</text><rect x="390" y="60" width="330" height="36" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="402" y="83" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="start">ASID 1   VPN 10   →   PFN 100</text><text x="735" y="83" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">ASID differs: ignored, but kept</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="212" y1="105" x2="300" y2="128" stroke="#1F3864" stroke-width="1.2" marker-end="url(#m1F3864)"/><rect x="302" y="110" width="70" height="36" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="337" y="133" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="middle" font-weight="bold">=? =?</text><rect x="390" y="110" width="330" height="36" rx="4" fill="#E3F2E1" stroke="#2E7D32" stroke-width="2"/><text x="402" y="133" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="start">ASID 2   VPN 10   →   PFN 170</text><text x="735" y="133" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2E7D32" text-anchor="start" font-weight="bold">both match: PFN 170</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="212" y1="105" x2="300" y2="178" stroke="#1F3864" stroke-width="1.2" marker-end="url(#m1F3864)"/><rect x="302" y="160" width="70" height="36" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="337" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="middle" font-weight="bold">=? =?</text><rect x="390" y="160" width="330" height="36" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="402" y="183" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="start">ASID 1   VPN 12   →   PFN 51</text><text x="735" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">ignored, kept for P1</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="212" y1="105" x2="300" y2="228" stroke="#1F3864" stroke-width="1.2" marker-end="url(#m1F3864)"/><rect x="302" y="210" width="70" height="36" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="337" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="middle" font-weight="bold">=? =?</text><rect x="390" y="210" width="330" height="36" rx="4" fill="#E3F2E1" stroke="#2E7D32" stroke-width="2"/><text x="402" y="233" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="start">ASID G   VPN 500   →   PFN 9</text><text x="735" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2E7D32" text-anchor="start" font-weight="bold">global bit: matches any ASID</text><text x="20" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">satp on RISC-V (64 bits):</text><rect x="230" y="272" width="0" height="0" rx="2" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="230.0" y="272.0" font-family="'Courier New', monospace" font-size="0" fill="#262626" text-anchor="middle" font-weight="bold">MODE  63…60</text><rect x="230" y="272" width="0" height="0" rx="2" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><rect x="230" y="272" width="60" height="32" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="260.0" y="293" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">MODE</text><text x="260.0" y="320" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle">bits 63 to 60</text><rect x="290" y="272" width="160" height="32" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="370.0" y="293" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">ASID</text><text x="370.0" y="320" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle">bits 59 to 44</text><rect x="450" y="272" width="440" height="32" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="670.0" y="293" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">PPN: frame number of the page table</text><text x="670.0" y="320" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle">bits 43 to 0</text><text x="230" y="340" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="start">MAKE_SATP(pt) = SATP_SV39 | (pt &gt;&gt; 12)   sets MODE = 8 and the PPN;</text><text x="230" y="356" font-family="'Courier New', monospace" font-size="12" fill="#262626" text-anchor="start">it never writes bits 59 to 44, so ASID = 0 for every process.</text><rect x="20" y="368" width="920" height="60" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="32" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">Running out of numbers</text><text x="32" y="409.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">16 bits allow 65,536 ASIDs (a chip may implement fewer). When Linux has handed them all out it flushes the whole TLB once, starts a new</text><text x="32" y="424.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">&quot;generation&quot;, and reuses the numbers from 0. So the fallback is Fix 1, done once in a long while instead of on every switch.</text></svg>