<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="960" height="300" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F3864" text-anchor="start" font-weight="bold">Steps 3 and 4: what xv6 does, and why it flushes far more often than once per process switch</text><rect x="20" y="60" width="170" height="90" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="105" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="middle" font-weight="bold">user program runs</text><text x="105" y="104" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#262626" text-anchor="middle">TLB warm</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="192" y1="105" x2="206" y2="105" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><rect x="208" y="60" width="170" height="90" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="293" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="middle" font-weight="bold">trap: uservec</text><text x="293" y="104" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#262626" text-anchor="middle">csrw satp (kernel table)</text><text x="293" y="120" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#262626" text-anchor="middle">sfence.vma → empty</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="380" y1="105" x2="394" y2="105" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><rect x="396" y="60" width="170" height="90" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="481" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="middle" font-weight="bold">kernel runs</text><text x="481" y="104" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#262626" text-anchor="middle">TLB fills with kernel entries</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="568" y1="105" x2="582" y2="105" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><rect x="584" y="60" width="170" height="90" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="669" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="middle" font-weight="bold">return: userret</text><text x="669" y="104" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#262626" text-anchor="middle">sfence.vma, csrw satp (user),</text><text x="669" y="120" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#262626" text-anchor="middle">sfence.vma → empty</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="756" y1="105" x2="770" y2="105" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><rect x="772" y="60" width="170" height="90" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="857" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F3864" text-anchor="middle" font-weight="bold">same program continues</text><text x="857" y="104" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#262626" text-anchor="middle">cold: misses again</text><text x="20" y="185" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">trampoline.S line 92: csrw satp, t1   then line 95: sfence.vma zero, zero        (into the kernel)</text><text x="20" y="205" font-family="'Courier New', monospace" font-size="12.5" fill="#262626" text-anchor="start">trampoline.S lines 106–108: sfence.vma zero, zero / csrw satp, a0 / sfence.vma zero, zero   (back to user)</text><text x="20" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">The kernel has a page table of its own, so every system call and every timer interrupt changes tables twice, even when the same</text><text x="20" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">process continues afterwards. With no ASID, every change of table must flush. Correct, simple, and slow; Linux avoids it with Fix 2.</text></svg>