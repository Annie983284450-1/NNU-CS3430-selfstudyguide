<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="860" height="330" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F3864" text-anchor="start" font-weight="bold">A 6-bit register, before and after  x &gt;&gt; 4</text><text x="20" y="60" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A" text-anchor="start">before</text><rect x="90" y="40" width="40" height="36" rx="2" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.2"/><text x="110.0" y="64.48" font-family="'Courier New', monospace" font-size="18" fill="#262626" text-anchor="middle" font-weight="bold">1</text><rect x="130" y="40" width="40" height="36" rx="2" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.2"/><text x="150.0" y="64.48" font-family="'Courier New', monospace" font-size="18" fill="#262626" text-anchor="middle" font-weight="bold">1</text><rect x="170" y="40" width="40" height="36" rx="2" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="190.0" y="64.48" font-family="'Courier New', monospace" font-size="18" fill="#262626" text-anchor="middle" font-weight="bold">0</text><rect x="210" y="40" width="40" height="36" rx="2" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="230.0" y="64.48" font-family="'Courier New', monospace" font-size="18" fill="#262626" text-anchor="middle" font-weight="bold">0</text><rect x="250" y="40" width="40" height="36" rx="2" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="270.0" y="64.48" font-family="'Courier New', monospace" font-size="18" fill="#262626" text-anchor="middle" font-weight="bold">0</text><rect x="290" y="40" width="40" height="36" rx="2" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="310.0" y="64.48" font-family="'Courier New', monospace" font-size="18" fill="#262626" text-anchor="middle" font-weight="bold">0</text><text x="345" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="start">= 32 + 16 = 48</text><text x="20" y="135" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A" text-anchor="start">after</text><rect x="90" y="115" width="40" height="36" rx="2" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="110.0" y="139.48" font-family="'Courier New', monospace" font-size="18" fill="#262626" text-anchor="middle" font-weight="bold">0</text><rect x="130" y="115" width="40" height="36" rx="2" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="150.0" y="139.48" font-family="'Courier New', monospace" font-size="18" fill="#262626" text-anchor="middle" font-weight="bold">0</text><rect x="170" y="115" width="40" height="36" rx="2" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="190.0" y="139.48" font-family="'Courier New', monospace" font-size="18" fill="#262626" text-anchor="middle" font-weight="bold">0</text><rect x="210" y="115" width="40" height="36" rx="2" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="230.0" y="139.48" font-family="'Courier New', monospace" font-size="18" fill="#262626" text-anchor="middle" font-weight="bold">0</text><rect x="250" y="115" width="40" height="36" rx="2" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.2"/><text x="270.0" y="139.48" font-family="'Courier New', monospace" font-size="18" fill="#262626" text-anchor="middle" font-weight="bold">1</text><rect x="290" y="115" width="40" height="36" rx="2" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.2"/><text x="310.0" y="139.48" font-family="'Courier New', monospace" font-size="18" fill="#262626" text-anchor="middle" font-weight="bold">1</text><text x="345" y="137" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="start">= 2 + 1 = 3</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="110" y1="78" x2="270" y2="113" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="150" y1="78" x2="310" y2="113" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><rect x="330" y="90" width="1" height="1" rx="4" fill="#fff" stroke="#fff" stroke-width="1.5"/><text x="470" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A" text-anchor="start" font-style="italic">the four 0s on the right fall off the end</text><defs><marker id="m8A8A8A" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8A8A8A"/></marker></defs><line x1="320" y1="80" x2="465" y2="96" stroke="#8A8A8A" stroke-width="1.2" marker-end="url(#m8A8A8A)" stroke-dasharray="4 3"/><text x="20" y="185" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A" text-anchor="start" font-style="italic">four new 0s come in at the left</text><defs><marker id="m8A8A8A" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8A8A8A"/></marker></defs><line x1="130" y1="170" x2="130" y2="150" stroke="#8A8A8A" stroke-width="1.2" marker-end="url(#m8A8A8A)" stroke-dasharray="4 3"/><rect x="20" y="210" width="820" height="100" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="32" y="232" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F3864" text-anchor="start" font-weight="bold">Same number, two spellings</text><text x="32" y="252.8" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="start">&quot;110000 &gt;&gt; 4 is 11&quot; means the binary number 11, which is 3. Written out in all six bits it is 000011.</text><text x="32" y="270.35" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="start">Leading zeros do not change a value, so 11, 0011 and 000011 are the same number: 3.</text><text x="32" y="287.90000000000003" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="start">The register always has six bits; the shift moves every bit, drops four, and fills four with 0.</text></svg>