<svg xmlns="http://www.w3.org/2000/svg" width="960" height="445" viewBox="0 0 960 445" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="960" height="445" fill="#fff"/><rect x="20" y="40" width="200" height="56" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="120.0" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle" font-weight="bold">instruction uses a</text><text x="120.0" y="77" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">virtual address</text><rect x="300" y="40" width="200" height="56" rx="6" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="400.0" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle" font-weight="bold">ask the TLB</text><text x="400.0" y="77" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">(every slot at once)</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="222" y1="68" x2="298" y2="68" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><rect x="600" y="20" width="330" height="56" rx="6" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="765.0" y="40" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle" font-weight="bold">HIT (the common case)</text><text x="765.0" y="57" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">frame number out, one memory access</text><defs><marker id="m2E7D32" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2E7D32"/></marker></defs><line x1="502" y1="60" x2="598" y2="48" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#m2E7D32)"/><text x="540" y="45" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2E7D32" text-anchor="start">found</text><rect x="300" y="150" width="200" height="56" rx="6" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="400.0" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle" font-weight="bold">TLB MISS</text><text x="400.0" y="187" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">read the row from the table</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="400" y1="98" x2="400" y2="148" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><text x="410" y="128" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start">not found</text><rect x="300" y="260" width="200" height="56" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="400.0" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle" font-weight="bold">row valid, and this</text><text x="400.0" y="297" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">kind of access allowed?</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="400" y1="208" x2="400" y2="258" stroke="#1F3864" stroke-width="1.8" marker-end="url(#m1F3864)"/><rect x="600" y="150" width="330" height="70" rx="6" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="765.0" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle" font-weight="bold">fill a slot, retry the instruction</text><text x="765.0" y="187" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">it hits this time; cost = 1 extra memory read;</text><text x="765.0" y="204" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">the program never notices</text><defs><marker id="m2E7D32" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2E7D32"/></marker></defs><path d="M 502 288 L 560 288 L 560 185 L 598 185" stroke="#2E7D32" stroke-width="1.8" fill="none" marker-end="url(#m2E7D32)"/><text x="508" y="278" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2E7D32" text-anchor="start">yes</text><rect x="600" y="300" width="330" height="90" rx="6" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.5"/><text x="765.0" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle" font-weight="bold">PAGE FAULT: trap into the OS</text><text x="765.0" y="337" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">V = 0, or write to r-x, or user touching a page</text><text x="765.0" y="354" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">with no u.  The OS decides: kill the process</text><text x="765.0" y="371" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">(xv6, scause 13 / 15), or fetch the page from disk</text><defs><marker id="mB03A2E" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B03A2E"/></marker></defs><line x1="502" y1="300" x2="598" y2="330" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#mB03A2E)"/><text x="515" y="325" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#B03A2E" text-anchor="start">no</text><text x="20" y="428" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">A page fault always begins as a miss (the row must be read before it can be found bad), but almost every miss ends in a hit on the retry.</text></svg>