<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="940" height="330" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Fully associative: any VPN may sit in any slot, so every slot is compared at once</text><rect x="20" y="120" width="120" height="44" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="80" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="middle">VPN asked</text><text x="80" y="158" font-family="'Courier New', monospace" font-size="16" fill="#262626" text-anchor="middle" font-weight="bold">7</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="142" y1="142" x2="250" y2="80" stroke="#1F3864" stroke-width="1.4" marker-end="url(#m1F3864)"/><rect x="252" y="60" width="60" height="40" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="282" y="75" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">=?</text><text x="282" y="92" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#8A8A8A" text-anchor="middle">cmp</text><rect x="330" y="60" width="300" height="40" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="345" y="85" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="start">slot 0:  VPN 6  →  PFN 23</text><text x="650" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#8A8A8A" text-anchor="start">no match: stay quiet</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="142" y1="142" x2="250" y2="138" stroke="#1F3864" stroke-width="1.4" marker-end="url(#m1F3864)"/><rect x="252" y="118" width="60" height="40" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="282" y="133" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">=?</text><text x="282" y="150" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#8A8A8A" text-anchor="middle">cmp</text><rect x="330" y="118" width="300" height="40" rx="4" fill="#E3F2E1" stroke="#2E7D32" stroke-width="2"/><text x="345" y="143" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="start">slot 1:  VPN 7  →  PFN 11</text><text x="650" y="143" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2E7D32" text-anchor="start" font-weight="bold">match: hand out PFN 11</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="142" y1="142" x2="250" y2="196" stroke="#1F3864" stroke-width="1.4" marker-end="url(#m1F3864)"/><rect x="252" y="176" width="60" height="40" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="282" y="191" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">=?</text><text x="282" y="208" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#8A8A8A" text-anchor="middle">cmp</text><rect x="330" y="176" width="300" height="40" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="345" y="201" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="start">slot 2:  VPN 8  →  PFN 40</text><text x="650" y="201" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#8A8A8A" text-anchor="start">no match: stay quiet</text><defs><marker id="m1F3864" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker></defs><line x1="142" y1="142" x2="250" y2="254" stroke="#1F3864" stroke-width="1.4" marker-end="url(#m1F3864)"/><rect x="252" y="234" width="60" height="40" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="282" y="249" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">=?</text><text x="282" y="266" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#8A8A8A" text-anchor="middle">cmp</text><rect x="330" y="234" width="300" height="40" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="345" y="259" font-family="'Courier New', monospace" font-size="13" fill="#262626" text-anchor="start">slot 3:  VPN 2  →  PFN 35</text><text x="650" y="259" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#8A8A8A" text-anchor="start">no match: stay quiet</text><text x="20" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">One comparator per slot, all working in the same clock tick. That is what makes a lookup take a few ticks and no memory access.</text><text x="20" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">It is also why a TLB stays small: 1000 slots means 1000 comparators drawing power on every single access.</text></svg>