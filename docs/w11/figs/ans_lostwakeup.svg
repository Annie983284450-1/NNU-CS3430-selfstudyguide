<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400"><rect x="0" y="0" width="700" height="400" fill="#ffffff"/><text x="150" y="26" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F3864" text-anchor="middle">process A (virtio_disk_rw)</text><text x="470" y="26" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#A0632A" text-anchor="middle">interrupt handler (virtio_disk_intr)</text><line x1="150" y1="36" x2="150" y2="370" stroke="#D6D6D6" stroke-width="2"/><line x1="470" y1="36" x2="470" y2="370" stroke="#D6D6D6" stroke-width="2"/><rect x="25.0" y="60" width="250" height="34" rx="6" fill="#E8EEF7" stroke="#1F3864" stroke-width="1.4"/><text x="150" y="82" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1F3864" text-anchor="middle">1  notify the disk</text><rect x="25.0" y="112" width="250" height="34" rx="6" fill="#E8EEF7" stroke="#1F3864" stroke-width="1.4"/><text x="150" y="134" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1F3864" text-anchor="middle">2  line 284: b-&gt;disk is 1</text><rect x="320.0" y="164" width="300" height="34" rx="6" fill="#FBF0E4" stroke="#A0632A" stroke-width="1.4"/><text x="470" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#A0632A" text-anchor="middle">3  the disk interrupts: handler runs</text><rect x="320.0" y="216" width="300" height="34" rx="6" fill="#FBF0E4" stroke="#A0632A" stroke-width="1.4"/><text x="470" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#A0632A" text-anchor="middle">4  line 320: b-&gt;disk = 0; line 321: wakeup(b)</text><rect x="25.0" y="268" width="250" height="34" rx="6" fill="#FBE3E0" stroke="#C0392B" stroke-width="1.4"/><text x="150" y="290" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#C0392B" text-anchor="middle">5  sleep(b): A falls asleep</text><rect x="25.0" y="320" width="250" height="34" rx="6" fill="#FBE3E0" stroke="#C0392B" stroke-width="1.4"/><text x="150" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#C0392B" text-anchor="middle">6  no more interrupts: asleep forever</text><path d="M 275 129 L 300 129 L 300 181 L 320 181" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="6 4"/><text x="150" y="163" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C0392B" text-anchor="middle" font-style="italic">no lock held: the handler can run here</text><path d="M 320 233 C 260 245, 310 252, 275 285" fill="none" stroke="#7F7F7F" stroke-width="1.6" stroke-dasharray="3 4"/><text x="470" y="267" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#7F7F7F" text-anchor="middle" font-style="italic">wakeup finds nobody asleep on b</text><text x="14" y="392" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#7F7F7F" text-anchor="start" font-style="italic">time runs downward; one CPU</text></svg>