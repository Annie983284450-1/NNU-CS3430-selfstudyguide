<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 1 870 285" width="870" height="285" role="img"><title>Two ways of using a disk</title><defs><marker id="ah1e6b3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e6b3a"/></marker><marker id="as1e6b3a" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e6b3a"/></marker><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect x="3" y="1" width="870" height="285" fill="#ffffff"/><text x="10.0" y="19.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#b23a48" text-anchor="start" font-weight="700">Case 1: small reads at random places (a database reads small 4 KB pieces)</text><rect x="10.0" y="34.0" width="88.0" height="50.0" rx="3" fill="#ffffff" stroke="#1f3864" stroke-width="1.2"/><rect x="106.0" y="34.0" width="88.0" height="50.0" rx="3" fill="#b23a48" stroke="#1f3864" stroke-width="1.2"/><rect x="202.0" y="34.0" width="88.0" height="50.0" rx="3" fill="#b23a48" stroke="#1f3864" stroke-width="1.2"/><rect x="298.0" y="34.0" width="88.0" height="50.0" rx="3" fill="#ffffff" stroke="#1f3864" stroke-width="1.2"/><rect x="394.0" y="34.0" width="88.0" height="50.0" rx="3" fill="#b23a48" stroke="#1f3864" stroke-width="1.2"/><rect x="490.0" y="34.0" width="88.0" height="50.0" rx="3" fill="#ffffff" stroke="#1f3864" stroke-width="1.2"/><rect x="586.0" y="34.0" width="88.0" height="50.0" rx="3" fill="#ffffff" stroke="#1f3864" stroke-width="1.2"/><rect x="682.0" y="34.0" width="88.0" height="50.0" rx="3" fill="#b23a48" stroke="#1