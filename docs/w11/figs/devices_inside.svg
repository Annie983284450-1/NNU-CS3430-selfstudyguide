<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 984 434" width="984" height="434" role="img"><title>Inside, a disk, a keyboard and a network card have nothing in common</title><defs></defs><rect x="3" y="3" width="984" height="434" fill="#ffffff"/><rect x="10.0" y="10.0" width="310.0" height="420.0" rx="16" fill="#ffffff" stroke="#b8560f" stroke-width="2"/><text x="165.0" y="47.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#b8560f" text-anchor="middle" font-weight="700">disk</text><rect x="32.0" y="70.0" width="266.0" height="96.0" rx="8" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="1.2"/><text x="165.0" y="124.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1b2430" text-anchor="middle">spinning platters</text><rect x="32.0" y="186.0" width="266.0" height="96.0" rx="8" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="1.2"/><text x="165.0" y="240.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1b2430" text-anchor="middle">a motor and an arm</text><rect x="32.0" y="302.0" width="266.0" height="96.0" rx="8" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="1.2"/><text x="165.0" y="356.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1b2430" text-anchor="middle">its own chips</text><rect x="340.0" y="10.0" width="310.0" height="420.0" rx="16" fill="#ffffff" stroke="#b8560f" stroke-width="2"/><text x="495.0" y="47.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#b8560f" text-anchor="middle" font-weight="700">keyboard</text><rect x="362.0" y="70.0" width="266.0" height="96.0" rx="8" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="1.2"/><text x="495.0" y="124.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1b2430" text-anchor="middle">a grid of keys</text><rect x="362.0" y="186.0" width="266.0" height="96.0" rx="8" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="1.2"/><text x="495.0" y="240.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1b2430" text-anchor="middle">a tiny chip that scans it</text><rect x="670.0" y="10.0" width="310.0" height="420.0" rx="16" fill="#ffffff" stroke="#b8560f" stroke-width="2"/><text x="825.0" y="47.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#b8560f" text-anchor="middle" font-weight="700">network card</text><rect x="692.0" y="70.0" width="266.0" height="96.0" rx="8" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="1.2"/><text x="825.0" y="124.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1b2430" text-anchor="middle">a cable or radio</text><rect x="692.0" y="186.0" width="266.0" height="96.0" rx="8" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="1.2"/><text x="825.0" y="240.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1b2430" text-anchor="middle">a chip, memory</text><rect x="692.0" y="302.0" width="266.0" height="96.0" rx="8" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="1.2"/><text x="825.0" y="356.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1b2430" text-anchor="middle">its own software</text></svg>
