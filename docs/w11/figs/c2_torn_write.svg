<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 1 918 141" width="918" height="141" role="img"><title>A torn write</title><defs></defs><rect x="3" y="1" width="918" height="141" fill="#ffffff"/><text x="10.0" y="19.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1f3864" text-anchor="start" font-weight="700">a write of 4 KB (4,096 bytes) is 8 sectors: 4,096 / 512 = 8</text><rect x="10.0" y="34.0" width="106.0" height="56.0" rx="2" fill="#1e6b3a" stroke="#1e6b3a" stroke-width="1.4"/><text x="63.0" y="68.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">new</text><rect x="124.0" y="34.0" width="106.0" height="56.0" rx="2" fill="#1e6b3a" stroke="#1e6b3a" stroke-width="1.4"/><text x="177.0" y="68.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">new</text><rect x="238.0" y="34.0" width="106.0" height="56.0" rx="2" fill="#1e6b3a" stroke="#1e6b3a" stroke-width="1.4"/><text x="291.0" y="68.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">new</text><rect x="352.0" y="34.0" width="106.0" height="56.0" rx="2" fill="#e9ebef" stroke="#5b6675" stroke-width="1.4"/><text x="405.0" y="68.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1b2430" text-anchor="middle" font-weight="700">old</text><rect x="466.0" y="34.0" width="106.0" height="56.0" rx="2" fill="#e9ebef" stroke="#5b6675" stroke-width="1.4"/><text x="519.0" y="68.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1b2430" text-anchor="middle" font-weight="700">old</text><rect x="580.0" y="34.0" width="106.0" height="56.0" rx="2" fill="#e9ebef" stroke="#5b6675" stroke-width="1.4"/><text x="633.0" y="68.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1b2430" text-anchor="middle" font-weight="700">old</text><rect x="694.0" y="34.0" width="106.0" height="56.0" rx="2" fill="#e9ebef" stroke="#5b6675" stroke-width="1.4"/><text x="747.0" y="68.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1b2430" text-anchor="middle" font-weight="700">old</text><rect x="808.0" y="34.0" width="106.0" height="56.0" rx="2" fill="#e9ebef" stroke="#5b6675" stroke-width="1.4"/><text x="861.0" y="68.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1b2430" text-anchor="middle" font-weight="700">old</text><line x1="348.0" y1="26.0" x2="348.0" y2="98.0" stroke="#b23a48" stroke-width="3"/><text x="10.0" y="131.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#b23a48" text-anchor="start" font-weight="700">the power failed after 3 sectors: the write is torn, part new, part old</text></svg>
