<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 994 253" width="994" height="253" role="img"><title>Who schedules</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect x="3" y="3" width="994" height="253" fill="#ffffff"/><rect x="10.0" y="10.0" width="420.0" height="100.0" rx="10" fill="#eef3fa" stroke="#1f3864" stroke-width="1.6"/><text x="220.0" y="55.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f3864" text-anchor="middle" font-weight="700">the OS</text><text x="220.0" y="75.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f3864" text-anchor="middle" font-weight="700">picks a few requests, merges adjacent ones</text><rect x="560.0" y="10.0" width="430.0" height="100.0" rx="10" fill="#ffffff" stroke="#b8560f" stroke-width="1.6"/><text x="775.0" y="55.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#b8560f" text-anchor="middle" font-weight="700">the drive</text><text x="775.0" y="75.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#b8560f" text-anchor="middle" font-weight="700">orders them by SPTF with the exact head position</text><line x1="434.0" y1="60.0" x2="556.0" y2="60.0" stroke="#1f3864" stroke-width="2.2" marker-end="url(#ah1f3864)"/><text x="10.0" y="147.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f3864" text-anchor="start" font-weight="700">three requests arrive: blocks 33, then 8, then 34</text><rect x="10.0" y="162.0" width="110.0" height="56.0" rx="4" fill="#f9c74f" stroke="#f9c74f" stroke-width="1.2"/><text x="65.0" y="197.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1b2430" text-anchor="middle" font-weight="700">33</text><rect x="140.0" y="162.0" width="110.0" height="56.0" rx="4" fill="#f9c74f" stroke="#f9c74f" stroke-width="1.2"/><text x="195.0" y="197.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1b2430" text-anchor="middle" font-weight="700">8</text><rect x="270.0" y="162.0" width="110.0" height="56.0" rx="4" fill="#f9c74f" stroke="#f9c74f" stroke-width="1.2"/><text x="325.0" y="197.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1b2430" text-anchor="middle" font-weight="700">34</text><line x1="410.0" y1="190.0" x2="470.0" y2="190.0" stroke="#1f3864" stroke-width="2.2" marker-end="url(#ah1f3864)"/><rect x="480.0" y="162.0" width="210.0" height="56.0" rx="4" fill="#1e6b3a" stroke="#1e6b3a" stroke-width="1.2"/><text x="585.0" y="197.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">33 and 34</text><rect x="710.0" y="162.0" width="110.0" height="56.0" rx="4" fill="#f9c74f" stroke="#f9c74f" stroke-width="1.2"/><text x="765.0" y="197.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1b2430" text-anchor="middle" font-weight="700">8</text><text x="650.0" y="246.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6675" text-anchor="middle">two requests reach the disk</text></svg>
