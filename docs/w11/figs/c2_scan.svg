)"/><text x="24.0" y="62.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="start" font-weight="700">sweep 1: outward</text><text x="24.0" y="316.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">The head serves 29, then 16, then 2, as it reaches</text><text x="24.0" y="333.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">each track.</text><rect x="355.0" y="10.0" width="330.0" height="360.0" rx="12" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="369.0" y="37.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="start" font-weight="700">2  New requests must wait</text><circle cx="555.0" cy="160.0" r="105" fill="#f5f5f5" stroke="#7f7f7f" stroke-width="2"/><circle cx="555.0" cy="160.0" r="77.7" fill="none" stroke="#c4cad2" stroke-width="1.2"/><circle cx="555.0" cy="160.0" r="50.4" fill="none" stroke="#c4cad2" stroke-width="1.2"/><line x1="577.3" y1="166.0" x2="656.4" y2="187.2" stroke="#c4cad2" stroke-width="1"/><line x1="571.3" y1="176.3" x2="629.2" y2="234.2" stroke="#c4cad2" stroke-width="1"/><line x1="561.0" y1="182.3" x2="582.2" y2="261.4" stroke="#c4cad2" stroke-width="1"/><line x1="549.0" y1="182.3" x2="527.8" y2="261.4" stroke="#c4cad2" stroke-width="1"/><line x1="538.7" y1="176.3" x2="480.8" y2="234.2" stroke="#c4cad2" stroke-width="1"/><line x1="532.7" y1="166.0" x2="453.6" y2="187.2" stroke="#c4cad2" stroke-width="1"/><line x1="532.7" y1="154.0" x2="453.6" y2="132.8" stroke="#c4cad2" stroke-width="1"/><line x1="538.7" y1="143.7" x2="480.8" y2="85.8" stroke="#c4cad2" stroke-width="1"/><line x1="549.0" y1="137.7" x2="527.8" y2="58.6" stroke="#c4cad2" stroke-width="1"/><line x1="561.0" y1="137.7" x2="582.2" y2="58.6" stroke="#c4cad2" stroke-width="1"/><line x1="571.3" y1="143.7" x2="629.2" y2="85.8" stroke="#c4cad2" stroke