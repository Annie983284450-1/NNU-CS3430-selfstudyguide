<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2 894 235" width="894" height="235" role="img"><title>The three parts of a process: memory, registers, open files</title><defs></defs><rect x="3" y="2" width="894" height="235" fill="#ffffff"/><text x="10.0" y="18.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">1. its memory: the address space</text><rect x="10.0" y="30.0" width="250.0" height="30.0" rx="0" fill="#fbe9da" stroke="#9aa3b2" stroke-width="1"/><text x="135.0" y="49.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">stack ↓  (locals, argc/argv)</text><rect x="10.0" y="60.0" width="250.0" height="60.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="135.0" y="94.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#7a8291" text-anchor="middle">free</text><rect x="10.0" y="120.0" width="250.0" height="30.0" rx="0" fill="#e3f1e4" stroke="#9aa3b2" stroke-width="1"/><text x="135.0" y="139.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">heap ↑  (malloc)</text><rect x="10.0" y="150.0" width="250.0" height="30.0" rx="0" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1"/><text x="135.0" y="169.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">static data  (globals)</text><rect x="10.0" y="180.0" width="250.0" height="30.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="135.0" y="199.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">code  (the program text)</text><text x="266.0" y="37.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#7a8291" text-anchor="start">high</text><text x="266.0" y="209.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#7a8291" text-anchor="start">low</text><text x="10.0" y="227.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">Every instruction and almost all data live here.</text><text x="320.0" y="18.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">2. its registers</text><rect x="320.0" y="30.0" width="250.0" height="32.0" rx="2" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1"/><text x="445.0" y="49.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="middle">PC   program counter: the next instruction</text><rect x="320.0" y="68.0" width="250.0" height="32.0" rx="2" fill="#fbe9da" stroke="#9aa3b2" stroke-width="1"/><text x="445.0" y="87.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="middle">SP   stack pointer: top of the stack</text><rect x="320.0" y="106.0" width="250.0" height="46.0" rx="2" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="445.0" y="126.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="middle">about 30 more: a0 ... a7 arguments and</text><text x="445.0" y="139.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="middle">return value, s0 ... s11 saved values, ra ...</text><text x="320.0" y="171.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">Small enough to copy. Save these 32 numbers and</text><text x="320.0" y="186.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">the process is frozen; load them back and it</text><text x="320.0" y="200.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">continues.</text><text x="630.0" y="18.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">3. its I/O state: open files</text><rect x="630.0" y="30.0" width="30.0" height="30.0" rx="0" fill="#1f3864" stroke="#1f3864" stroke-width="1"/><text x="645.0" y="49.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">0</text><rect x="660.0" y="30.0" width="230.0" height="30.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="775.0" y="49.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1b2430" text-anchor="middle">stdin   → keyboard</text><rect x="630.0" y="64.0" width="30.0" height="30.0" rx="0" fill="#1f3864" stroke="#1f3864" stroke-width="1"/><text x="645.0" y="83.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><rect x="660.0" y="64.0" width="230.0" height="30.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="775.0" y="83.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1b2430" text-anchor="middle">stdout  → screen</text><rect x="630.0" y="98.0" width="30.0" height="30.0" rx="0" fill="#1f3864" stroke="#1f3864" stroke-width="1"/><text x="645.0" y="117.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><rect x="660.0" y="98.0" width="230.0" height="30.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="775.0" y="117.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1b2430" text-anchor="middle">stderr  → screen</text><rect x="630.0" y="132.0" width="30.0" height="30.0" rx="0" fill="#ffffff" stroke="#1f3864" stroke-width="1"/><text x="645.0" y="151.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#7a8291" text-anchor="middle" font-weight="700">3</text><rect x="660.0" y="132.0" width="230.0" height="30.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="775.0" y="151.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#7a8291" text-anchor="middle">(free)</text><text x="630.0" y="179.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">The per-process table of open files (ofile[16] in xv6).</text><text x="630.0" y="194.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">Every process is born with 0, 1, 2 already open.</text></svg>
