<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 4 893 267" width="893" height="267" role="img"><title>The first week, second class: counter++ is three steps, and a write is a promise</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="ah7a8291" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8291"/></marker><marker id="as7a8291" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8291"/></marker></defs><rect x="3" y="4" width="893" height="267" fill="#ffffff"/><rect x="10.0" y="10.0" width="430.0" height="30.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="0"/><text x="225.0" y="29.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">1  CONCURRENCY: counter++ is 3 steps</text><rect x="10.0" y="52.0" width="136.0" height="50.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="78.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="middle">load</text><text x="78.0" y="87.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="middle">read counter into a register</text><rect x="156.0" y="52.0" width="136.0" height="50.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="224.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="middle">add</text><text x="224.0" y="87.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="middle">add 1 in the register</text><rect x="302.0" y="52.0" width="136.0" height="50.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="370.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="middle">store</text><text x="370.0" y="87.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="middle">write the register back</text><text x="10.0" y="122.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b23a48" text-anchor="start" font-weight="700">thread B can slip in between A&#x27;s load and A&#x27;s store</text><rect x="10.0" y="134.0" width="90.0" height="24.0" rx="0" fill="#e9ebef" stroke="#9aa3b2" stroke-width="1"/><text x="55.0" y="150.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle" font-weight="700">loops</text><rect x="100.0" y="134.0" width="110.0" height="24.0" rx="0" fill="#e9ebef" stroke="#9aa3b2" stroke-width="1"/><text x="155.0" y="150.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle" font-weight="700">expected</text><rect x="210.0" y="134.0" width="230.0" height="24.0" rx="0" fill="#e9ebef" stroke="#9aa3b2" stroke-width="1"/><text x="325.0" y="150.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle" font-weight="700">got</text><rect x="10.0" y="158.0" width="90.0" height="24.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="55.0" y="174.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">1000</text><rect x="100.0" y="158.0" width="110.0" height="24.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="155.0" y="174.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">2000</text><rect x="210.0" y="158.0" width="230.0" height="24.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="325.0" y="174.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">2000, every run</text><rect x="10.0" y="182.0" width="90.0" height="24.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="55.0" y="198.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">10000</text><rect x="100.0" y="182.0" width="110.0" height="24.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="155.0" y="198.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">20000</text><rect x="210.0" y="182.0" width="230.0" height="24.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="325.0" y="198.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">right once in 20</text><rect x="10.0" y="206.0" width="90.0" height="24.0" rx="0" fill="#f8e3e6" stroke="#9aa3b2" stroke-width="1"/><text x="55.0" y="222.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">100000</text><rect x="100.0" y="206.0" width="110.0" height="24.0" rx="0" fill="#f8e3e6" stroke="#9aa3b2" stroke-width="1"/><text x="155.0" y="222.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">200000</text><rect x="210.0" y="206.0" width="230.0" height="24.0" rx="0" fill="#f8e3e6" stroke="#9aa3b2" stroke-width="1"/><text x="325.0" y="222.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">103902, 120205 ...</text><text x="10.0" y="247.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">Two threads share one memory and one counter; a lock around the 3 steps makes every</text><text x="10.0" y="262.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">run right. The bug was there at 1000 too; only the long run gave it a chance.</text><rect x="460.0" y="10.0" width="430.0" height="30.0" rx="4" fill="#b8560f" stroke="#b8560f" stroke-width="0"/><text x="675.0" y="29.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">2  PERSISTENCE: a write is a promise</text><rect x="470.0" y="56.0" width="100.0" height="40.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="520.0" y="80.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">write()</text><line x1="572.0" y1="76.0" x2="614.0" y2="76.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)"/><rect x="616.0" y="56.0" width="110.0" height="40.0" rx="4" fill="#fbe9da" stroke="#b8560f" stroke-width="1.2"/><text x="671.0" y="80.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">RAM</text><line x1="728.0" y1="76.0" x2="778.0" y2="76.0" stroke="#7a8291" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ah7a8291)"/><rect x="780.0" y="56.0" width="100.0" height="40.0" rx="4" fill="#e9ebef" stroke="#9aa3b2" stroke-width="1.2"/><text x="830.0" y="80.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">disk</text><text x="470.0" y="116.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">write() returns when the bytes are in RAM; the disk gets them later (about 30 s</text><text x="470.0" y="131.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">on Linux).</text><rect x="470.0" y="156.0" width="190.0" height="50.0" rx="6" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="565.0" y="177.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">no fsync</text><text x="565.0" y="193.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">0.2 µs per write</text><rect x="690.0" y="156.0" width="190.0" height="50.0" rx="6" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="785.0" y="177.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">fsync each write</text><text x="785.0" y="193.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">1638 µs per write</text><text x="470.0" y="224.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">fsync() does not return until the disk has the bytes: thousands of times slower.</text><text x="470.0" y="239.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">Every database pays this on every commit.</text></svg>
