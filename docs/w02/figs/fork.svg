<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 894 322" width="894" height="322" role="img"><title>fork(): one process before the call, two after</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect x="3" y="3" width="894" height="322" fill="#ffffff"/><rect x="10.0" y="70.0" width="300.0" height="200.0" rx="12" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="24.0" y="96.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">before fork: one process</text><rect x="24.0" y="106.0" width="272.0" height="32.0" rx="2" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="160.0" y="126.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">memory (code, data, heap, stack)</text><rect x="24.0" y="144.0" width="272.0" height="32.0" rx="2" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="160.0" y="164.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">registers, PC inside fork()</text><rect x="24.0" y="182.0" width="272.0" height="32.0" rx="2" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="160.0" y="202.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">open files 0, 1, 2</text><rect x="24.0" y="220.0" width="272.0" height="32.0" rx="2" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="160.0" y="240.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">pid 1070</text><rect x="560.0" y="10.0" width="330.0" height="130.0" rx="12" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="574.0" y="36.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">after: the parent</text><rect x="574.0" y="46.0" width="302.0" height="32.0" rx="2" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="725.0" y="66.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">same memory, same PC, same files</text><rect x="574.0" y="86.0" width="302.0" height="34.0" rx="2" fill="#e3f1e4" stroke="#9aa3b2" stroke-width="1"/><text x="725.0" y="107.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">pid 1070    fork() returned 1071</text><rect x="560.0" y="170.0" width="330.0" height="130.0" rx="12" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="574.0" y="196.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">after: the child, a copy</text><rect x="574.0" y="206.0" width="302.0" height="32.0" rx="2" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="725.0" y="226.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">same memory, same PC, same files</text><rect x="574.0" y="246.0" width="302.0" height="34.0" rx="2" fill="#fbe9da" stroke="#9aa3b2" stroke-width="1"/><text x="725.0" y="267.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">pid 1071    fork() returned 0</text><line x1="312.0" y1="150.0" x2="556.0" y2="80.0" stroke="#1f3864" stroke-width="2" marker-end="url(#ah1f3864)"/><line x1="312.0" y1="190.0" x2="556.0" y2="240.0" stroke="#1f3864" stroke-width="2" marker-end="url(#ah1f3864)"/><text x="430.0" y="171.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#1f3864" text-anchor="middle" font-weight="700">fork()</text><text x="560.0" y="315.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">Everything is copied; then the kernel sets the child&#x27;s a0 to 0.</text></svg>
