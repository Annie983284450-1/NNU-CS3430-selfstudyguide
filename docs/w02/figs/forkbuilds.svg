<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 894 314" width="894" height="314" role="img"><title>The parent and the child at the instant fork() returns, and the kernel&#x27;s side of the copy</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect x="3" y="3" width="894" height="314" fill="#ffffff"/><rect x="10.0" y="10.0" width="270.0" height="300.0" rx="12" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="22.0" y="34.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">parent</text><rect x="22.0" y="42.0" width="120.0" height="28.0" rx="2" fill="#ffffff" stroke="#1f3864" stroke-width="1"/><text x="82.0" y="60.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">pid 29146</text><rect x="148.0" y="42.0" width="120.0" height="28.0" rx="2" fill="#e3f1e4" stroke="#1f3864" stroke-width="1"/><text x="208.0" y="60.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">RUNNING</text><rect x="22.0" y="80.0" width="120.0" height="30.0" rx="0" fill="#fbe9da" stroke="#9aa3b2" stroke-width="1"/><text x="82.0" y="98.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1f3864" text-anchor="middle">stack: rc, argc, argv</text><rect x="22.0" y="110.0" width="120.0" height="30.0" rx="0" fill="#e3f1e4" stroke="#9aa3b2" stroke-width="1"/><text x="82.0" y="128.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1f3864" text-anchor="middle">heap</text><rect x="22.0" y="140.0" width="120.0" height="30.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="82.0" y="158.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1f3864" text-anchor="middle">data</text><rect x="22.0" y="170.0" width="120.0" height="30.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="82.0" y="188.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1f3864" text-anchor="middle">code: main() ...</text><text x="82.0" y="213.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#7a8291" text-anchor="middle">memory</text><rect x="148.0" y="80.0" width="120.0" height="40.0" rx="2" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="208.0" y="97.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1f3864" text-anchor="middle">PC: line 7,</text><text x="208.0" y="109.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1f3864" text-anchor="middle">returning from fork</text><rect x="148.0" y="126.0" width="120.0" height="34.0" rx="2" fill="#ffffff" stroke="#1f3864" stroke-width="1.4"/><text x="208.0" y="147.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">rc = 29147</text><rect x="148.0" y="166.0" width="120.0" height="40.0" rx="2" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="208.0" y="183.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1f3864" text-anchor="middle">fds 0, 1, 2</text><text x="208.0" y="195.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1f3864" text-anchor="middle">→ the same terminal</text><text x="22.0" y="239.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6675" text-anchor="start">registers: 31 plus the pc</text><rect x="350.0" y="10.0" width="270.0" height="300.0" rx="12" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="362.0" y="34.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">child (new)</text><rect x="362.0" y="42.0" width="120.0" height="28.0" rx="2" fill="#ffffff" stroke="#1f3864" stroke-width="1"/><text x="422.0" y="60.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">pid 29147</text><rect x="488.0" y="42.0" width="120.0" height="28.0" rx="2" fill="#fdf2d6" stroke="#1f3864" stroke-width="1"/><text x="548.0" y="60.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">RUNNABLE</text><rect x="362.0" y="80.0" width="120.0" height="30.0" rx="0" fill="#fbe9da" stroke="#9aa3b2" stroke-width="1"/><text x="422.0" y="98.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1f3864" text-anchor="middle">stack: rc, argc, argv</text><rect x="362.0" y="110.0" width="120.0" height="30.0" rx="0" fill="#e3f1e4" stroke="#9aa3b2" stroke-width="1"/><text x="422.0" y="128.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1f3864" text-anchor="middle">heap</text><rect x="362.0" y="140.0" width="120.0" height="30.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="422.0" y="158.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1f3864" text-anchor="middle">data</text><rect x="362.0" y="170.0" width="120.0" height="30.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="422.0" y="188.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1f3864" text-anchor="middle">code: main() ...</text><text x="422.0" y="213.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#7a8291" text-anchor="middle">memory (a copy)</text><rect x="488.0" y="80.0" width="120.0" height="40.0" rx="2" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="548.0" y="97.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1f3864" text-anchor="middle">PC: line 7,</text><text x="548.0" y="109.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1f3864" text-anchor="middle">returning from fork</text><rect x="488.0" y="126.0" width="120.0" height="34.0" rx="2" fill="#fbe9da" stroke="#1f3864" stroke-width="1.4"/><text x="548.0" y="147.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">rc = 0</text><rect x="488.0" y="166.0" width="120.0" height="40.0" rx="2" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="548.0" y="183.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1f3864" text-anchor="middle">fds 0, 1, 2</text><text x="548.0" y="195.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1f3864" text-anchor="middle">→ the same terminal</text><text x="362.0" y="239.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6675" text-anchor="start">all 31 registers and the pc copied; then one register in</text><text x="362.0" y="252.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6675" text-anchor="start">the child is changed: a0, the return value</text><line x1="284.0" y1="150.0" x2="346.0" y2="150.0" stroke="#1f3864" stroke-width="2" marker-end="url(#ah1f3864)"/><text x="315.0" y="142.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">fork()</text><rect x="640.0" y="10.0" width="250.0" height="300.0" rx="12" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="652.0" y="34.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">inside the kernel</text><text x="652.0" y="51.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="start">a free box in proc[NPROC] is taken (allocproc)</text><text x="652.0" y="72.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="start">child.parent → parent</text><text x="652.0" y="92.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="start">child.pagetable → a fresh copy of every page</text><text x="652.0" y="112.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="start">child.trapframe = parent.trapframe, then a0 = 0</text><text x="652.0" y="133.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="start">child.ofile[i] = parent.ofile[i] (shared, not</text><text x="652.0" y="147.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="start">copied)</text><text x="652.0" y="167.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="start">child.state = RUNNABLE</text><text x="652.0" y="187.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="start">From now on the scheduler sees two runnable</text><text x="652.0" y="202.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="start">processes. It may run either one first.</text></svg>
