<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 894 315" width="894" height="315" role="img"><title>A process is one struct with three parts, and three calls make and control one</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="ah2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="as2e7d32" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker></defs><rect x="3" y="3" width="894" height="315" fill="#ffffff"/><rect x="10.0" y="10.0" width="240.0" height="250.0" rx="10" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="22.0" y="34.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">struct proc (the shell)</text><rect x="22.0" y="46.0" width="216.0" height="42.0" rx="2" fill="#fbe9da" stroke="#9aa3b2" stroke-width="1"/><text x="130.0" y="63.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">1  memory: a strip from 0</text><text x="130.0" y="78.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">code · data · heap · stack</text><rect x="22.0" y="96.0" width="216.0" height="42.0" rx="2" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="130.0" y="121.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">2  registers: pc, sp, 31 more</text><rect x="22.0" y="146.0" width="216.0" height="42.0" rx="2" fill="#e3f1e4" stroke="#9aa3b2" stroke-width="1"/><text x="130.0" y="171.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">3  open files 0, 1, 2</text><rect x="22.0" y="196.0" width="216.0" height="42.0" rx="2" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="130.0" y="221.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">state: RUNNING</text><rect x="330.0" y="10.0" width="240.0" height="250.0" rx="10" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="342.0" y="34.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">a copy (the child)</text><rect x="342.0" y="46.0" width="216.0" height="42.0" rx="2" fill="#fbe9da" stroke="#9aa3b2" stroke-width="1"/><text x="450.0" y="71.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">same memory contents</text><rect x="342.0" y="96.0" width="216.0" height="42.0" rx="2" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="450.0" y="121.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">same registers, a0 = 0</text><rect x="342.0" y="146.0" width="216.0" height="42.0" rx="2" fill="#e3f1e4" stroke="#9aa3b2" stroke-width="1"/><text x="450.0" y="171.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">same open files, shared</text><rect x="342.0" y="196.0" width="216.0" height="42.0" rx="2" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="450.0" y="221.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">state: RUNNABLE</text><rect x="650.0" y="10.0" width="240.0" height="250.0" rx="10" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="662.0" y="34.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">the same child, now wc</text><rect x="662.0" y="46.0" width="216.0" height="42.0" rx="2" fill="#f8e3e6" stroke="#9aa3b2" stroke-width="1"/><text x="770.0" y="71.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">new memory from wc&#x27;s file</text><rect x="662.0" y="96.0" width="216.0" height="42.0" rx="2" fill="#f8e3e6" stroke="#9aa3b2" stroke-width="1"/><text x="770.0" y="121.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">pc = wc&#x27;s first instruction</text><rect x="662.0" y="146.0" width="216.0" height="42.0" rx="2" fill="#e3f1e4" stroke="#9aa3b2" stroke-width="1"/><text x="770.0" y="171.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">same pid, same files</text><rect x="662.0" y="196.0" width="216.0" height="42.0" rx="2" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="770.0" y="221.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">runs, then exit()</text><line x1="252.0" y1="120.0" x2="326.0" y2="120.0" stroke="#1f3864" stroke-width="2" marker-end="url(#ah1f3864)"/><text x="289.0" y="112.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">fork()</text><line x1="572.0" y1="120.0" x2="646.0" y2="120.0" stroke="#1f3864" stroke-width="2" marker-end="url(#ah1f3864)"/><text x="609.0" y="112.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">exec()</text><path d="M 770 262 L 770 286 L 130 286 L 130 264" stroke="#2e7d32" stroke-width="2" fill="none" marker-end="url(#ah2e7d32)"/><text x="450.0" y="308.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="700">wait(): the shell is blocked until the child exits, then collects its status</text></svg>
