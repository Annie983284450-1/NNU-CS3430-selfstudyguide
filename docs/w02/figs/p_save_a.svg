<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 7 894 196" width="894" height="196" role="img"><title>Four copies of cpu.c share one CPU; resuming A exactly needs everything A was using</title><defs></defs><rect x="3" y="7" width="894" height="196" fill="#ffffff"/><rect x="10.0" y="14.0" width="94.0" height="40.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="57.0" y="38.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">./cpu A</text><line x1="57.0" y1="54.0" x2="215.0" y2="96.0" stroke="#1f3864" stroke-width="1.4"/><rect x="114.0" y="14.0" width="94.0" height="40.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="161.0" y="38.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">./cpu B</text><line x1="161.0" y1="54.0" x2="215.0" y2="96.0" stroke="#1f3864" stroke-width="1.4"/><rect x="218.0" y="14.0" width="94.0" height="40.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="265.0" y="38.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">./cpu C</text><line x1="265.0" y1="54.0" x2="215.0" y2="96.0" stroke="#1f3864" stroke-width="1.4"/><rect x="322.0" y="14.0" width="94.0" height="40.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="369.0" y="38.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">./cpu D</text><line x1="369.0" y1="54.0" x2="215.0" y2="96.0" stroke="#1f3864" stroke-width="1.4"/><rect x="10.0" y="96.0" width="410.0" height="34.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="215.0" y="117.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1 physical CPU</text><text x="10.0" y="150.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">Output A B D C A B D C ...: all four advance. Each one is a process, and xv6</text><text x="10.0" y="165.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">keeps one struct proc per process.</text><rect x="470.0" y="14.0" width="90.0" height="40.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="515.0" y="38.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">A runs</text><rect x="560.0" y="14.0" width="90.0" height="40.0" rx="0" fill="#fbe9da" stroke="#9aa3b2" stroke-width="1"/><text x="605.0" y="38.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">B runs</text><rect x="650.0" y="14.0" width="50.0" height="40.0" rx="0" fill="#e3f1e4" stroke="#9aa3b2" stroke-width="1"/><text x="675.0" y="38.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">C</text><rect x="700.0" y="14.0" width="50.0" height="40.0" rx="0" fill="#ece6f5" stroke="#9aa3b2" stroke-width="1"/><text x="725.0" y="38.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">D</text><rect x="750.0" y="14.0" width="90.0" height="40.0" rx="0" fill="#f8e3e6" stroke="#9aa3b2" stroke-width="1"/><text x="795.0" y="38.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">A again?</text><text x="470.0" y="73.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">time, one CPU, switching many times a second</text><rect x="470.0" y="86.0" width="420.0" height="110.0" rx="8" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="484.0" y="110.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="start" font-weight="700">to resume A exactly, what must come back?</text><text x="484.0" y="130.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">the value in A&#x27;s registers (its loop counter, its pc)</text><text x="484.0" y="147.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">the memory where A&#x27;s variables live</text><text x="484.0" y="164.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">the terminal A was printing to</text><text x="484.0" y="181.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b23a48" text-anchor="start">... and what else? Nobody has made the list.</text></svg>
