<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2 894 325" width="894" height="325" role="img"><title>The program hold as a file on disk, and the process exec builds from it</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect x="3" y="2" width="894" height="325" fill="#ffffff"/><text x="10.0" y="18.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">the program: hold, as a file on disk</text><rect x="10.0" y="28.0" width="300.0" height="46.0" rx="0" fill="#ffffff" stroke="#1f3864" stroke-width="1.4"/><text x="160.0" y="47.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">hold  (an ELF file, the Linux executable</text><text x="160.0" y="62.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">format; 16,176 bytes)</text><rect x="10.0" y="74.0" width="300.0" height="32.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="20.0" y="94.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="start" font-weight="700">code</text><text x="80.0" y="94.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="start">1,938 bytes</text><text x="210.0" y="94.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">(text)</text><rect x="10.0" y="106.0" width="300.0" height="32.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="20.0" y="126.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="start" font-weight="700">data</text><text x="80.0" y="126.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="start">636 bytes</text><text x="210.0" y="126.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">(initialized)</text><rect x="10.0" y="138.0" width="300.0" height="32.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="20.0" y="158.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="start" font-weight="700">bss</text><text x="80.0" y="158.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="start">4 bytes</text><text x="210.0" y="158.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">(zeroed)</text><rect x="10.0" y="170.0" width="300.0" height="46.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="160.0" y="190.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">+ headers, symbol table, the names</text><text x="160.0" y="203.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">of the libraries it needs</text><line x1="330.0" y1="120.0" x2="470.0" y2="120.0" stroke="#1f3864" stroke-width="2.4" marker-end="url(#ah1f3864)"/><text x="400.0" y="111.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">exec</text><text x="490.0" y="18.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">the process: its address space</text><rect x="490.0" y="28.0" width="400.0" height="44.0" rx="0" fill="#fbe9da" stroke="#9aa3b2" stroke-width="1"/><text x="690.0" y="54.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">stack: argc, argv, envp</text><rect x="490.0" y="72.0" width="400.0" height="44.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="690.0" y="98.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#7a8291" text-anchor="middle">free</text><rect x="490.0" y="116.0" width="400.0" height="44.0" rx="0" fill="#e3f1e4" stroke="#9aa3b2" stroke-width="1"/><text x="690.0" y="142.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">heap (empty; malloc will grow it)</text><rect x="490.0" y="160.0" width="400.0" height="44.0" rx="0" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1"/><text x="690.0" y="186.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">static data + bss (copied from the file)</text><rect x="490.0" y="204.0" width="400.0" height="44.0" rx="0" fill="#dbe5f3" stroke="#9aa3b2" stroke-width="1"/><text x="690.0" y="230.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">code (copied from the file)</text><rect x="490.0" y="254.0" width="400.0" height="30.0" rx="0" fill="#fbe9da" stroke="#9aa3b2" stroke-width="1"/><text x="690.0" y="273.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">registers: PC = main, SP = top of stack</text><rect x="490.0" y="290.0" width="400.0" height="30.0" rx="0" fill="#eef3fa" stroke="#9aa3b2" stroke-width="1"/><text x="690.0" y="309.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">open files: 0, 1, 2</text></svg>
