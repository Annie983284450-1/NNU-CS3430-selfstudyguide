<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 4 894 365" width="894" height="365" role="img"><title>The first week, first class: four programs on one CPU, two programs at one address, and what the OS is</title><defs></defs><rect x="3" y="4" width="894" height="365" fill="#ffffff"/><rect x="10.0" y="10.0" width="430.0" height="30.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="0"/><text x="225.0" y="29.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">1  FOUR PROGRAMS, ONE CPU</text><rect x="14.0" y="56.0" width="96.0" height="40.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="62.0" y="80.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">./cpu A</text><line x1="62.0" y1="96.0" x2="225.0" y2="140.0" stroke="#1f3864" stroke-width="1.4"/><rect x="120.0" y="56.0" width="96.0" height="40.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="168.0" y="80.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">./cpu B</text><line x1="168.0" y1="96.0" x2="225.0" y2="140.0" stroke="#1f3864" stroke-width="1.4"/><rect x="226.0" y="56.0" width="96.0" height="40.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="274.0" y="80.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">./cpu C</text><line x1="274.0" y1="96.0" x2="225.0" y2="140.0" stroke="#1f3864" stroke-width="1.4"/><rect x="332.0" y="56.0" width="96.0" height="40.0" rx="6" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="380.0" y="80.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">./cpu D</text><line x1="380.0" y1="96.0" x2="225.0" y2="140.0" stroke="#1f3864" stroke-width="1.4"/><rect x="10.0" y="140.0" width="430.0" height="34.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="225.0" y="161.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1 physical CPU, one instruction stream</text><text x="10.0" y="194.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">output: A B D C A B D C ... All four make progress; each believes it has the</text><text x="10.0" y="209.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">machine. One CPU looks like many: a virtual CPU for each.</text><rect x="460.0" y="10.0" width="430.0" height="30.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="0"/><text x="675.0" y="29.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">2  TWO PROGRAMS, ONE ADDRESS</text><rect x="470.0" y="56.0" width="196.0" height="64.0" rx="6" fill="#fbe9da" stroke="#b8560f" stroke-width="1.2"/><text x="568.0" y="77.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle">./mem  pid 24113</text><text x="568.0" y="92.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle">p = 0x200000</text><text x="568.0" y="107.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle">p: 1, 2, 3 ...</text><line x1="568.0" y1="120.0" x2="675.0" y2="140.0" stroke="#1f3864" stroke-width="1.4"/><rect x="686.0" y="56.0" width="196.0" height="64.0" rx="6" fill="#fbe9da" stroke="#b8560f" stroke-width="1.2"/><text x="784.0" y="77.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle">./mem  pid 24114</text><text x="784.0" y="92.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle">p = 0x200000</text><text x="784.0" y="107.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle">p: 1, 2, 3 ...</text><line x1="784.0" y1="120.0" x2="675.0" y2="140.0" stroke="#1f3864" stroke-width="1.4"/><rect x="460.0" y="140.0" width="430.0" height="34.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="675.0" y="161.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">one physical memory, two different real spots</text><text x="460.0" y="194.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">Same address, separate counts: 0x200000 is a name inside each process&#x27;s</text><text x="460.0" y="209.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">private map, not a real place. One memory looks like many.</text><rect x="10.0" y="250.0" width="300.0" height="30.0" rx="4" fill="#1e6b3a" stroke="#1e6b3a" stroke-width="0"/><text x="160.0" y="269.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">3  WHAT THE OS IS</text><rect x="10.0" y="292.0" width="284.0" height="70.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="152.0" y="314.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">illusionist</text><text x="152.0" y="332.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle">virtualizes the CPU and the memory</text><rect x="306.0" y="292.0" width="284.0" height="70.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="448.0" y="314.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">library</text><text x="448.0" y="332.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle">offers system calls: open, read, write, fork ...</text><rect x="602.0" y="292.0" width="284.0" height="70.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="744.0" y="314.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">referee</text><text x="744.0" y="332.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle">shares the machine and protects each program</text><text x="744.0" y="347.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle">from the others</text></svg>
