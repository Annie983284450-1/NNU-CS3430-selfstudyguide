<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 13 894 140" width="894" height="140" role="img"><title>wait() over time: the parent blocked until the child exits</title><defs><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect x="3" y="13" width="894" height="140" fill="#ffffff"/><rect x="10.0" y="20.0" width="100.0" height="40.0" rx="0" fill="#ffffff" stroke="#1f3864" stroke-width="1.2"/><text x="60.0" y="44.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">parent</text><rect x="10.0" y="76.0" width="100.0" height="40.0" rx="0" fill="#ffffff" stroke="#1f3864" stroke-width="1.2"/><text x="60.0" y="100.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">child</text><rect x="110.0" y="20.0" width="140.0" height="40.0" rx="0" fill="#e3f1e4" stroke="#9aa3b2" stroke-width="1"/><text x="180.0" y="44.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">running: fork</text><rect x="250.0" y="20.0" width="420.0" height="40.0" rx="0" fill="#f8e3e6" stroke="#9aa3b2" stroke-width="1"/><text x="460.0" y="44.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">BLOCKED in wait()</text><rect x="670.0" y="20.0" width="220.0" height="40.0" rx="0" fill="#e3f1e4" stroke="#9aa3b2" stroke-width="1"/><text x="780.0" y="44.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">running: printf</text><rect x="110.0" y="76.0" width="140.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><rect x="250.0" y="76.0" width="80.0" height="40.0" rx="0" fill="#fdf2d6" stroke="#9aa3b2" stroke-width="1"/><text x="290.0" y="100.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">READY</text><rect x="330.0" y="76.0" width="230.0" height="40.0" rx="0" fill="#e3f1e4" stroke="#9aa3b2" stroke-width="1"/><text x="445.0" y="100.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">running: printf, exit</text><rect x="560.0" y="76.0" width="110.0" height="40.0" rx="0" fill="#e9ebef" stroke="#9aa3b2" stroke-width="1"/><text x="615.0" y="100.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">ZOMBIE</text><rect x="670.0" y="76.0" width="220.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="780.0" y="100.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#7a8291" text-anchor="middle">slot freed</text><line x1="620.0" y1="74.0" x2="668.0" y2="62.0" stroke="#b23a48" stroke-width="1.6" marker-end="url(#ahb23a48)"/><text x="110.0" y="144.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">time →</text><text x="890.0" y="143.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#b23a48" text-anchor="end">the child&#x27;s exit wakes the parent; wait() collects the status and frees the slot</text></svg>
