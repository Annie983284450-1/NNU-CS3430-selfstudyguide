<svg xmlns="http://www.w3.org/2000/svg" viewBox="113 3 490 314" width="490" height="314" role="img"><title>The two CPU modes, and the two instructions that move between them</title><defs><marker id="ah2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="as2e7d32" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect x="113" y="3" width="490" height="314" fill="#ffffff"/><rect x="120.0" y="10.0" width="460.0" height="90.0" rx="12" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/><text x="140.0" y="42.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1f3864" text-anchor="start" font-weight="700">user mode</text><text x="140.0" y="62.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">your program runs here. Restricted: no device access, no other process&#x27;s</text><text x="140.0" y="77.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">memory, no privileged instructions.</text><rect x="120.0" y="220.0" width="460.0" height="90.0" rx="12" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.6"/><text x="140.0" y="252.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1f3864" text-anchor="start" font-weight="700">kernel mode</text><text x="140.0" y="272.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">the OS runs here. Unrestricted: it may touch any device, any memory, any</text><text x="140.0" y="287.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">privileged register.</text><line x1="220.0" y1="102.0" x2="220.0" y2="216.0" stroke="#b23a48" stroke-width="2.4" marker-end="url(#ahb23a48)"/><text x="210.0" y="154.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#b23a48" text-anchor="end" font-weight="700">trap</text><text x="210.0" y="172.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#b23a48" text-anchor="end" font-weight="700">(ecall)</text><line x1="480.0" y1="216.0" x2="480.0" y2="102.0" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#ah2e7d32)"/><text x="490.0" y="154.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="700">return-from-trap</text><text x="490.0" y="172.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#2e7d32" text-anchor="start" font-weight="700">(sret)</text></svg>
