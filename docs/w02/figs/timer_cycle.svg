<svg xmlns="http://www.w3.org/2000/svg" viewBox="13 13 534 234" width="534" height="234" role="img"><title>The timer cycle: tick, kernel runs, decide, program runs again</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect x="13" y="13" width="534" height="234" fill="#ffffff"/><rect x="20.0" y="20.0" width="190.0" height="70.0" rx="8" fill="#fdf2d6" stroke="#e8b23a" stroke-width="1.2"/><text x="115.0" y="60.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">hardware timer</text><rect x="350.0" y="20.0" width="190.0" height="70.0" rx="8" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="445.0" y="51.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">kernel runs</text><text x="445.0" y="68.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">(trap handler)</text><rect x="350.0" y="170.0" width="190.0" height="70.0" rx="8" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="445.0" y="201.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle">decide: same</text><text x="445.0" y="217.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle">process, or switch</text><rect x="20.0" y="170.0" width="190.0" height="70.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="115.0" y="201.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle">the program</text><text x="115.0" y="218.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle">(user mode)</text><line x1="212.0" y1="55.0" x2="346.0" y2="55.0" stroke="#1f3864" stroke-width="2" marker-end="url(#ah1f3864)"/><text x="279.0" y="50.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle">tick</text><line x1="445.0" y1="92.0" x2="445.0" y2="166.0" stroke="#1f3864" stroke-width="2" marker-end="url(#ah1f3864)"/><line x1="346.0" y1="205.0" x2="214.0" y2="205.0" stroke="#1f3864" stroke-width="2" marker-end="url(#ah1f3864)"/><text x="280.0" y="236.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle">return-from-trap</text><line x1="115.0" y1="166.0" x2="115.0" y2="94.0" stroke="#1f3864" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah1f3864)"/><text x="125.0" y="137.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">every few ms, no matter what</text></svg>
