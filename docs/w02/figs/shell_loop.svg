<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 13 894 247" width="894" height="247" role="img"><title>The shell is a loop of fork, exec and wait</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="ah7a8291" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8291"/></marker><marker id="as7a8291" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8291"/></marker></defs><rect x="3" y="13" width="894" height="247" fill="#ffffff"/><rect x="10.0" y="20.0" width="150.0" height="50.0" rx="6" fill="#ffffff" stroke="#1f3864" stroke-width="1.2"/><text x="85.0" y="41.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">read one line</text><text x="85.0" y="56.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">(prompt&gt; ls -l)</text><rect x="220.0" y="20.0" width="130.0" height="50.0" rx="6" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="285.0" y="49.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">fork()</text><rect x="520.0" y="20.0" width="130.0" height="50.0" rx="6" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="585.0" y="49.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">wait()</text><rect x="720.0" y="20.0" width="170.0" height="50.0" rx="6" fill="#ffffff" stroke="#1f3864" stroke-width="1.2"/><text x="805.0" y="49.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">print the next prompt</text><line x1="162.0" y1="45.0" x2="216.0" y2="45.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)"/><line x1="352.0" y1="45.0" x2="516.0" y2="45.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)"/><text x="434.0" y="37.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="middle">parent (rc = pid)</text><line x1="652.0" y1="45.0" x2="716.0" y2="45.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)"/><path d="M 805 72 L 805 240 L 85 240 L 85 74" stroke="#7a8291" stroke-width="1.4" fill="none" marker-end="url(#ah7a8291)" stroke-dasharray="5,4"/><text x="445.0" y="255.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7a8291" text-anchor="middle">back to: read one line</text><line x1="285.0" y1="72.0" x2="285.0" y2="110.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)"/><text x="295.0" y="95.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">child (rc == 0)</text><rect x="200.0" y="112.0" width="170.0" height="46.0" rx="6" fill="#fbe9da" stroke="#b8560f" stroke-width="1.2"/><text x="285.0" y="131.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">rearrange the world</text><text x="285.0" y="146.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle">(redirect, pipe)</text><line x1="285.0" y1="160.0" x2="285.0" y2="184.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)"/><rect x="210.0" y="186.0" width="150.0" height="40.0" rx="6" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="285.0" y="210.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">exec(&quot;ls&quot;, ...)</text><text x="380.0" y="209.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">ls runs, then exits; its exit ends the parent&#x27;s wait()</text></svg>
