<svg xmlns="http://www.w3.org/2000/svg" viewBox="13 13 734 167" width="734" height="167" role="img"><title>The processor&#x27;s loop: fetch, decode, execute, then the next instruction</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect x="13" y="13" width="734" height="167" fill="#ffffff"/><rect x="20.0" y="20.0" width="200.0" height="84.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.4"/><text x="120.0" y="47.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f3864" text-anchor="middle" font-weight="700">FETCH</text><rect x="20.0" y="56.0" width="200.0" height="44.0" rx="3" fill="#eef3fa" stroke="#eef3fa" stroke-width="1.2"/><text x="120.0" y="74.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">an instruction</text><text x="120.0" y="90.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">from memory</text><line x1="222.0" y1="62.0" x2="276.0" y2="62.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)"/><rect x="280.0" y="20.0" width="200.0" height="84.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.4"/><text x="380.0" y="47.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f3864" text-anchor="middle" font-weight="700">DECODE</text><rect x="280.0" y="56.0" width="200.0" height="44.0" rx="3" fill="#eef3fa" stroke="#eef3fa" stroke-width="1.2"/><text x="380.0" y="74.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">figure out which</text><text x="380.0" y="90.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">instruction it is</text><line x1="482.0" y1="62.0" x2="536.0" y2="62.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)"/><rect x="540.0" y="20.0" width="200.0" height="84.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.4"/><text x="640.0" y="47.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f3864" text-anchor="middle" font-weight="700">EXECUTE</text><rect x="540.0" y="56.0" width="200.0" height="44.0" rx="3" fill="#eef3fa" stroke="#eef3fa" stroke-width="1.2"/><text x="640.0" y="74.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">add, load, store,</text><text x="640.0" y="90.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">jump ...</text><path d="M 640 106 L 640 140 L 120 140 L 120 108" stroke="#1f3864" stroke-width="1.8" fill="none" marker-end="url(#ah1f3864)"/><text x="380.0" y="170.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6675" text-anchor="middle" font-style="italic">... then move to the next instruction, until the program completes (the Von Neumann model)</text></svg>
