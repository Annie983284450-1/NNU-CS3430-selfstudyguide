<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 13 994 174" width="994" height="174" role="img"><title>A name, a number, the bytes: the three pieces of a file on disk</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect x="3" y="13" width="994" height="174" fill="#ffffff"/><rect x="10.0" y="20.0" width="260.0" height="120.0" rx="0" fill="#ffffff" stroke="#1f3864" stroke-width="1.4"/><text x="140.0" y="67.4" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1b2430" text-anchor="middle">directory /tmp</text><text x="140.0" y="84.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1b2430" text-anchor="middle">...</text><text x="140.0" y="102.4" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1b2430" text-anchor="middle">file  →  372</text><rect x="330.0" y="20.0" width="330.0" height="120.0" rx="0" fill="#eef3fa" stroke="#1f3864" stroke-width="1.4"/><text x="495.0" y="58.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1b2430" text-anchor="middle">inode 372</text><text x="495.0" y="76.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1b2430" text-anchor="middle">size 13 · 1 link · owner</text><text x="495.0" y="93.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1b2430" text-anchor="middle">times · permissions</text><text x="495.0" y="111.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1b2430" text-anchor="middle">block list  →</text><rect x="720.0" y="20.0" width="270.0" height="120.0" rx="0" fill="#fdf2d6" stroke="#e8b23a" stroke-width="1.4"/><text x="855.0" y="67.4" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1b2430" text-anchor="middle">data block, 4096 bytes</text><text x="855.0" y="84.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1b2430" text-anchor="middle">hello world\n\0</text><text x="855.0" y="102.4" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1b2430" text-anchor="middle">4083 bytes unused</text><line x1="272.0" y1="80.0" x2="326.0" y2="80.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)"/><line x1="662.0" y1="80.0" x2="716.0" y2="80.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)"/><text x="10.0" y="177.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="start" font-weight="700">a name  →  a number  →  the bytes.   The name and the bytes are kept in different places on the disk.</text></svg>
