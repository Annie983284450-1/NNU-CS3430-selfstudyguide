<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 984 416" width="984" height="416" role="img"><title>What one write call sets in motion</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect x="3" y="3" width="984" height="416" fill="#ffffff"/><rect x="10.0" y="10.0" width="740.0" height="50.0" rx="2" fill="#ffffff" stroke="#1f3864" stroke-width="1.4"/><text x="380.0" y="39.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">your program:    write(3, &quot;hello world\n&quot;, 13)</text><line x1="10.0" y1="84.0" x2="760.0" y2="84.0" stroke="#1f3864" stroke-width="1.2" stroke-dasharray="6 4"/><text x="10.0" y="77.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">user space</text><text x="10.0" y="99.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">kernel</text><text x="420.0" y="77.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">system call: the CPU switches into the kernel</text><line x1="380.0" y1="62.0" x2="380.0" y2="108.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><rect x="10.0" y="112.0" width="740.0" height="48.0" rx="2" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="380.0" y="140.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b2430" text-anchor="middle">file descriptor table of this process:   3  →  open file  →  inode 372 (/tmp/file)</text><line x1="380.0" y1="162.0" x2="380.0" y2="182.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><rect x="10.0" y="186.0" width="740.0" height="64.0" rx="2" fill="#fdf2d6" stroke="#e8b23a" stroke-width="1.6"/><text x="380.0" y="214.4" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b2430" text-anchor="middle" font-weight="700">page cache, in RAM:  the 4096-byte page 0 of inode 372</text><text x="380.0" y="230.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b2430" text-anchor="middle" font-weight="700">13 bytes copied in, page marked DIRTY</text><rect x="820.0" y="192.0" width="160.0" height="52.0" rx="6" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="900.0" y="214.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">write() returns</text><text x="900.0" y="230.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">13 here</text><line x1="816.0" y1="218.0" x2="754.0" y2="218.0" stroke="#b23a48" stroke-width="1.6" marker-end="url(#ahb23a48)"/><line x1="380.0" y1="252.0" x2="380.0" y2="278.0" stroke="#1f3864" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah1f3864)"/><rect x="10.0" y="282.0" width="740.0" height="46.0" rx="3" fill="#ffffff" stroke="#d9dde4" stroke-width="1.2"/><text x="380.0" y="309.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle">writeback, later: within 30 s on Linux, or when the program calls fsync</text><line x1="380.0" y1="330.0" x2="380.0" y2="356.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><rect x="10.0" y="360.0" width="740.0" height="52.0" rx="2" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="380.0" y="390.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b2430" text-anchor="middle" font-weight="700">disk driver  →  SSD:  one 4096-byte block</text></svg>
