<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 13 754 144" width="754" height="144" role="img"><title>Dirty pages in RAM drain to the SSD later, or on sync or fsync</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect x="3" y="13" width="754" height="144" fill="#ffffff"/><rect x="10.0" y="20.0" width="300.0" height="130.0" rx="2" fill="#fdf2d6" stroke="#e8b23a" stroke-width="1.4"/><text x="160.0" y="71.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="middle" font-weight="700">RAM: page cache</text><text x="160.0" y="90.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="middle" font-weight="700">dirty pages: 200 MB</text><text x="160.0" y="109.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="middle" font-weight="700">written, not yet on disk</text><rect x="480.0" y="20.0" width="270.0" height="130.0" rx="2" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.4"/><text x="615.0" y="80.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1b2430" text-anchor="middle" font-weight="700">SSD</text><text x="615.0" y="100.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1b2430" text-anchor="middle" font-weight="700">durable</text><line x1="312.0" y1="110.0" x2="476.0" y2="110.0" stroke="#1f3864" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#ah1f3864)"/><text x="394.0" y="48.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6675" text-anchor="middle" font-weight="700">writeback</text><text x="394.0" y="70.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6675" text-anchor="middle" font-weight="700">≤ 30 s, or sync / fsync</text></svg>
