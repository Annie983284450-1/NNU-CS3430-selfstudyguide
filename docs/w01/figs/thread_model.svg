<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 994 444" width="994" height="444" role="img"><title>One process after two Pthread_create calls: what the threads share, what each has to itself</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect x="3" y="3" width="994" height="444" fill="#ffffff"/><rect x="10.0" y="10.0" width="680.0" height="330.0" rx="22" fill="#eef3fa" stroke="#1f3864" stroke-width="1.6"/><text x="30.0" y="42.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1f3864" text-anchor="start" font-weight="700">one process = one address space, shared by every thread inside it</text><text x="30.0" y="70.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6675" text-anchor="start" font-weight="700">shared by all threads</text><text x="360.0" y="70.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6675" text-anchor="start" font-weight="700">private to each thread</text><rect x="30.0" y="84.0" width="270.0" height="42.0" rx="0" fill="#ffffff" stroke="#d9dde4" stroke-width="1"/><text x="165.0" y="109.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1b2430" text-anchor="middle">code:  worker(),  main()</text><rect x="30.0" y="136.0" width="270.0" height="56.0" rx="0" fill="#fdf2d6" stroke="#e8b23a" stroke-width="1.6"/><text x="165.0" y="160.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1b2430" text-anchor="middle" font-weight="700">globals:</text><text x="165.0" y="177.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1b2430" text-anchor="middle" font-weight="700">counter = 0  ·  loops</text><rect x="30.0" y="202.0" width="270.0" height="42.0" rx="0" fill="#ffffff" stroke="#d9dde4" stroke-width="1"/><text x="165.0" y="227.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1b2430" text-anchor="middle">heap  (malloc)</text><rect x="30.0" y="254.0" width="270.0" height="42.0" rx="0" fill="#ffffff" stroke="#d9dde4" stroke-width="1"/><text x="165.0" y="279.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1b2430" text-anchor="middle">open files, pid, ...</text><rect x="360.0" y="84.0" width="310.0" height="54.0" rx="3" fill="#ffffff" stroke="#d9dde4" stroke-width="1.2"/><text x="515.0" y="107.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6675" text-anchor="middle">main thread</text><text x="515.0" y="123.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6675" text-anchor="middle">PC · registers · stack   (waiting in join)</text><rect x="360.0" y="150.0" width="310.0" height="54.0" rx="3" fill="#ffffff" stroke="#1f3864" stroke-width="1.2"/><text x="515.0" y="173.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">thread p1  →  worker()</text><text x="515.0" y="189.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">own PC · own registers · own stack</text><rect x="360.0" y="214.0" width="310.0" height="54.0" rx="3" fill="#ffffff" stroke="#1f3864" stroke-width="1.2"/><text x="515.0" y="237.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">thread p2  →  worker()</text><text x="515.0" y="253.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">own PC · own registers · own stack</text><line x1="358.0" y1="176.0" x2="304.0" y2="160.0" stroke="#b23a48" stroke-width="1.8" marker-end="url(#ahb23a48)"/><line x1="358.0" y1="240.0" x2="304.0" y2="172.0" stroke="#b23a48" stroke-width="1.8" marker-end="url(#ahb23a48)"/><text x="30.0" y="318.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start" font-weight="700">both red arrows end at the same address:</text><text x="30.0" y="335.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start" font-weight="700">counter</text><rect x="10.0" y="356.0" width="680.0" height="84.0" rx="10" fill="#ffffff" stroke="#1f3864" stroke-width="1.2"/><text x="30.0" y="384.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">the OS scheduler puts each runnable thread on a free</text><text x="30.0" y="399.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">core; main is not runnable (waiting)</text><rect x="370.0" y="372.0" width="140.0" height="52.0" rx="2" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="440.0" y="394.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">core 0</text><text x="440.0" y="410.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">runs p1</text><rect x="530.0" y="372.0" width="140.0" height="52.0" rx="2" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="600.0" y="394.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">core 1</text><text x="600.0" y="410.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">runs p2</text><line x1="440.0" y1="270.0" x2="440.0" y2="370.0" stroke="#1f3864" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#ah1f3864)"/><line x1="600.0" y1="270.0" x2="600.0" y2="370.0" stroke="#1f3864" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#ah1f3864)"/><rect x="710.0" y="10.0" width="280.0" height="100.0" rx="10" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="724.0" y="37.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f3864" text-anchor="start" font-weight="700">A process</text><text x="724.0" y="60.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">an address space plus at least one thread.</text><rect x="710.0" y="120.0" width="280.0" height="100.0" rx="10" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="724.0" y="147.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f3864" text-anchor="start" font-weight="700">A thread</text><text x="724.0" y="170.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">a program counter, registers and a stack.</text><text x="724.0" y="187.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">Nothing else; everything else is shared with</text><text x="724.0" y="204.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">its siblings.</text><rect x="710.0" y="230.0" width="280.0" height="100.0" rx="10" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="724.0" y="257.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f3864" text-anchor="start" font-weight="700">Pthread_create</text><text x="724.0" y="280.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">one more thread in this process, starting at</text><text x="724.0" y="297.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">worker().</text><rect x="710.0" y="344.0" width="280.0" height="96.0" rx="10" fill="#fdf2d6" stroke="#e8b23a" stroke-width="1.2"/><text x="724.0" y="372.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">On the arm64 Mac of these runs, the two</text><text x="724.0" y="389.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">workers run at the same instant, on two</text><text x="724.0" y="406.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">cores.</text></svg>
