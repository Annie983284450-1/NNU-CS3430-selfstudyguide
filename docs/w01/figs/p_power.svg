<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 4 974 235" width="974" height="235" role="img"><title>Fast memories are volatile, the disk remembers but is slow, and a counter in RAM vanishes at power off</title><defs><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect x="3" y="4" width="974" height="235" fill="#ffffff"/><rect x="10.0" y="10.0" width="200.0" height="32.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="0"/><text x="110.0" y="30.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">WHAT WE HAVE</text><text x="10.0" y="64.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">everything so far lived in volatile memory</text><rect x="10.0" y="78.0" width="130.0" height="50.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="75.0" y="99.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">registers</text><text x="75.0" y="114.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">0.3 ns</text><rect x="160.0" y="78.0" width="130.0" height="50.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="225.0" y="99.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">cache</text><text x="225.0" y="114.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">1 to 10 ns</text><rect x="310.0" y="78.0" width="130.0" height="50.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="375.0" y="99.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">DRAM</text><text x="375.0" y="114.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">about 100 ns</text><text x="10.0" y="150.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">fast, and all three forget everything when the power goes</text><rect x="10.0" y="166.0" width="130.0" height="48.0" rx="6" fill="#fbe9da" stroke="#b8560f" stroke-width="1.2"/><text x="75.0" y="186.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b8560f" text-anchor="middle" font-weight="700">SSD</text><text x="75.0" y="201.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b8560f" text-anchor="middle" font-weight="700">about 100 µs</text><text x="156.0" y="184.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">the disk remembers, and it is about 1000 times slower</text><text x="156.0" y="199.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">than DRAM</text><rect x="520.0" y="10.0" width="200.0" height="32.0" rx="4" fill="#b23a48" stroke="#b23a48" stroke-width="0"/><text x="620.0" y="30.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">WHERE IT BREAKS</text><text x="520.0" y="64.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start" font-weight="700">a counter in RAM, then the power cord is pulled</text><rect x="520.0" y="78.0" width="170.0" height="50.0" rx="4" fill="#fdf2d6" stroke="#e8b23a" stroke-width="1.4"/><text x="605.0" y="99.4" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">RAM</text><text x="605.0" y="115.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">p: 7</text><line x1="692.0" y1="103.0" x2="816.0" y2="103.0" stroke="#b23a48" stroke-width="1.8" marker-end="url(#ahb23a48)"/><rect x="820.0" y="78.0" width="150.0" height="50.0" rx="4" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="895.0" y="107.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">power off</text><rect x="520.0" y="146.0" width="170.0" height="50.0" rx="4" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="605.0" y="167.4" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#7a8291" text-anchor="middle" font-weight="700">RAM</text><text x="605.0" y="183.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#7a8291" text-anchor="middle" font-weight="700">?</text><text x="706.0" y="160.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">the mem.c counter, the threads counter, every</text><text x="706.0" y="175.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">variable of every program: gone</text><text x="520.0" y="215.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1b2430" text-anchor="start">and writing to the disk costs about 1000 times a memory write, so every write cannot simply</text><text x="520.0" y="230.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1b2430" text-anchor="start">go straight to the disk</text></svg>
