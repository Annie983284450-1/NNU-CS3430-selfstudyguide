<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 747 294" width="747" height="294" role="img"><title>Where the kernel sits: programs in user space, the kernel with full privilege, the hardware below</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect x="3" y="3" width="747" height="294" fill="#ffffff"/><rect x="10.0" y="10.0" width="560.0" height="56.0" rx="6" fill="#ffffff" stroke="#1f3864" stroke-width="1.6"/><text x="290.0" y="43.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="middle">your programs: shell, editor, browser, the demos of this guide</text><rect x="10.0" y="126.0" width="560.0" height="66.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.6"/><text x="290.0" y="155.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle">operating system (kernel)</text><text x="290.0" y="172.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle">virtualizes CPU + memory · system calls · manages resources</text><rect x="10.0" y="236.0" width="560.0" height="54.0" rx="6" fill="#ffffff" stroke="#1f3864" stroke-width="1.6"/><text x="290.0" y="268.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="middle">hardware: CPU · memory (DRAM) · disk · network</text><line x1="170.0" y1="68.0" x2="170.0" y2="122.0" stroke="#1f3864" stroke-width="2" marker-end="url(#ah1f3864)"/><text x="182.0" y="100.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start">system call</text><line x1="400.0" y1="122.0" x2="400.0" y2="70.0" stroke="#1f3864" stroke-width="2" marker-end="url(#ah1f3864)"/><text x="412.0" y="100.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start">return</text><line x1="290.0" y1="194.0" x2="290.0" y2="232.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)" marker-start="url(#as1f3864)"/><text x="600.0" y="43.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#5b6675" text-anchor="start" font-style="italic">user space</text><text x="600.0" y="155.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#5b6675" text-anchor="start" font-style="italic">kernel space</text><text x="600.0" y="176.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6675" text-anchor="start" font-style="italic">(full hardware privilege)</text></svg>
