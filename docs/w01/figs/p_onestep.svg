<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 4 881 205" width="881" height="205" role="img"><title>counter++ is three instructions with open gaps, and the same bug at three loop counts</title><defs></defs><rect x="3" y="4" width="881" height="205" fill="#ffffff"/><rect x="10.0" y="10.0" width="200.0" height="32.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="0"/><text x="110.0" y="30.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">WHAT WE HAVE</text><text x="10.0" y="64.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">counter++ is three instructions, and the gaps are open</text><rect x="10.0" y="80.0" width="110.0" height="44.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="65.0" y="106.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">load</text><text x="145.0" y="144.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">gap</text><rect x="170.0" y="80.0" width="110.0" height="44.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="225.0" y="106.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">add</text><text x="305.0" y="144.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">gap</text><rect x="330.0" y="80.0" width="110.0" height="44.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="385.0" y="106.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">store</text><text x="10.0" y="176.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">in either gap the other thread can load the old value; two increments, the counter</text><text x="10.0" y="191.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">grows by one</text><rect x="520.0" y="10.0" width="200.0" height="32.0" rx="4" fill="#b23a48" stroke="#b23a48" stroke-width="0"/><text x="620.0" y="30.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">WHERE IT BREAKS</text><text x="520.0" y="64.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start" font-weight="700">the same bug, three loop counts</text><rect x="520.0" y="76.0" width="120.0" height="28.0" rx="4" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="580.0" y="94.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="700">1000</text><text x="656.0" y="94.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">right every time</text><rect x="520.0" y="112.0" width="120.0" height="28.0" rx="4" fill="#fbe9da" stroke="#b8560f" stroke-width="1.2"/><text x="580.0" y="130.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#b8560f" text-anchor="middle" font-weight="700">10000</text><text x="656.0" y="130.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">right once in 20 runs</text><rect x="520.0" y="148.0" width="120.0" height="28.0" rx="4" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="580.0" y="166.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">100000</text><text x="656.0" y="166.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start">never right: 103,902</text><text x="520.0" y="200.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">a test that passes proves only that this timing did not trigger the bug</text></svg>
