<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 17 963 127" width="963" height="127" role="img"><title>A timeline of operating systems: invented, forgotten by the PC, relearned</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect x="14" y="17" width="963" height="127" fill="#ffffff"/><line x1="20.0" y1="60.0" x2="970.0" y2="60.0" stroke="#1f3864" stroke-width="2" marker-end="url(#ah1f3864)"/><text x="100.0" y="35.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f3864" text-anchor="middle" font-weight="700">1950s</text><circle cx="100.0" cy="60.0" r="8" fill="#1f3864" stroke="#1f3864" stroke-width="1.4"/><text x="100.0" y="96.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle" font-weight="700">just libraries</text><text x="100.0" y="115.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">batch jobs,</text><text x="100.0" y="134.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">human operators</text><text x="295.0" y="35.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f3864" text-anchor="middle" font-weight="700">1960s</text><circle cx="295.0" cy="60.0" r="8" fill="#1f3864" stroke="#1f3864" stroke-width="1.4"/><text x="295.0" y="96.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle" font-weight="700">protection</text><text x="295.0" y="115.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">system calls (Atlas),</text><text x="295.0" y="134.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">user vs. kernel mode</text><text x="490.0" y="35.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f3864" text-anchor="middle" font-weight="700">late 1960s–70s</text><circle cx="490.0" cy="60.0" r="8" fill="#1f3864" stroke="#1f3864" stroke-width="1.4"/><text x="490.0" y="96.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle" font-weight="700">multiprogramming</text><text x="490.0" y="115.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">minicomputers; Unix</text><text x="490.0" y="134.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">at Bell Labs</text><text x="685.0" y="35.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f3864" text-anchor="middle" font-weight="700">1980s</text><circle cx="685.0" cy="60.0" r="8" fill="#1f3864" stroke="#1f3864" stroke-width="1.4"/><text x="685.0" y="96.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle" font-weight="700">the PC</text><text x="685.0" y="115.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">DOS and early Mac OS</text><text x="685.0" y="134.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">forgot the lessons</text><text x="880.0" y="35.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f3864" text-anchor="middle" font-weight="700">1990s →</text><circle cx="880.0" cy="60.0" r="8" fill="#1f3864" stroke="#1f3864" stroke-width="1.4"/><text x="880.0" y="96.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle" font-weight="700">relearned them</text><text x="880.0" y="115.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">Linux, Windows NT,</text><text x="880.0" y="134.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">macOS: Unix wins</text></svg>
