<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 4 968 221" width="968" height="221" role="img"><title>One process, two threads, one counter; expected 200000, printed 103902</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect x="3" y="4" width="968" height="221" fill="#ffffff"/><rect x="10.0" y="10.0" width="200.0" height="32.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="0"/><text x="110.0" y="30.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">WHAT WE HAVE</text><text x="10.0" y="64.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">one process, two threads, one counter</text><rect x="10.0" y="80.0" width="160.0" height="46.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="90.0" y="99.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">thread A</text><text x="90.0" y="114.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">worker()</text><rect x="290.0" y="80.0" width="160.0" height="46.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="370.0" y="99.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">thread B</text><text x="370.0" y="114.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">worker()</text><rect x="150.0" y="150.0" width="160.0" height="40.0" rx="2" fill="#fdf2d6" stroke="#e8b23a" stroke-width="1.6"/><text x="230.0" y="174.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">counter</text><line x1="90.0" y1="128.0" x2="196.0" y2="148.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)"/><line x1="370.0" y1="128.0" x2="264.0" y2="148.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)"/><text x="10.0" y="216.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">each thread runs counter++ loops times; both arrows end at the same byte, on purpose</text><rect x="520.0" y="10.0" width="200.0" height="32.0" rx="4" fill="#b23a48" stroke="#b23a48" stroke-width="0"/><text x="620.0" y="30.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">WHERE IT BREAKS</text><text x="520.0" y="64.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#b23a48" text-anchor="start" font-weight="700">./threads 100000    (two threads, 100,000 each)</text><rect x="520.0" y="80.0" width="200.0" height="64.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="620.0" y="107.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="700">expected</text><text x="620.0" y="126.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="700">200000</text><rect x="760.0" y="80.0" width="200.0" height="64.0" rx="8" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="860.0" y="107.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#b23a48" text-anchor="middle" font-weight="700">printed</text><text x="860.0" y="126.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#b23a48" text-anchor="middle" font-weight="700">103902</text><text x="520.0" y="174.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">about half of all the additions vanished; the next run prints a different wrong number;</text><text x="520.0" y="189.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">at 1000 loops the answer is always right</text></svg>
