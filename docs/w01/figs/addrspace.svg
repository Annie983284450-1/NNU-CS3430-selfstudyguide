<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 8 984 322" width="984" height="322" role="img"><title>Two private address spaces, each with an int at 0x200000, mapped to two places in physical memory</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect x="3" y="8" width="984" height="322" fill="#ffffff"/><text x="10.0" y="24.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">process A  (pid 24113)</text><rect x="10.0" y="36.0" width="360.0" height="110.0" rx="4" fill="#ffffff" stroke="#1f3864" stroke-width="1.4"/><rect x="90.0" y="70.0" width="180.0" height="40.0" rx="4" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="180.0" y="94.5" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b2430" text-anchor="middle">0x200000</text><text x="190.0" y="138.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle" font-style="italic">virtual memory of process A</text><rect x="760.0" y="70.0" width="200.0" height="40.0" rx="4" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="860.0" y="94.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1b2430" text-anchor="middle">A&#x27;s int  @ 0x51a000</text><line x1="272.0" y1="90.0" x2="756.0" y2="90.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><text x="10.0" y="184.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">process B  (pid 24114)</text><rect x="10.0" y="196.0" width="360.0" height="110.0" rx="4" fill="#ffffff" stroke="#1f3864" stroke-width="1.4"/><rect x="90.0" y="230.0" width="180.0" height="40.0" rx="4" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="180.0" y="254.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b2430" text-anchor="middle">0x200000</text><text x="190.0" y="298.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle" font-style="italic">virtual memory of process B</text><rect x="760.0" y="230.0" width="200.0" height="40.0" rx="4" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="860.0" y="254.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1b2430" text-anchor="middle">B&#x27;s int  @ 0x77c000</text><line x1="272.0" y1="250.0" x2="756.0" y2="250.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><rect x="740.0" y="36.0" width="240.0" height="270.0" rx="4" fill="none" stroke="#1f3864" stroke-width="1.6"/><text x="860.0" y="324.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle" font-style="italic">physical memory (DRAM)</text><text x="510.0" y="144.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle" font-style="italic">the OS&#x27;s mapping</text></svg>
