<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 4 984 231" width="984" height="231" role="img"><title>One physical memory in which an address names one byte, and two programs at the same address</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect x="3" y="4" width="984" height="231" fill="#ffffff"/><rect x="10.0" y="10.0" width="200.0" height="32.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="0"/><text x="110.0" y="30.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">WHAT WE HAVE</text><text x="10.0" y="64.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">one physical memory; an address names one byte in it</text><rect x="10.0" y="80.0" width="56.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><rect x="66.0" y="80.0" width="56.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><rect x="122.0" y="80.0" width="56.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><rect x="178.0" y="80.0" width="56.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><rect x="234.0" y="80.0" width="56.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><rect x="290.0" y="80.0" width="56.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><rect x="346.0" y="80.0" width="56.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><rect x="402.0" y="80.0" width="56.0" height="40.0" rx="0" fill="#ffffff" stroke="#9aa3b2" stroke-width="1"/><text x="10.0" y="137.8" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#7a8291" text-anchor="start">byte 0</text><text x="458.0" y="137.8" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#7a8291" text-anchor="end">byte 7.8 GiB</text><rect x="80.0" y="166.0" width="200.0" height="36.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="180.0" y="188.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">program: *p = *p + 1</text><line x1="180.0" y1="164.0" x2="206.0" y2="124.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)"/><text x="10.0" y="226.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">the store lands in the byte the address names, whoever else is using that byte</text><rect x="520.0" y="10.0" width="200.0" height="32.0" rx="4" fill="#b23a48" stroke="#b23a48" stroke-width="0"/><text x="620.0" y="30.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">WHERE IT BREAKS</text><text x="520.0" y="64.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#b23a48" text-anchor="start" font-weight="700">./mem &amp; ./mem &amp;    both say: address of p is 0x200000</text><rect x="520.0" y="80.0" width="200.0" height="46.0" rx="6" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="620.0" y="99.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#b23a48" text-anchor="middle" font-weight="700">process 24113</text><text x="620.0" y="114.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#b23a48" text-anchor="middle" font-weight="700">*p = *p + 1</text><rect x="780.0" y="80.0" width="200.0" height="46.0" rx="6" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="880.0" y="99.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#b23a48" text-anchor="middle" font-weight="700">process 24114</text><text x="880.0" y="114.7" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#b23a48" text-anchor="middle" font-weight="700">*p = *p + 1</text><rect x="690.0" y="150.0" width="120.0" height="34.0" rx="2" fill="#fdf2d6" stroke="#e8b23a" stroke-width="1.6"/><text x="750.0" y="171.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b2430" text-anchor="middle" font-weight="700">0x200000</text><line x1="620.0" y1="128.0" x2="716.0" y2="148.0" stroke="#b23a48" stroke-width="1.4" marker-end="url(#ahb23a48)"/><line x1="880.0" y1="128.0" x2="784.0" y2="148.0" stroke="#b23a48" stroke-width="1.4" marker-end="url(#ahb23a48)"/><text x="520.0" y="210.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">if 0x200000 were one real byte, the two counters would be one counter, and a bug in</text><text x="520.0" y="225.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">either program would corrupt the other</text></svg>
