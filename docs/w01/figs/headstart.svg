<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2 994 418" width="994" height="418" role="img"><title>The head start: at 1000 loops A finishes before B exists; at 100000 the loops overlap</title><defs><marker id="ah5b6675" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="as5b6675" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs><rect x="3" y="2" width="994" height="418" fill="#ffffff"/><text x="10.0" y="18.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">Creating the second thread takes tens of microseconds. That head start decides whether the two loops ever overlap.</text><rect x="10.0" y="36.0" width="980.0" height="170.0" rx="14" fill="#ffffff" stroke="#1f3864" stroke-width="1.4"/><text x="30.0" y="63.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="start" font-weight="700">loops = 1000</text><text x="30.0" y="107.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start" font-weight="700">thread A</text><rect x="170.0" y="88.0" width="66.0" height="32.0" rx="3" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="203.0" y="108.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">loop</text><text x="30.0" y="153.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start" font-weight="700">thread B</text><rect x="170.0" y="134.0" width="110.0" height="32.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="225.0" y="154.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle">being created</text><rect x="282.0" y="134.0" width="66.0" height="32.0" rx="3" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="315.0" y="154.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">loop</text><line x1="170.0" y1="182.0" x2="770.0" y2="182.0" stroke="#5b6675" stroke-width="1.2" marker-end="url(#ah5b6675)"/><text x="170.0" y="200.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">time →</text><rect x="830.0" y="86.0" width="140.0" height="70.0" rx="10" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="900.0" y="116.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="middle" font-weight="700">2000</text><text x="900.0" y="135.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="middle" font-weight="700">correct</text><text x="360.0" y="153.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="start" font-weight="700">A already finished before B existed. No overlap.</text><rect x="10.0" y="226.0" width="980.0" height="170.0" rx="14" fill="#ffffff" stroke="#1f3864" stroke-width="1.4"/><text x="30.0" y="253.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="start" font-weight="700">loops = 100000</text><text x="30.0" y="297.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start" font-weight="700">thread A</text><rect x="170.0" y="278.0" width="520.0" height="32.0" rx="3" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="430.0" y="298.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">runs its loop</text><text x="30.0" y="343.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start" font-weight="700">thread B</text><rect x="170.0" y="324.0" width="110.0" height="32.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="225.0" y="344.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle">being created</text><rect x="282.0" y="324.0" width="520.0" height="32.0" rx="3" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="542.0" y="344.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">runs its loop</text><line x1="170.0" y1="372.0" x2="770.0" y2="372.0" stroke="#5b6675" stroke-width="1.2" marker-end="url(#ah5b6675)"/><text x="170.0" y="390.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="start">time →</text><rect x="830.0" y="276.0" width="140.0" height="70.0" rx="10" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="900.0" y="306.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="middle" font-weight="700">≈ 100000</text><text x="900.0" y="325.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="middle" font-weight="700">wrong</text><rect x="282.0" y="270.0" width="408.0" height="84.0" rx="2" fill="none" stroke="#b23a48" stroke-width="2.2"/><text x="290.0" y="252.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b23a48" text-anchor="start" font-weight="700">the overlap: both cores hitting the same counter, increments lost</text><text x="10.0" y="414.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">The bug is in the program in both runs. Only the second run gave it a chance to show.</text></svg>
