<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 4 974 213" width="974" height="213" role="img"><title>One program on one CPU, then four copies each wanting the whole CPU</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect x="3" y="4" width="974" height="213" fill="#ffffff"/><rect x="10.0" y="10.0" width="200.0" height="32.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="0"/><text x="110.0" y="30.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">WHAT WE HAVE</text><text x="10.0" y="64.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">one program on one CPU: ./cpu A prints A once a second</text><rect x="10.0" y="90.0" width="170.0" height="50.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="95.0" y="119.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">./cpu A</text><line x1="182.0" y1="115.0" x2="256.0" y2="115.0" stroke="#1f3864" stroke-width="1.8" marker-end="url(#ah1f3864)"/><rect x="260.0" y="90.0" width="130.0" height="50.0" rx="6" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="325.0" y="119.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">CPU</text><text x="10.0" y="172.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">Spin(1) burns one second of CPU, then printf. The program never waits for</text><text x="10.0" y="187.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">anything: it wants the CPU 100% of the time.</text><rect x="520.0" y="10.0" width="200.0" height="32.0" rx="4" fill="#b23a48" stroke="#b23a48" stroke-width="0"/><text x="620.0" y="30.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">WHERE IT BREAKS</text><text x="520.0" y="64.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#b23a48" text-anchor="start" font-weight="700">./cpu A &amp; ./cpu B &amp; ./cpu C &amp; ./cpu D &amp;   on one CPU</text><rect x="520.0" y="80.0" width="96.0" height="40.0" rx="6" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="568.0" y="105.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b23a48" text-anchor="middle" font-weight="700">A</text><line x1="568.0" y1="122.0" x2="750.0" y2="170.0" stroke="#b23a48" stroke-width="1.2" marker-end="url(#ahb23a48)"/><rect x="638.0" y="80.0" width="96.0" height="40.0" rx="6" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="686.0" y="105.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b23a48" text-anchor="middle" font-weight="700">B</text><line x1="686.0" y1="122.0" x2="750.0" y2="170.0" stroke="#b23a48" stroke-width="1.2" marker-end="url(#ahb23a48)"/><rect x="756.0" y="80.0" width="96.0" height="40.0" rx="6" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="804.0" y="105.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b23a48" text-anchor="middle" font-weight="700">C</text><line x1="804.0" y1="122.0" x2="750.0" y2="170.0" stroke="#b23a48" stroke-width="1.2" marker-end="url(#ahb23a48)"/><rect x="874.0" y="80.0" width="96.0" height="40.0" rx="6" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="922.0" y="105.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b23a48" text-anchor="middle" font-weight="700">D</text><line x1="922.0" y1="122.0" x2="750.0" y2="170.0" stroke="#b23a48" stroke-width="1.2" marker-end="url(#ahb23a48)"/><rect x="690.0" y="172.0" width="120.0" height="38.0" rx="6" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="750.0" y="195.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">1 CPU</text><text x="830.0" y="190.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">four infinite loops,</text><text x="830.0" y="206.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">each wanting 100%</text></svg>
