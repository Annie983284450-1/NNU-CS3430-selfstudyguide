<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 5 1094 388" width="1094" height="388" role="img"><title>The production line of Unix and the teaching line where xv6 lives</title><defs><marker id="ah5b6675" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="as5b6675" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="ahb8560f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8560f"/></marker><marker id="asb8560f" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8560f"/></marker></defs><rect x="3" y="5" width="1094" height="388" fill="#ffffff"/><text x="10.0" y="20.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6675" text-anchor="start" font-weight="700">THE PRODUCTION LINE</text><rect x="10.0" y="60.0" width="170.0" height="60.0" rx="4" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="20.0" y="82.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start" font-weight="700">1969  UNIX</text><text x="20.0" y="101.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">Bell Labs, Thompson &amp; Ritchie</text><rect x="220.0" y="50.0" width="190.0" height="80.0" rx="4" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="230.0" y="72.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start" font-weight="700">1975  Sixth Edition (v6)</text><text x="230.0" y="91.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">spreads to universities</text><text x="230.0" y="106.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">antitrust bars AT&amp;T from</text><text x="230.0" y="121.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">selling it</text><rect x="460.0" y="16.0" width="210.0" height="56.0" rx="4" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="470.0" y="38.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start" font-weight="700">1977  BSD</text><text x="470.0" y="57.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">Berkeley&#x27;s extensions, lives on in macOS</text><rect x="460.0" y="96.0" width="210.0" height="66.0" rx="4" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="470.0" y="118.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start" font-weight="700">1983  System V</text><text x="470.0" y="137.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">the commercial Unix</text><text x="470.0" y="152.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">1984 breakup lets AT&amp;T sell it</text><rect x="880.0" y="40.0" width="200.0" height="56.0" rx="4" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="890.0" y="62.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start" font-weight="700">1991  Linux</text><text x="890.0" y="81.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">written from scratch, Unix-like</text><line x1="182.0" y1="90.0" x2="216.0" y2="90.0" stroke="#5b6675" stroke-width="1.4" marker-end="url(#ah5b6675)"/><line x1="412.0" y1="80.0" x2="456.0" y2="46.0" stroke="#5b6675" stroke-width="1.4" marker-end="url(#ah5b6675)"/><line x1="412.0" y1="100.0" x2="456.0" y2="124.0" stroke="#5b6675" stroke-width="1.4" marker-end="url(#ah5b6675)"/><rect x="10.0" y="196.0" width="1080.0" height="190.0" rx="6" fill="#fdf2d6" stroke="#e8b23a" stroke-width="1.4"/><text x="24.0" y="220.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b8560f" text-anchor="start" font-weight="700">THE TEACHING LINE: WHERE xv6 LIVES</text><rect x="24.0" y="236.0" width="190.0" height="90.0" rx="4" fill="#ffffff" stroke="#e8b23a" stroke-width="1.2"/><text x="34.0" y="258.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start" font-weight="700">1976  Lions&#x27; Commentary</text><text x="34.0" y="277.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">the whole v6 source,</text><text x="34.0" y="292.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">explained line by line</text><line x1="216.0" y1="281.0" x2="234.0" y2="281.0" stroke="#b8560f" stroke-width="1.4" marker-end="url(#ahb8560f)"/><rect x="236.0" y="236.0" width="190.0" height="90.0" rx="4" fill="#ffffff" stroke="#e8b23a" stroke-width="1.2"/><text x="246.0" y="258.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start" font-weight="700">1979  AT&amp;T bans it</text><text x="246.0" y="277.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">the v7 license forbids</text><text x="246.0" y="292.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">teaching from the source</text><line x1="428.0" y1="281.0" x2="446.0" y2="281.0" stroke="#b8560f" stroke-width="1.4" marker-end="url(#ahb8560f)"/><rect x="448.0" y="236.0" width="190.0" height="90.0" rx="4" fill="#ffffff" stroke="#e8b23a" stroke-width="1.2"/><text x="458.0" y="258.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start" font-weight="700">1987  MINIX</text><text x="458.0" y="277.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">Tanenbaum&#x27;s Unix-like</text><text x="458.0" y="292.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">system, no AT&amp;T code</text><line x1="640.0" y1="281.0" x2="658.0" y2="281.0" stroke="#b8560f" stroke-width="1.4" marker-end="url(#ahb8560f)"/><rect x="660.0" y="236.0" width="190.0" height="90.0" rx="4" fill="#ffffff" stroke="#e8b23a" stroke-width="1.2"/><text x="670.0" y="258.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="start" font-weight="700">2006  xv6</text><text x="670.0" y="277.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">MIT re-implements v6</text><text x="670.0" y="292.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="start">in modern C (x86)</text><line x1="852.0" y1="281.0" x2="870.0" y2="281.0" stroke="#b8560f" stroke-width="1.4" marker-end="url(#ahb8560f)"/><rect x="872.0" y="236.0" width="190.0" height="90.0" rx="4" fill="#b8560f" stroke="#b8560f" stroke-width="1.2"/><text x="882.0" y="258.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="700">2019  xv6-riscv</text><text x="882.0" y="277.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="start">rewritten for RISC-V:</text><text x="882.0" y="292.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="start">the one in our labs</text><text x="550.0" y="366.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="middle" font-weight="700">Reading xv6 = reading the 1975 Unix design, in code written to be read.</text><path d="M 315 132 L 315 160 L 119 160 L 119 232" stroke="#b8560f" stroke-width="1.4" fill="none" marker-end="url(#ahb8560f)"/><text x="130.0" y="179.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#b8560f" text-anchor="start">v6&#x27;s source becomes a textbook</text><path d="M 560 234 L 960 98" stroke="#b8560f" stroke-width="1.4" fill="none" marker-end="url(#ahb8560f)" stroke-dasharray="5 4"/><text x="730.0" y="145.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#b8560f" text-anchor="middle">inspires</text></svg>
