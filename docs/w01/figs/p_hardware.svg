<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 4 983 291" width="983" height="291" role="img"><title>What we have: one CPU, one instruction stream. Where it breaks: 61 programs on 2 CPUs</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="ah5b6675" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="as5b6675" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs><rect x="3" y="4" width="983" height="291" fill="#ffffff"/><rect x="10.0" y="10.0" width="200.0" height="32.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="0"/><text x="110.0" y="30.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">WHAT WE HAVE</text><text x="10.0" y="64.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="start" font-weight="700">one CPU, one instruction stream</text><rect x="10.0" y="82.0" width="120.0" height="46.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="70.0" y="109.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">FETCH</text><line x1="132.0" y1="105.0" x2="158.0" y2="105.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><rect x="160.0" y="82.0" width="120.0" height="46.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="220.0" y="109.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">DECODE</text><line x1="282.0" y1="105.0" x2="308.0" y2="105.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><rect x="310.0" y="82.0" width="120.0" height="46.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="370.0" y="109.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">EXECUTE</text><path d="M 370 130 L 370 150 L 30 150 L 30 132" stroke="#5b6675" stroke-width="1.3" fill="none" marker-end="url(#ah5b6675)"/><text x="200.0" y="170.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle">then the next instruction, billions of times a second</text><rect x="10.0" y="196.0" width="440.0" height="46.0" rx="3" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="230.0" y="223.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1b2430" text-anchor="middle">memory: the instructions and the data of ONE program</text><rect x="520.0" y="10.0" width="200.0" height="32.0" rx="4" fill="#b23a48" stroke="#b23a48" stroke-width="0"/><text x="620.0" y="30.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">WHERE IT BREAKS</text><text x="520.0" y="64.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start" font-weight="700">the Ubuntu 24.04 capture: 61 processes, 2 CPUs</text><rect x="520.0" y="76.0" width="24.0" height="21.0" rx="2" fill="#f8e3e6" stroke="#b23a48" stroke-width="1"/><rect x="549.0" y="76.0" width="24.0" height="21.0" rx="2" fill="#f8e3e6" stroke="#b23a48" stroke-width="1"/><rect x="578.0" y="76.0" width="24.0" height="21.0" rx="2" fill="#f8e3e6" stroke="#b23a48" stroke-width="1"/><rect x="607.0" y="76.0" width="24.0" height="21.0