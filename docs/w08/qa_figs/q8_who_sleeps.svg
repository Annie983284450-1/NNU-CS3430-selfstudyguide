<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="960" height="380" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">A snapshot: only the threads that asked for lock m while it was held are asleep</text><rect x="20" y="50" width="60" height="36" rx="4" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="50.0" y="73.04" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">T1</text><rect x="90" y="50" width="420" height="36" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="300.0" y="72.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">holds m, inside its critical section</text><rect x="520" y="50" width="260" height="36" rx="4" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="650.0" y="72.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">running on a CPU</text><rect x="20" y="96" width="60" height="36" rx="4" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.5"/><text x="50.0" y="119.04" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">T2</text><rect x="90" y="96" width="420" height="36" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="300.0" y="118.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">called lock(m), found flag = 1, queued first</text><rect x="520" y="96" width="260" height="36" rx="4" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.5"/><text x="650.0" y="118.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#B03A2E" text-anchor="middle" font-weight="bold">asleep in park() (blocked)</text><rect x="20" y="142" width="60" height="36" rx="4" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.5"/><text x="50.0" y="165.04" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">T3</text><rect x="90" y="142" width="420" height="36" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="300.0" y="164.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">called lock(m) after T2, queued second</text><rect x="520" y="142" width="260" height="36" rx="4" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.5"/><text x="650.0" y="164.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#B03A2E" text-anchor="middle" font-weight="bold">asleep in park() (blocked)</text><rect x="20" y="188" width="60" height="36" rx="4" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="50.0" y="211.04" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">T4</text><rect x="90" y="188" width="420" height="36" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="300.0" y="210.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">doing other work, never calls lock(m)</text><rect x="520" y="188" width="260" height="36" rx="4" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="650.0" y="210.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">running or ready, as usual</text><rect x="20" y="234" width="60" height="36" rx="4" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="50.0" y="257.04" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">T5</text><rect x="90" y="234" width="420" height="36" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="300.0" y="256.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">holds a different lock, n</text><rect x="520" y="234" width="260" height="36" rx="4" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.5"/><text x="650.0" y="256.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">running: m does not concern it</text><rect x="800" y="50" width="140" height="220" rx="6" fill="#FFF3CC" stroke="#C9A227" stroke-width="1.4"/><text x="870" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">queue of m</text><rect x="820" y="90" width="100" height="34" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="870.0" y="112.04" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">T2</text><rect x="820" y="132" width="100" height="34" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="870.0" y="154.04" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">T3</text><text x="870" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="middle">T1&#x27;s unlock</text><text x="870" y="208" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="middle">wakes T2 only;</text><text x="870" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="middle">T3 sleeps on</text><text x="870" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F3864" text-anchor="middle">until T2 unlocks</text><rect x="20" y="290" width="920" height="76" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="32" y="312" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">And a thread that calls lock(m) when the flag is 0 never sleeps at all</text><text x="32" y="332.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">It takes the guard, sees flag = 0, sets it to 1, gives the guard back and goes straight in. The queue is used only when</text><text x="32" y="349.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">somebody actually has to wait. Sleepers use no CPU, so the CPUs keep running T1, T4 and T5.</text></svg>