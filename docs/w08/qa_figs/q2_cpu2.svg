<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520"><rect width="960" height="520" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Why B keeps CPU 2 instead of handing it to someone else</text><rect x="20" y="48" width="450" height="300" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="36" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">OSTEP&#x27;s setting: threads roughly equal CPUs</text><rect x="40" y="92" width="190" height="40" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.5"/><text x="135.0" y="116.68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="middle" font-weight="bold">CPU 1: thread A</text><text x="40" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">inside its critical section,</text><text x="40" y="166" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">running at full speed</text><rect x="260" y="92" width="190" height="40" rx="4" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.5"/><text x="355.0" y="116.68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B03A2E" text-anchor="middle" font-weight="bold">CPU 2: thread B</text><text x="260" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">called lock(&amp;L) too:</text><text x="260" y="166" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="start">spins until A unlocks</text><rect x="40" y="192" width="410" height="62" rx="4" fill="#fff" stroke="#8A8A8A" stroke-width="1.2" stroke-dasharray="5,3"/><text x="56" y="216" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#8A8A8A" text-anchor="start">threads ready and waiting for a CPU:</text><text x="56" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="start" font-weight="bold">none (every thread already has its own CPU)</text><text x="36" y="282" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="start">So B&#x27;s spinning takes CPU time from nobody.</text><text x="36" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="start">And it ends when A&#x27;s short section ends.</text><rect x="490" y="48" width="450" height="300" rx="6" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="506" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">The other choice: give CPU 2 away</text><circle cx="522" cy="111" r="11" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="522" y="115.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">1</text><rect x="542" y="92" width="380" height="38" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="732.0" y="115.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">B gives up CPU 2 (a system call)</text><circle cx="522" cy="161" r="11" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="522" y="165.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">2</text><rect x="542" y="142" width="380" height="38" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="732.0" y="165.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">switch to another thread, if there is one</text><circle cx="522" cy="211" r="11" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="522" y="215.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">3</text><rect x="542" y="192" width="380" height="38" rx="4" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.5"/><text x="732.0" y="215.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">A unlocks a moment later</text><circle cx="522" cy="261" r="11" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/><text x="522" y="265.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">4</text><rect x="542" y="242" width="380" height="38" rx="4" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.5"/><text x="732.0" y="265.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="middle">switch back so B can go in</text><text x="506" y="330" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#B03A2E" text-anchor="start" font-weight="bold">Two switches cost more than A&#x27;s few instructions.</text><rect x="20" y="366" width="920" height="140" rx="6" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.2"/><text x="32" y="388" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#2E7D32" text-anchor="start" font-weight="bold">When giving the CPU away does pay: the rest of chapter 28</text><text x="32" y="408.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">More threads than CPUs: another thread is waiting for CPU 2, and B&#x27;s spinning keeps it out.</text><text x="32" y="425.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">A long critical section: B would spin for the whole of it.</text><text x="32" y="443.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">One CPU: the holder itself needs the CPU, so spinning cannot even end.</text><text x="32" y="460.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Those cases are why chapter 28 goes on to yield (28.13) and to sleeping on a queue (28.14).</text></svg>