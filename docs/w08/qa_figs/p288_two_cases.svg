<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><rect width="960" height="470" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">The two cases of section 28.8: where the holder is while the waiter spins</text><text x="20" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#B03A2E" text-anchor="start" font-weight="bold">One CPU: A holds the lock and is switched out inside its critical section</text><text x="20" y="95" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">CPU 1</text><text x="20" y="111" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="start" font-weight="bold">A and B</text><rect x="130" y="80" width="52" height="32" rx="3" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.2"/><text x="156.0" y="100.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">A inside</text><rect x="182" y="80" width="520" height="32" rx="3" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.2"/><text x="442.0" y="100.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B03A2E" text-anchor="middle" font-weight="bold">B spins for its whole time slice: the flag cannot change</text><rect x="702" y="80" width="52" height="32" rx="3" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.2"/><text x="728.0" y="100.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">A ends</text><rect x="754" y="80" width="156" height="32" rx="3" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.2"/><text x="832.0" y="100.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">B inside</text><defs><marker id="mB03A2E" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B03A2E"/></marker></defs><line x1="182" y1="140" x2="182" y2="116" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#mB03A2E)"/><text x="182" y="156" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#B03A2E" text-anchor="middle">timer: A switched out</text><line x1="702" y1="140" x2="702" y2="116" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#mB03A2E)"/><text x="702" y="156" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#B03A2E" text-anchor="middle">timer: A back</text><text x="20" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">The only thread that can release the lock is not running. With N threads, N - 1 slices can be lost like this.</text><text x="20" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#2E7D32" text-anchor="start" font-weight="bold">Several CPUs, one thread per CPU: A keeps running while B spins</text><text x="20" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">CPU 1</text><text x="20" y="271" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="start" font-weight="bold">Thread A</text><text x="20" y="299" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">CPU 2</text><text x="20" y="315" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#262626" text-anchor="start" font-weight="bold">Thread B</text><rect x="130" y="240" width="104" height="32" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="182.0" y="260.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">work</text><rect x="234" y="240" width="52" height="32" rx="3" fill="#FFF3CC" stroke="#1F3864" stroke-width="1.2"/><text x="260.0" y="260.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">inside</text><rect x="286" y="240" width="624" height="32" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="598.0" y="260.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">other work, no lock held</text><rect x="130" y="284" width="117.0" height="32" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="188.5" y="304.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">work</text><rect x="247.0" y="284" width="39.0" height="32" rx="3" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.2"/><text x="266.5" y="304.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B03A2E" text-anchor="middle" font-weight="bold">spin</text><rect x="286" y="284" width="52" height="32" rx="3" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.2"/><text x="312.0" y="304.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">inside</text><rect x="338" y="284" width="572" height="32" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="624.0" y="304.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#262626" text-anchor="middle">work</text><line x1="286" y1="236" x2="286" y2="322" stroke="#C9A227" stroke-width="1.5" stroke-dasharray="4,3"/><text x="292" y="340" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#C9A227" text-anchor="start">A unlocks; B gets in at once</text><rect x="20" y="362" width="920" height="92" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="32" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">So on several CPUs the spin costs at most the rest of A&#x27;s critical section</text><text x="32" y="404.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">B waits only while A is inside, because A is running the whole time. Section 28.8&#x27;s next step: &quot;presumably the critical section</text><text x="32" y="421.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">is short&quot;, so the wait is short and spinning &quot;can be effective&quot;. If the section were long, B would burn CPU 2 for all of it.</text></svg>