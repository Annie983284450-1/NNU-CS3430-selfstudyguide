<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="980" height="470" fill="#fff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F3864" text-anchor="start" font-weight="bold">Sleeping is not free: it has a fixed cost. When the lock is about to be freed, that cost is the waste.</text><text x="20" y="50" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-style="italic">Illustrative times, not a measurement: a short critical section is well under a microsecond; sleep + wake is microseconds.</text><text x="20" y="82" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">The lock is freed</text><text x="20" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">almost at once</text><text x="150" y="72" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">waiter that spins</text><rect x="150" y="78" width="95.19999999999999" height="26" rx="3" fill="#F9E0DC" stroke="#1F3864" stroke-width="1.2"/><text x="197.6" y="94.96" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#B03A2E" text-anchor="middle">spin</text><rect x="245.2" y="78" width="68.0" height="26" rx="3" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.2"/><text x="279.2" y="95.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2E7D32" text-anchor="middle" font-weight="bold">inside</text><text x="150" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">waiter that sleeps</text><rect x="150" y="130" width="81.6" height="26" rx="3" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="190.8" y="146.96" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1F3864" text-anchor="middle">go to sleep</text><rect x="231.6" y="130" width="136.0" height="26" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.2"/><text x="299.6" y="146.96" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle">asleep</text><rect x="367.6" y="130" width="122.39999999999999" height="26" rx="3" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="428.8" y="146.96" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1F3864" text-anchor="middle">woken, gets a CPU</text><rect x="490" y="130" width="68" height="26" rx="3" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.2"/><text x="524.0" y="147.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2E7D32" text-anchor="middle" font-weight="bold">inside</text><line x1="245.2" y1="76" x2="245.2" y2="106" stroke="#C9A227" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="245.2" y1="129" x2="245.2" y2="162" stroke="#C9A227" stroke-width="1.5" stroke-dasharray="4 3"/><text x="249.2" y="176" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#C9A227" text-anchor="start">lock freed here; futex_wake wakes the sleeper</text><text x="566" y="98" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2E7D32" text-anchor="start" font-weight="bold">spinning wins:</text><text x="566" y="114" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2E7D32" text-anchor="start">gets in much sooner,</text><text x="566" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2E7D32" text-anchor="start">with no system call</text><text x="20" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">The lock is held</text><text x="20" y="238" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="bold">for a long time</text><text x="150" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">waiter that spins</text><rect x="150" y="218" width="714" height="26" rx="3" fill="#F9E0DC" stroke="#B03A2E" stroke-width="1.2"/><text x="507.0" y="235.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B03A2E" text-anchor="middle" font-weight="bold">spin, spin, spin: a whole CPU burned for the whole wait</text><text x="150" y="264" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start">waiter that sleeps</text><rect x="150" y="270" width="54.400000000000006" height="26" rx="3" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="177.2" y="286.96" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1F3864" text-anchor="middle">sleep</text><rect x="204.4" y="270" width="659.5999999999999" height="26" rx="3" fill="#fff" stroke="#2E7D32" stroke-width="1.2"/><text x="534.1999999999999" y="287.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2E7D32" text-anchor="middle">asleep: its CPU runs other threads meanwhile</text><rect x="20" y="316" width="940" height="140" rx="6" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.2"/><text x="32" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F3864" text-anchor="start" font-weight="bold">The two-phase lock bets on the first case, and limits its loss in the second</text><text x="32" y="358.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Phase 1: spin a little, in case the holder is about to unlock. If it does, you skipped the sleep and wake entirely.</text><text x="32" y="380.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">Phase 2: if the lock is still held, stop spinning and sleep. You lost only the short spin, not the whole wait.</text><text x="32" y="402.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">There is a second reason spinning helps: a woken thread is only ready, not running. It must wait for the scheduler</text><text x="32" y="424.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#262626" text-anchor="start">to give it a CPU before it can even enter. A spinner is already on a CPU at the moment the lock is freed.</text></svg>