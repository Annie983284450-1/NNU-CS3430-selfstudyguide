<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 15 993 286" width="993" height="286" role="img"><title>The first class in one picture</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect x="4" y="15" width="993" height="286" fill="#ffffff"/><rect x="30.0" y="30.0" width="190.0" height="54.0" rx="2" fill="#f3f4f6" stroke="#5b6675" stroke-width="1.2"/><text x="125.0" y="53.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">counter (memory)</text><text x="125.0" y="69.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">50</text><rect x="480.0" y="30.0" width="180.0" height="54.0" rx="6" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="570.0" y="53.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">eax (register)</text><text x="570.0" y="69.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">51</text><line x1="224.0" y1="44.0" x2="476.0" y2="44.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><text x="350.0" y="30.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">1  mov: load the value into the register</text><line x1="476.0" y1="72.0" x2="224.0" y2="72.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><text x="350.0" y="102.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">3  mov: store the register back to memory</text><text x="570.0" y="108.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle">2  add 1 (in the register)</text><rect x="700.0" y="26.0" width="290.0" height="64.0" rx="8" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="845.0" y="54.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">a timer interrupt between 2 and 3:</text><text x="845.0" y="70.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">the other thread runs</text><text x="10.0" y="155.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f3864" text-anchor="start" font-weight="700">the fix: a lock around the critical section</text><rect x="30.0" y="176.0" width="220.0" height="50.0" rx="6" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="140.0" y="206.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="700">lock(&amp;m)</text><rect x="280.0" y="176.0" width="300.0" height="50.0" rx="6" fill="#fdf2d6" stroke="#e8b23a" stroke-width="1.2"/><text x="430.0" y="206.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#1b2430" text-anchor="middle" font-weight="700">load, add, store</text><rect x="610.0" y="176.0" width="220.0" height="50.0" rx="6" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="720.0" y="206.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="700">unlock(&amp;m)</text><rect x="330.0" y="248.0" width="140.0" height="46.0" rx="6" fill="#b8560f" stroke="#b8560f" stroke-width="1.2"/><text x="400.0" y="275.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">thread 2</text><text x="484.0" y="275.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b8560f" text-anchor="start">waits here, outside the locked lines, until unlock</text></svg>
