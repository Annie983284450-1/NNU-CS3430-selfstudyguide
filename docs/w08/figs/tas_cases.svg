<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 991 208" width="991" height="208" role="img"><title>The two cases of TestAndSet</title><defs><marker id="ah2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="as2e7d32" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect x="3" y="3" width="991" height="208" fill="#ffffff"/><rect x="10.0" y="10.0" width="220.0" height="84.0" rx="10" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/><text x="120.0" y="47.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="700">lock = 0</text><text x="120.0" y="69.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="700">free</text><line x1="240.0" y1="52.0" x2="300.0" y2="52.0" stroke="#2e7d32" stroke-width="2" marker-end="url(#ah2e7d32)"/><text x="320.0" y="37.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">TestAndSet(&amp;flag, 1) returns 0 and leaves 1 behind. 0 is not 1, so the loop ends: the thread is in, and</text><text x="320.0" y="56.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">the flag says held.</text><rect x="10.0" y="120.0" width="220.0" height="84.0" rx="10" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.6"/><text x="120.0" y="157.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#b23a48" text-anchor="middle" font-weight="700">lock = 1</text><text x="120.0" y="179.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#b23a48" text-anchor="middle" font-weight="700">held by T1</text><line x1="240.0" y1="162.0" x2="300.0" y2="162.0" stroke="#b23a48" stroke-width="2" marker-end="url(#ahb23a48)"/><text x="320.0" y="147.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">it returns 1 and writes 1 again (no change). 1 is 1, so the thread spins and tries again, until the owner</text><text x="320.0" y="166.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">stores 0.</text></svg>
