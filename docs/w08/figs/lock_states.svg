<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 886 146" width="886" height="146" role="img"><title>A lock variable has two states</title><defs></defs><rect x="2" y="2" width="886" height="146" fill="#ffffff"/><rect x="10.0" y="10.0" width="400.0" height="130.0" rx="16" fill="#e3f1e4" stroke="#2e7d32" stroke-width="2.4"/><text x="210.0" y="65.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#2e7d32" text-anchor="middle" font-weight="700">lock = 0</text><text x="210.0" y="108.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#2e7d32" text-anchor="middle" font-weight="700">free</text><rect x="480.0" y="10.0" width="400.0" height="130.0" rx="16" fill="#f8e3e6" stroke="#b23a48" stroke-width="2.4"/><text x="680.0" y="65.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#b23a48" text-anchor="middle" font-weight="700">lock = 1</text><text x="680.0" y="108.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#b23a48" text-anchor="middle" font-weight="700">held by T1</text></svg>
