<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 977 366" width="977" height="366" role="img"><title>One lock word, two threads, five moments</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect x="3" y="3" width="977" height="366" fill="#ffffff"/><rect x="10.0" y="10.0" width="40.0" height="56.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="30.0" y="43.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="64.0" y="42.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">T1 locks: nobody holds it</text><rect x="300.0" y="18.0" width="50.0" height="40.0" rx="0" fill="#e3f1e4" stroke="#1f3864" stroke-width="1.2"/><text x="325.0" y="43.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">0</text><rect x="410.0" y="18.0" width="50.0" height="40.0" rx="0" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="435.0" y="43.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">1</text><line x1="354.0" y1="38.0" x2="406.0" y2="38.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><text x="480.0" y="42.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">one atomic instruction; no kernel</text><rect x="10.0" y="84.0" width="40.0" height="56.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="30.0" y="117.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="64.0" y="116.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">T2 locks: held</text><rect x="300.0" y="92.0" width="50.0" height="40.0" rx="0" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="325.0" y="117.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">1</text><rect x="410.0" y="92.0" width="50.0" height="40.0" rx="0" fill="#f8e3e6" stroke="#1f3864" stroke-width="1.2"/><text x="435.0" y="117.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">2</text><line x1="354.0" y1="112.0" x2="406.0" y2="112.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><text x="480.0" y="108.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">T2 writes 2, then futex_wait(&amp;m, 2): the kernel sleeps T2 on the queue for &amp;m only if the word</text><text x="480.0" y="123.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">still says 2; if an unlock got in first, it returns at once, and no wake-up is lost</text><rect x="10.0" y="158.0" width="40.0" height="56.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="30.0" y="191.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="64.0" y="190.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">T1 unlocks: it finds 2</text><rect x="300.0" y="166.0" width="50.0" height="40.0" rx="0" fill="#f8e3e6" stroke="#1f3864" stroke-width="1.2"/><text x="325.0" y="191.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">2</text><rect x="410.0" y="166.0" width="50.0" height="40.0" rx="0" fill="#e3f1e4" stroke="#1f3864" stroke-width="1.2"/><text x="435.0" y="191.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">0</text><line x1="354.0" y1="186.0" x2="406.0" y2="186.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><text x="480.0" y="190.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">store 0, then futex_wake(&amp;m, 1): the kernel wakes one sleeper</text><rect x="10.0" y="232.0" width="40.0" height="56.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="30.0" y="265.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="64.0" y="264.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">T2 wakes and takes it</text><rect x="300.0" y="240.0" width="50.0" height="40.0" rx="0" fill="#e3f1e4" stroke="#1f3864" stroke-width="1.2"/><text x="325.0" y="265.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">0</text><rect x="410.0" y="240.0" width="50.0" height="40.0" rx="0" fill="#f8e3e6" stroke="#1f3864" stroke-width="1.2"/><text x="435.0" y="265.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">2</text><line x1="354.0" y1="260.0" x2="406.0" y2="260.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><text x="480.0" y="264.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">T2 writes 2, not 1, because another waiter may still be asleep</text><rect x="10.0" y="306.0" width="40.0" height="56.0" rx="4" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="30.0" y="339.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><text x="64.0" y="338.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">T2 unlocks: it finds 2, queue</text><text x="64.0" y="357.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">empty</text><rect x="300.0" y="314.0" width="50.0" height="40.0" rx="0" fill="#f8e3e6" stroke="#1f3864" stroke-width="1.2"/><text x="325.0" y="339.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">2</text><rect x="410.0" y="314.0" width="50.0" height="40.0" rx="0" fill="#e3f1e4" stroke="#1f3864" stroke-width="1.2"/><text x="435.0" y="339.2" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">0</text><line x1="354.0" y1="334.0" x2="406.0" y2="334.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><text x="480.0" y="330.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="start">store 0, then futex_wake: the kernel finds nobody asleep; a 2 only says &#x27;may be&#x27;</text></svg>
