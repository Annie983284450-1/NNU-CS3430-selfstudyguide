<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 0 992 230" width="992" height="230" role="img"><title>What the extra 0.22 s is</title><defs></defs><rect x="4" y="0" width="992" height="230" fill="#ffffff"/><text x="10.0" y="20.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1f3864" text-anchor="start" font-weight="700">what the extra 0.22 s is</text><text x="10.0" y="54.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6675" text-anchor="start" font-weight="700">spin lock, one core</text><rect x="10.0" y="62.0" width="250.0" height="64.0" rx="0" fill="#1f3864" stroke="#ffffff" stroke-width="1"/><text x="135.0" y="100.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">T1 inside</text><rect x="260.0" y="62.0" width="600.0" height="64.0" rx="0" fill="#b8560f" stroke="#ffffff" stroke-width="1"/><text x="560.0" y="100.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">T2 spins its whole slice</text><rect x="860.0" y="62.0" width="130.0" height="64.0" rx="0" fill="#1f3864" stroke="#ffffff" stroke-width="1"/><text x="925.0" y="100.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">T1</text><text x="10.0" y="154.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6675" text-anchor="start" font-weight="700">mutex (futex), one core</text><rect x="10.0" y="162.0" width="250.0" height="64.0" rx="0" fill="#1f3864" stroke="#ffffff" stroke-width="1"/><text x="135.0" y="200.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">T1 inside</text><rect x="260.0" y="162.0" width="110.0" height="64.0" rx="0" fill="#b8560f" stroke="#ffffff" stroke-width="1"/><text x="315.0" y="200.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">T2 zz</text><rect x="370.0" y="162.0" width="390.0" height="64.0" rx="0" fill="#1f3864" stroke="#ffffff" stroke-width="1"/><text x="565.0" y="200.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">T1 finishes, unlocks</text><rect x="760.0" y="162.0" width="230.0" height="64.0" rx="0" fill="#b8560f" stroke="#ffffff" stroke-width="1"/><text x="875.0" y="200.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">T2 inside</text></svg>
