<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 754 406" width="754" height="406" role="img"><title>The race after step 3</title><defs></defs><rect x="3" y="3" width="754" height="406" fill="#ffffff"/><rect x="10.0" y="10.0" width="160.0" height="50.0" rx="6" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="90.0" y="40.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">thread 1</text><text x="190.0" y="40.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">loads 50, adds: eax = 51, has not stored yet</text><rect x="10.0" y="80.0" width="740.0" height="42.0" rx="6" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="380.0" y="105.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#b23a48" text-anchor="middle" font-weight="700">timer interrupt: T1&#x27;s eax = 51 is saved in its TCB (thread control block)</text><rect x="10.0" y="142.0" width="160.0" height="50.0" rx="6" fill="#b8560f" stroke="#b8560f" stroke-width="1.2"/><text x="90.0" y="172.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">thread 2</text><text x="190.0" y="172.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">loads 50 (memory still says 50), adds, stores 51</text><rect x="10.0" y="212.0" width="740.0" height="42.0" rx="6" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.2"/><text x="380.0" y="237.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#b23a48" text-anchor="middle" font-weight="700">timer interrupt: T1 restored, its eax is 51 again</text><rect x="10.0" y="274.0" width="160.0" height="50.0" rx="6" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="90.0" y="304.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">thread 1</text><text x="190.0" y="304.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430" text-anchor="start">stores its old 51 over thread 2&#x27;s 51</text><rect x="300.0" y="340.0" width="200.0" height="62.0" rx="2" fill="#fdf2d6" stroke="#b23a48" stroke-width="1.6"/><text x="400.0" y="366.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#b23a48" text-anchor="middle" font-weight="700">counter</text><text x="400.0" y="386.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#b23a48" text-anchor="middle" font-weight="700">51, not 52</text></svg>
