<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 894 203" width="894" height="203" role="img"><title>One CPU, the timer silenced between the two calls</title><defs><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect x="3" y="3" width="894" height="203" fill="#ffffff"/><rect x="10.0" y="10.0" width="230.0" height="60.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/><text x="125.0" y="47.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#2e7d32" text-anchor="middle" font-weight="700">lock()</text><rect x="240.0" y="10.0" width="420.0" height="60.0" rx="0" fill="#fdf2d6" stroke="#e8b23a" stroke-width="1.6"/><text x="450.0" y="47.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1f3864" text-anchor="middle" font-weight="700">critical section, no interrupts</text><rect x="660.0" y="10.0" width="230.0" height="60.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/><text x="775.0" y="47.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#2e7d32" text-anchor="middle" font-weight="700">unlock()</text><line x1="320.0" y1="160.0" x2="320.0" y2="76.0" stroke="#b23a48" stroke-width="2.4" marker-end="url(#ahb23a48)"/><line x1="450.0" y1="160.0" x2="450.0" y2="76.0" stroke="#b23a48" stroke-width="2.4" marker-end="url(#ahb23a48)"/><line x1="580.0" y1="160.0" x2="580.0" y2="76.0" stroke="#b23a48" stroke-width="2.4" marker-end="url(#ahb23a48)"/><text x="450.0" y="197.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#b23a48" text-anchor="middle">a tick arrives and waits; later ticks are lost</text></svg>
