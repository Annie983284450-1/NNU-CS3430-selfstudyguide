<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 884 278" width="884" height="278" role="img"><title>A switch drawn twice: process to process, thread to thread</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker></defs><rect x="3" y="3" width="884" height="278" fill="#ffffff"/><rect x="10.0" y="10.0" width="420.0" height="64.0" rx="8" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="220.0" y="38.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">A stops running</text><text x="220.0" y="54.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">its registers and PC saved into its PCB</text><line x1="220.0" y1="78.0" x2="220.0" y2="106.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><rect x="10.0" y="110.0" width="420.0" height="64.0" rx="8" fill="#b8560f" stroke="#b8560f" stroke-width="1.2"/><text x="220.0" y="138.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">B&#x27;s registers and PC</text><text x="220.0" y="154.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">loaded from its PCB</text><line x1="220.0" y1="178.0" x2="220.0" y2="206.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><rect x="10.0" y="210.0" width="420.0" height="64.0" rx="8" fill="#f8e3e6" stroke="#b23a48" stroke-width="1.6"/><text x="220.0" y="238.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">page table switched to B&#x27;s</text><text x="220.0" y="254.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="middle" font-weight="700">B sees different memory</text><rect x="460.0" y="10.0" width="420.0" height="64.0" rx="8" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="670.0" y="38.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">thread 1 stops running</text><text x="670.0" y="54.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">its registers and PC saved into its TCB</text><line x1="670.0" y1="78.0" x2="670.0" y2="106.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><rect x="460.0" y="110.0" width="420.0" height="64.0" rx="8" fill="#b8560f" stroke="#b8560f" stroke-width="1.2"/><text x="670.0" y="138.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">thread 2&#x27;s registers and PC</text><text x="670.0" y="154.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">loaded from its TCB</text><line x1="670.0" y1="178.0" x2="670.0" y2="206.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><rect x="460.0" y="210.0" width="420.0" height="64.0" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/><text x="670.0" y="238.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="700">page table stays</text><text x="670.0" y="254.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="700">thread 2 sees the same memory</text></svg>
