<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 829 236" width="829" height="236" role="img"><title>T1 unlocks, and T2 gets in</title><defs></defs><rect x="3" y="3" width="829" height="236" fill="#ffffff"/><text x="540.0" y="18.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6675" text-anchor="middle">flag after</text><rect x="10.0" y="30.0" width="140.0" height="54.0" rx="6" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="80.0" y="62.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">T1</text><text x="170.0" y="54.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">unlock(): flag = 0</text><rect x="490.0" y="34.0" width="110.0" height="46.0" rx="0" fill="#e3f1e4" stroke="#1f3864" stroke-width="1.2"/><text x="545.0" y="63.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1f3864" text-anchor="middle" font-weight="700">0</text><text x="620.0" y="61.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">T1 is out</text><rect x="10.0" y="104.0" width="140.0" height="54.0" rx="6" fill="#b8560f" stroke="#b8560f" stroke-width="1.2"/><text x="80.0" y="136.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">T2</text><text x="170.0" y="128.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">TestAndSet(&amp;flag, 1): gets back 0, leaves 1</text><rect x="490.0" y="108.0" width="110.0" height="46.0" rx="0" fill="#f8e3e6" stroke="#1f3864" stroke-width="1.2"/><text x="545.0" y="137.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1f3864" text-anchor="middle" font-weight="700">1</text><text x="620.0" y="135.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">0 is not 1: T2 is inside now</text><rect x="10.0" y="178.0" width="140.0" height="54.0" rx="6" fill="#5b6675" stroke="#5b6675" stroke-width="1.2"/><text x="80.0" y="210.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">T3?</text><text x="170.0" y="202.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">a third thread swapping now</text><rect x="490.0" y="182.0" width="110.0" height="46.0" rx="0" fill="#f8e3e6" stroke="#1f3864" stroke-width="1.2"/><text x="545.0" y="211.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1f3864" text-anchor="middle" font-weight="700">1</text><text x="620.0" y="209.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">gets back 1 and spins, like T2 did</text></svg>
