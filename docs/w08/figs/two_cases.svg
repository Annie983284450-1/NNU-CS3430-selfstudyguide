<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 0 865 193" width="865" height="193" role="img"><title>Two cases one process does badly</title><defs></defs><rect x="3" y="0" width="865" height="193" fill="#ffffff"/><text x="10.0" y="17.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b23a48" text-anchor="start" font-weight="700">case 1: a big computation</text><rect x="10.0" y="30.0" width="210.0" height="66.0" rx="8" fill="#eef3fa" stroke="#1f3864" stroke-width="1.4"/><text x="115.0" y="59.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">core 0</text><text x="115.0" y="76.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="middle" font-weight="700">summing the array</text><rect x="240.0" y="30.0" width="210.0" height="66.0" rx="8" fill="#f3f4f6" stroke="#7a8291" stroke-width="1.4"/><text x="345.0" y="59.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#7a8291" text-anchor="middle" font-weight="700">core 1</text><text x="345.0" y="76.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#7a8291" text-anchor="middle" font-weight="700">idle</text><text x="470.0" y="54.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">a 400-million-element sum on 2 cores: one core works, one sits</text><text x="470.0" y="73.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2430" text-anchor="start">idle</text><text x="10.0" y="133.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b23a48" text-anchor="start" font-weight="700">case 2: a program that waits for the disk</text><rect x="10.0" y="146.0" width="180.0" height="40.0" rx="0" fill="#1f3864" stroke="#9aa3b2" stroke-width="1.2"/><text x="100.0" y="170.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">compute</text><rect x="190.0" y="146.0" width="370.0" height="40.0" rx="0" fill="#f3f4f6" stroke="#9aa3b2" stroke-width="1.2"/><text x="375.0" y="170.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#7a8291" text-anchor="middle">waiting for the disk, doing nothing</text><rect x="560.0" y="146.0" width="140.0" height="40.0" rx="0" fill="#1f3864" stroke="#9aa3b2" stroke-width="1.2"/><text x="630.0" y="170.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">compute</text></svg>
