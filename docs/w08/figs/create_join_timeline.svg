<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2 994 415" width="994" height="415" role="img"><title>One run of create and join, time going to the right, and where each bundle lives</title><defs><marker id="ah1f3864" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="as1f3864" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker><marker id="ah5b6675" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="as5b6675" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="ahb8560f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8560f"/></marker><marker id="asb8560f" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8560f"/></marker></defs><rect x="3" y="2" width="994" height="415" fill="#ffffff"/><text x="320.0" y="18.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">pthread_create</text><text x="450.0" y="18.6" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">pthread_join</text><rect x="10.0" y="34.0" width="110.0" height="40.0" rx="6" fill="#1f3864" stroke="#1f3864" stroke-width="1.2"/><text x="65.0" y="58.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">main</text><rect x="130.0" y="34.0" width="190.0" height="40.0" rx="0" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="225.0" y="58.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">packs {10, 20}</text><rect x="320.0" y="34.0" width="130.0" height="40.0" rx="0" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="385.0" y="58.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">goes on</text><rect x="450.0" y="34.0" width="300.0" height="40.0" rx="0" fill="#f3f4f6" stroke="#7a8291" stroke-width="1.2" stroke-dasharray="5 4"/><text x="600.0" y="58.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle">waits at join</text><rect x="750.0" y="34.0" width="240.0" height="40.0" rx="0" fill="#eef3fa" stroke="#1f3864" stroke-width="1.2"/><text x="870.0" y="58.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1f3864" text-anchor="middle" font-weight="700">reads {1, 2}, frees it</text><rect x="10.0" y="196.0" width="110.0" height="46.0" rx="6" fill="#b8560f" stroke="#b8560f" stroke-width="1.2"/><text x="65.0" y="223.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">thread</text><rect x="320.0" y="200.0" width="430.0" height="46.0" rx="0" fill="#fbe9da" stroke="#b8560f" stroke-width="1.2"/><text x="535.0" y="227.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b2430" text-anchor="middle" font-weight="700">reads 10 and 20; puts {1, 2} on the heap; returns</text><line x1="320.0" y1="76.0" x2="320.0" y2="196.0" stroke="#1f3864" stroke-width="1.6" marker-end="url(#ah1f3864)"/><text x="328.0" y="139.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1f3864" text-anchor="start">create hands over &amp;args</text><line x1="750.0" y1="198.0" x2="750.0" y2="78.0" stroke="#b8560f" stroke-width="1.6" marker-end="url(#ahb8560f)"/><text x="758.0" y="139.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#b8560f" text-anchor="start">returns the address of {1, 2}</text><text x="220.0" y="270.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle" font-weight="700">step 1: pack, then create</text><text x="530.0" y="270.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle" font-weight="700">step 2: the thread does its work</text><text x="870.0" y="270.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675" text-anchor="middle" font-weight="700">step 3: join hands back the result</text><line x1="130.0" y1="282.0" x2="990.0" y2="282.0" stroke="#5b6675" stroke-width="1.2" marker-end="url(#ah5b6675)"/><text x="990.0" y="299.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675" text-anchor="end">time</text><text x="10.0" y="322.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">where the two bundles live</text><rect x="10.0" y="334.0" width="310.0" height="76.0" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.2"/><text x="165.0" y="360.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">main&#x27;s stack</text><text x="165.0" y="376.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">args = {10, 20}</text><text x="165.0" y="392.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">lives as long as main</text><rect x="340.0" y="334.0" width="310.0" height="76.0" rx="0" fill="#f3f4f6" stroke="#7a8291" stroke-width="1.2"/><text x="495.0" y="360.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#7a8291" text-anchor="middle" font-weight="700">the thread&#x27;s stack</text><text x="495.0" y="376.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#7a8291" text-anchor="middle" font-weight="700">only the address &amp;args</text><text x="495.0" y="392.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#7a8291" text-anchor="middle" font-weight="700">gone when the thread returns</text><rect x="670.0" y="334.0" width="310.0" height="76.0" rx="0" fill="#fbe9da" stroke="#b8560f" stroke-width="1.2"/><text x="825.0" y="360.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">the heap</text><text x="825.0" y="376.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">{x = 1, y = 2}</text><text x="825.0" y="392.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">lives until free</text></svg>
