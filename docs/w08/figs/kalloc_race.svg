<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 3 753 210" width="753" height="210" role="img"><title>Two CPUs call kalloc at the same instant</title><defs><marker id="ahb23a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker><marker id="asb23a48" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker></defs><rect x="5" y="3" width="753" height="210" fill="#ffffff"/><rect x="30.0" y="10.0" width="200.0" height="54.0" rx="8" fill="#eef3fa" stroke="#1f3864" stroke-width="1.4"/><text x="130.0" y="42.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">CPU 0: kalloc()</text><rect x="280.0" y="10.0" width="200.0" height="54.0" rx="8" fill="#eef3fa" stroke="#1f3864" stroke-width="1.4"/><text x="380.0" y="42.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f3864" text-anchor="middle" font-weight="700">CPU 1: kalloc()</text><text x="520.0" y="26.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start">both read the head: both get page P; the</text><text x="520.0" y="43.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b23a48" text-anchor="start">kernel hands out one page twice</text><text x="10.0" y="192.9" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#1f3864" text-anchor="start" font-weight="700">freelist</text><rect x="130.0" y="170.0" width="110.0" height="36.0" rx="2" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="185.0" y="192.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">page P</text><rect x="260.0" y="170.0" width="110.0" height="36.0" rx="2" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="315.0" y="192.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">page Q</text><rect x="390.0" y="170.0" width="110.0" height="36.0" rx="2" fill="#dbe5f3" stroke="#1f3864" stroke-width="1.2"/><text x="445.0" y="192.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f3864" text-anchor="middle" font-weight="700">page R</text><line x1="120.0" y1="68.0" x2="175.0" y2="164.0" stroke="#b23a48" stroke-width="2" marker-end="url(#ahb23a48)"/><line x1="360.0" y1="68.0" x2="200.0" y2="164.0" stroke="#b23a48" stroke-width="2" marker-end="url(#ahb23a48)"/></svg>
