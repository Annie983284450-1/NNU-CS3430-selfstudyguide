theory:
  - after: "this trap came from user mode, which is what `usertrap` checks on its line 42."
    title: "two modes, one doorway, and the number in a7"
    body: |
      **What the theory says.** The CPU has two modes. A program in user mode asks for a
      service by putting its number in a register and running `ecall`. The hardware
      records the cause, switches to kernel mode and jumps to the handler address the
      kernel gave it in advance ([Week 2, Sections 4.3 and 4.4](w02/class-2.md#sec-4-3)).
      The hardware saves the program counter and the cause; the trampoline then saves
      the program's registers into the trapframe
      ([Week 2, Extra 23](w02/class-2.md#extra-23)).

      **What this run showed.** The first stop was `init`, pid 1, with 15 in `a7`, which
      is `SYS_open`. `bt` showed `usertrap` calling `syscall`, with the unnamed trampoline
      frame below it. `sstatus` was `0x200000022`, with bit 8 clear.

      **Why the run confirms the theory.** Bit 8 of `sstatus` is where the hardware
      wrote down the mode it came from, and it says user mode. The kernel then read the service number from the copy
      of `a7` that the trampoline saved, which is why the code, and gdb, read it as
      `p->trapframe->a7`.

  - after: "very first system call again, and the kernel never got past reading `a7`."
    title: "an address with no translation is refused, and the hardware says why"
    body: |
      **What the theory says.** When a program uses an address it does not have, the
      hardware refuses the access, records what went wrong, and hands control to the
      operating system ([Week 3, Section 5.5](w03/class-2.md#sec-5-5); with page tables,
      [Week 5, Section 4.3](w05/class-2.md#sec-4-3)). On RISC-V the record is `scause`
      (why), `sepc` (which instruction) and `stval` (which address), and 0xd means a load
      page fault ([Week 4, Extra 18](w04/class-2.md#extra-18) shows one from a user
      program).

      **What this run showed.** `scause=0xd`, `stval=0x0`, and a `sepc` that named the one
      `lw` instruction compiled from your line of C.

      **Why the run confirms the theory.** The hardware did exactly the three things the
      theory lists: it refused, it recorded the cause and the address, and it handed
      control to the kernel. What differs is who faulted. In the theory a user program
      faults, and the kernel kills that program. Here the faulting code was the kernel
      itself, so the trap went to `kerneltrap`, and there is nothing above the kernel to
      clean up. So it panics.

  - after: "string. The name is still `sandbox`: the child has not called `exec` yet."
    title: "arguments travel in registers, and a string travels as an address"
    body: |
      **What the theory says.** The registers `a0` to `a7` carry a call's arguments
      ([Week 2, Section 1.2](w02/class-1.md#sec-1-2)). For a system call the number goes
      in `a7`, and on the way in the kernel saves all the registers into the trapframe
      ([Week 2, Section 4.5](w02/class-2.md#sec-4-5)), so that is where it finds them. When an argument is an address in
      the program's memory, the kernel must check it before reading through it
      ([Week 3, Section 6.2](w03/class-2.md#sec-6-2) reads `fetchaddr`, which does this
      for an 8-byte value). Everything the kernel knows about one process lives in that
      process's `struct proc` ([Week 2, Section 1.4](w02/class-1.md#sec-1-4)).

      **What this run showed.** `a7` was 22, your new number. `a0` was 32768, the mask,
      a plain integer. `a1` was `0x3fd0`: not the string, but an address in `sandbox`'s
      memory. `argstr` copied the string `"-"` from there into the kernel's buffer
      `path`. Afterwards `myproc()->sysmask` held 32768.

      **Why the run confirms the theory.** The integer arrived ready to use. The string
      did not, because it never left the program's memory: only its address crossed in
      a register. `argstr` is the check-then-copy step, and it returns -1 if the address
      is not valid in that process. The mask then landed in this process's own
      `struct proc`.

  - after: "contain `xv6`."
    title: "interposition: one place every system call passes through"
    body: |
      **What the theory says.** Interposition means sitting on a well-defined interface,
      transforming what passes through it, and staying invisible
      (here the transformation is a refusal)
      ([Week 3, Extra 13](w03/class-2.md#extra-13)). Every system call enters the kernel
      through the same trap and the same table lookup
      ([Week 2, Section 4.4](w02/class-2.md#sec-4-4)), so the kernel has one spot where
      it sees every request.

      **What this run showed.** With `open` masked, `cat` printed its ordinary
      `cannot open README`. `echo`, which never calls `open`, was untouched. With `exec`
      masked, `grep` never started.

      **Why the run confirms the theory.** Five lines in `syscall()` controlled three
      unrelated programs, and none of them was changed. `cat` could not tell it was
      sandboxed: it got -1 from `open`, the same answer it gets for a missing file. One
      dispatcher and one check cover every program.

  - after: "`sys_open` is never called. After `continue`"
    title: "exec keeps the process record, so the mask stays"
    body: |
      **What the theory says.** `exec()` replaces a process's memory and keeps its
      identity: the same pid, the same parent, the same open files, the same record in
      the kernel ([Week 2, Extra 17](w02/class-1.md#extra-17)).

      **What this run showed.** The process at the breakpoint was named `cat`, yet its
      name field still ended in `ox`, left over from `sandbox`. Its `sysmask` was
      `0x8000`, set while it was still `sandbox`.

      **Why the run confirms the theory.** Both leftovers can only exist if `exec` reused
      the same `struct proc`. The new name was written over the old one, and the field
      `exec` never touches, the mask, came through unchanged.

  - after: "and then your own shell prints its"
    title: "fork copies the record, one field at a time"
    body: |
      **What the theory says.** `fork()` asks the kernel for a copy of the caller: its
      memory, its registers, its open files ([Week 2, Section 2.2](w02/class-1.md#sec-2-2)).
      In xv6 the copy is the function `kfork()`, which copies the parent's record field
      by field ([Week 2, Extra 13](w02/class-1.md#extra-13)).

      **What this run showed.** Before your two lines, `ls`, a child of the sandboxed
      shell, listed the whole disk. After them, it printed
      `ls: cannot open .`.

      **Why the run confirms the theory.** A child inherits only the fields `kfork`
      copies. Every other field keeps the fresh value `allocproc` gave it, so the child's
      `sysmask` started at 0. A field added to `struct proc` later is not inherited until
      someone writes the line that copies it. "A copy of the caller" is
      a promise kept by code, one assignment per field.

  - after: "`grep` opens it; with `-` (no path) it cannot."
    title: "the dispatcher can read the call's own arguments"
    body: |
      **What the theory says.** On every trap, the program's registers are saved into the
      trapframe before any C code in the kernel runs
      ([Week 2, Extra 23](w02/class-2.md#extra-23)), and a call's arguments are in those
      registers ([Week 2, Section 1.2](w02/class-1.md#sec-1-2)).

      **What this run showed.** `interpose_reject` read argument 0 of whichever call was
      being attempted, `open("README")` or `open("x")`, and let through only the name
      stored in `syspath`.

      **Why the run confirms the theory.** When `syscall()` runs, all of the call's
      registers sit in the trapframe. So the checkpoint can see not only which call it is
      (`a7`) but also its arguments: for `open` and `exec`, `a0` holds the address of the
      pathname, and `argstr` copies the string in so it can be compared.

  - after: "come back each time; `mySecret1` appears in both."
    title: "protection needs the kernel to wipe pages between owners"
    body: |
      **What the theory says.** Protection is one of the three goals of memory
      virtualization: no process may read another's memory
      ([Week 3, Section 1.5](w03/class-1.md#sec-1-5)). The kernel hands out physical
      pages with `kalloc` and takes them back with `kfree`, and a freed page simply goes
      back on the free list for the next user. In a normal xv6, `kfree` and `kalloc` fill
      each page with junk bytes (1 and 5) so that nobody's old data survives in it
      ([Week 4, Section 3.3](w04/class-1.md#sec-3-3)), and every new user page is zeroed
      before the program gets it, so a program sees only zeros
      ([Week 4, Extra 12](w04/class-1.md#extra-12)).

      **What this run showed.** With those fills compiled out, `attack` printed
      `mySecret1`, a word that another process wrote before it exited.

      **Why the run confirms the theory.** No page table was broken and no check was
      skipped while `secret` was alive. The leak happened after it exited, through a
      reused page. So isolation needs more than address translation: it also needs the
      kernel to wipe a page between owners, which is the job of exactly the lines this
      lab switched off.

  - after: "`blockcount` itself, and it never starts."
    title: "a system call's result comes back in a0"
    body: |
      **What the theory says.** The kernel stores a handler's return value in the saved
      `a0` of the trapframe. On the way back it loads the saved registers into the CPU,
      so the program finds the value in `a0`, where any function result goes
      ([Week 2, Section 2.2](w02/class-1.md#sec-2-2) and
      [Section 4.5](w02/class-2.md#sec-4-5)). Each process's bookkeeping lives in its own
      `struct proc` ([Week 2, Section 1.4](w02/class-1.md#sec-1-4)).

      **What this run showed.** `sys_blocked` is one line, `return myproc()->nblocked;`,
      and `blockcount` printed `blocked 5` under the sandbox and `blocked 0` outside it.

      **Why the run confirms the theory.** The kernel never wrote into `blockcount`'s
      memory. `syscall()` put the handler's return value into `p->trapframe->a0`, and
      the return path loaded it into the real `a0`. The child's 0 after `fork` uses the
      second half of this path: `kfork` writes 0 into the child's saved `a0`, and the
      same return path loads it into the real `a0`.
