theory:
  - after: "are not there yet, because you have not written them."
    title: "a program is a file, a process is that file running"
    body: |
      **What the theory says.** A program is a file on disk, and a file on disk does
      nothing. A process is a program running, with its own memory, registers and open
      files ([Week 2, Section 1.2](w02/class-1.md#sec-1-2)). `exec()` does not create a
      process. It loads a program from a file into the process that calls it
      ([Week 2, Section 3.2](w02/class-1.md#sec-3-2)).

      **What this run showed.** `ls` listed every program as an ordinary file on xv6's
      disk, with an inode number and a size: `echo` is file 6, 34,104 bytes. `echo hello`
      ran, because that file is there. `sleep 10` failed, because there is no file named
      `sleep` yet.

      **Why the run confirms the theory.** Typing a command name is not enough to get a
      process. There has to be a file for `exec()` to load, and a missing file becomes no
      process at all. The disk listing and the failed `sleep` show both sides of that:
      programs sit on the disk as files, and only a file that is there can run.

  - after: "19 to 29. That is the ten ticks you asked for."
    title: "a system call is a number in a register and a trap"
    body: |
      **What the theory says.** A program cannot call the kernel like an ordinary
      function. It puts a call number in a register and runs one trap instruction. The
      hardware switches to kernel mode and jumps to the handler address the kernel gave
      it in advance, and the kernel uses the number to pick the service
      ([Week 2, Sections 4.3 to 4.5](w02/class-2.md#sec-4-3)). In xv6 that round trip
      runs through six stations in four files
      ([Week 2, Section 4.6](w02/class-2.md#sec-4-6)).

      **What this run showed.** `bt` showed the chain: `usertrap` called `syscall`, which
      called `sys_pause`, and below `usertrap` sat the trampoline, the frame with no
      name. `a7` held 13, which is `SYS_pause`. `a0` held 10, and after `argint` the
      kernel's own variable `n` was 10. `ticks` went from 19 to 29.

      **Why the run confirms the theory.** Your program never named `sys_pause`. It only
      put 13 in `a7`, and the kernel found the handler by looking 13 up in its table.
      The argument crossed in a register too. And the clock that your program is not
      allowed to touch did move: `ticks` is the kernel's clock, advanced by the timer
      interrupt ([Week 2, Section 5.2](w02/class-2.md#sec-5-2)), and `sys_pause` waited
      for ten of its ticks on your behalf.

  - after: "bb 1"
    title: "redirection happens between fork and exec"
    body: |
      **What the theory says.** Every process starts with descriptors 0, 1 and 2, and
      `open()` always returns the lowest free descriptor. For `command > file` the shell
      forks; the child closes descriptor 1 and opens the file, which therefore lands in
      slot 1; then the child calls `exec()`, which keeps the table of open files as it is
      ([Week 2, Section 3.4](w02/class-1.md#sec-3-4)).

      **What this run showed.** `echo aa bb aa aa > t.txt` printed nothing on the screen,
      yet `wf t.txt` found all four words in the file: `aa 3`, `bb 1`. `echo` writes with
      `write(1, ...)` (Step 1, part A), and its 19 lines contain no `open` call.

      **Why the run confirms the theory.** `echo` did what it always does: it wrote to
      descriptor 1. The bytes reached `t.txt` because descriptor 1 had been pointed at
      the file before `echo` started, in the gap between `fork()` and `exec()`. `exec()`
      replaced the program and kept the table, so `echo` never knew. Your `wf` is the
      witness that the bytes arrived.

  - after: "program just read a directory. The size 64 in `ls d` is four entries of 16 bytes."
    title: "a name lives in a directory, as an inode number and a name"
    body: |
      **What the theory says.** A file on disk has three pieces: a directory entry that
      holds its name, an inode that the file system knows it by, and the data blocks
      ([Week 1, Extra 8](w01/class-2.md#extra-8)). The name is not stored with the file.
      A directory maps each name to an inode number.

      **What this run showed.** `cat` read the directory `d` like any other file.
      `memdump hS` decoded its first entry: the 2-byte number 30, then the name `.`, which
      is the first line of `ls d`. The directory is 64 bytes long: four 16-byte entries for
      four names.

      **Why the run confirms the theory.** The raw bytes hold exactly the theory's
      directory entry, an inode number beside a name, and nothing else. The size and the
      type that `ls` prints are not in the directory. `ls` gets them by asking the kernel
      with `stat`, which reads the inode.

  - after: "and the shell's `wait` returns."
    title: "fork makes a second process, exec keeps the pid, the parent waits"
    body: |
      **What the theory says.** `fork()` makes a copy of the caller and returns twice:
      the child's pid to the parent, 0 to the child
      ([Week 2, Section 2.2](w02/class-1.md#sec-2-2)). `exec()` keeps the process (same
      pid, same parent, same open files) and replaces its memory and its program counter
      with a new program
      ([Week 2, Section 3.2](w02/class-1.md#sec-3-2); the kernel side is
      [Week 2, Extra 17](w02/class-1.md#extra-17)). `wait()` blocks the parent until a
      child has exited ([Week 2, Section 2.4](w02/class-1.md#sec-2-4)).

      **What this run showed.** In the shell, pid 2, `kfork` returned 3. The shell then
      entered `kwait`. Process 3 reached `kexec` still named `sh`, with parent 2 and the
      argument list `echo`, `hello`, 0. After `kexec` returned, the same pid 3 was named
      `echo`.

      **Why the run confirms the theory.** Each claim is visible in the kernel's own
      records. One call produced a second process, number 3. Its name changed from `sh`
      to `echo` while its pid stayed 3: the same process with a new program (xv6 also
      writes the new name into the record). The shell entered `kwait` before the child
      reached `kexec`. Your `run_exec` below makes the same three calls
      in the same order.
