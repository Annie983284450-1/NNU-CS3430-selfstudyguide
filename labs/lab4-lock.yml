theory:
  - after: "freed correctly, and the starter is correct, only slow."
    title: "a correct lock can still be a slow one"
    body: |
      **What the theory says.** `kalloc()` pops a page off one shared free list and
      `kfree()` pushes one on. Each is a read of the head and a write of the head, a
      critical section, so xv6 puts one lock, `kmem.lock`, around both
      ([Week 8, Section 2.7](w08/class-1.md#sec-2-7)). xv6's `acquire()` takes a lock by
      repeating an atomic swap until it gets a 0; a CPU that keeps getting a 1 is spinning,
      doing no work ([Week 8, Section 5.3](w08/class-2.md#sec-5-3)).

      **What this run showed.** On the starter, `test1` said `FAIL`: the one `kmem` lock was
      taken 433,058 times, and CPUs failed to get it 26,512 times on the 8-core desktop and
      33,405,938 times on the 2-core machine.

      **Why the run confirms the theory.** Each of those failed swaps is a CPU standing at
      the one lock, doing no work, while another CPU pops or pushes a page. One lock around
      one list makes all four CPUs take turns for every page. That waiting is the cost this
      lab sets out to remove.

  - after: "That is what Step 2 fixes."
    title: "split what is shared, lock each part"
    body: |
      **What the theory says.** When every CPU wants one lock, the fix is to cut the shared
      thing into parts, give each part its own lock, and pick the part by something the
      thread already has, such as its CPU number
      ([Week 9, Sections 2.3](w09/class-1.md#sec-2-3) and
      [2.13](w09/class-1.md#sec-2-13)).

      **What this run showed.** After Step 1, every `kmem` line says `#test-and-set 0`,
      `tot= 0`, and `test1 OK`.

      **Why the run confirms the theory.** `cpuid()` picks the part, so three children on
      three CPUs each take only their own lock, and nobody waits: zero failed swaps, where
      the starter had thousands or millions.

  - after: "277,147 (`n - m` in the Step 0 capture)"
    title: "per-CPU queues need work stealing"
    body: |
      **What the theory says.** With one queue per CPU, one queue can run dry while another
      is still full: load imbalance. The fix is migration, and work stealing decides when:
      a queue that is low takes work from a fuller one. Looking at other queues too often
      brings back the very contention the split removed
      ([Week 7, Section 3.6](w07/class-1.md#sec-3-6)).

      **What this run showed.** After Step 2, `test2` allocated all 32,463 free pages and said
      `OK`. After `test4`, `tot=` was 2,410, and that total counts every failed swap since
      boot. The starter's `test4` alone, on the same machine, had 277,147.

      **Why the run confirms the theory.** A free list per CPU is a run queue per CPU, with
      pages in place of jobs. An empty list is an idle queue, and the steal is the migration.
      Because a CPU steals only when its own list is empty, and then holds the other CPU's
      lock just long enough to swap a pointer, the lists rarely meet: correctness came back
      without bringing the contention back.

  - after: "no running CPU ever refills"
    title: "a system call is a number in a register"
    body: |
      **What the theory says.** A program names a kernel service by a number, never by an
      address. The stub puts the number in `a7` and runs `ecall`, and the kernel's
      `syscall()` looks the number up in its table of handlers
      ([Week 2, Sections 4.4 to 4.6](w02/class-2.md#sec-4-4)).

      **What this run showed.** Before `kalloctest`, `steals` printed `no steals`; after it,
      `steals detected: 6153155`, a counter that lives in the kernel's `kmem` array.

      **Why the run confirms the theory.** `steals` cannot read kernel memory. The only way
      that number reached it is the route of the theory: the new stub loads 37 into `a7`, the
      table entry turns 37 into `sys_kmemsteals`, and the result comes back in `a0`. Without
      the table line the number has no handler, and without the `UPROGS` line there is no
      program at all.

  - after: "timing effect of the"
    title: "the reader-writer lock, and a writer that cannot be starved"
    body: |
      **What the theory says.** Reading does not change the data, so readers need not wait
      for each other. A reader-writer lock has two modes: any number of readers together, or
      one writer alone ([Week 9, Sections 6.4](w09/class-2.md#sec-6-4) and
      [6.5](w09/class-2.md#sec-6-5)). The simple version has a catch: a stream of readers can
      keep the reader count above zero forever, and the writer starves. A fair version counts
      waiting writers and holds new readers back for them
      ([Week 9, Section 6.6](w09/class-2.md#sec-6-6)).

      **What this run showed.** On four real cores `rwlktest` printed `4/4`: stages 2 and 3
      took a million read locks concurrently; stage 5 checked that a reader arriving after a
      waiting writer was held out, and stages 10 to 29 repeated that check with two writers;
      stages 6 and 7 found no reader inside with a writer and no two writers together.

      **Why the run confirms the theory.** The stages test the two modes one by one: readers
      inside together, a writer alone. The `wwaiters` count in your lock is the fair
      version's bookkeeping, and the priority stages pass because a waiting writer makes
      new readers wait. Without it, stage 5 would report `reader sneaked ahead of waiting
      writer`: the first step of the starvation the theory warns about, caught in the act.

  - after: "because the stub `sys_rwget` always returned -1"
    title: "a torn read is a race on two fields"
    body: |
      **What the theory says.** A critical section is a piece of code that touches shared
      data and must run as if it were one step, with nobody else in the middle: that is
      atomicity, and a lock provides it ([Week 8, Section 2.6](w08/class-1.md#sec-2-6)).

      **What this run showed.** With `write_acquire` around `sys_rwset` and `read_acquire`
      around `sys_rwget`, three readers made 60,000 calls between them while the parent made
      20,000 writes, and no reader ever got -1: `rwshared: OK`.

      **Why the run confirms the theory.** A write changes `val` and `chk` with two stores.
      A reader that ran between them would see the two fields disagree and return -1. The
      write lock keeps every reader out while the two stores happen, so as far as any
      reader can tell the write is one step.
