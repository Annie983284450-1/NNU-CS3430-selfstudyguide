# 01_C_survival_guide.md, 02_using_the_autograder.md, 03_working_on_the_labs.md). Those files stay the
# single source of truth and are never edited here. tools/setup2site.py joins them in the order of
# `sources`, moves the headings of each file down by its `shift`, and then works like lab2site.py:
#   overview       the overview page (site-only text; the setup README is about one course run).
#   replace        sentences that belong to one course run (Week 1, Canvas, Piazza, the lab hour, a
#                  date, the report) and a few fixes; each `old` must occur exactly `count` times
#                  (default 1), or the build stops. Most of the rest turn em-dashes into plain
#                  punctuation and move the headings so that each page starts at a `## ` heading.
#   drop_sections  headings removed with everything under them.
#   figures        each inline <figure><svg> of the source, in order, becomes figs/<file> plus a caption.
#   theory         "Connect to theory" boxes (same format as the other labs).
#   pages          one page per `## ` heading, with its short sidebar title.

