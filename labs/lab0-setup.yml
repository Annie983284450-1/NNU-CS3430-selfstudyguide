    caption: "The road of one `write()` call: from your program in user space, through the
      three-instruction stub and the `ecall` into the kernel, to the system-call table and
      `sys_write`, and back with the result in register `a0`. The file names and line numbers
      are those of the `xv6-setup-student` tree."

