site_name: COMP3430 Operating Systems · Self-study guides
site_description: Weekly self-study guides for COMP3430 (NNU, Fall 2026)
site_url: https://annie983284450-1.github.io/NNU-CS3430-selfstudyguide/
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Source Serif 4
    code: JetBrains Mono

extra_css:
  - assets/extra.css
extra_javascript:
  - assets/extra.js

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      linenums_style: pymdownx-inline
      anchor_linenums: false
  - toc:
      permalink: "¶"
      toc_depth: 3

plugins:
  - search

nav:
  - Home: index.md
  - "Week 1 · Introduction":
      - Start here: w01/index.md
      - "Class 1 · What an OS is": w01/class-1.md
      - "Class 2 · Concurrency and persistence": w01/class-2.md
      - Exercises and answers: w01/review.md
      - "Appendix A · Hex, and the marks of C": w01/appendix.md
  - "Week 2 · The process":
      - Start here: w02/index.md
      - "Class 1 · What a process is": w02/class-1.md
      - "Class 2 · Limited direct execution": w02/class-2.md
      - Exercises and answers: w02/review.md
      - "Appendix A · Hex, sizes, time, C": w02/appendix.md
  - "Week 3 · Address spaces":
      - Start here: w03/index.md
      - "Class 1 · The address space, malloc and free": w03/class-1.md
      - "Class 2 · Base and bounds": w03/class-2.md
      - Exercises and answers: w03/review.md
      - "Appendix A · Binary, hex, units": w03/appendix.md
  - "Week 4 · Paging":
      - Start here: w04/index.md
      - "Class 1 · Segments and holes": w04/class-1.md
      - "Class 2 · Pages and the TLB": w04/class-2.md
      - "Exercises, answers, Q&A": w04/review.md
      - "Appendix A · Bits and hex": w04/appendix.md
  - "Week 5 · Tables and swapping":
      - Start here: w05/index.md
      - "Class 1 · Multi-level page tables": w05/class-1.md
      - "Class 2 · Swapping and page replacement": w05/class-2.md
      - Exercises and answers: w05/review.md
      - "Appendix A · Bits and hex": w05/appendix.md
  - "Week 6 · Scheduling":
      - Start here: w06/index.md
      - "Class 1 · FIFO, SJF, STCF, round robin": w06/class-1.md
      - "Class 2 · Multi-level feedback queue": w06/class-2.md
      - Exercises and answers: w06/review.md
      - "Appendix A · Small arithmetic": w06/appendix.md
