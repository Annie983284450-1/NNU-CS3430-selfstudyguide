site_name: COMP3430 Operating Systems · Self-study guides
site_description: Weekly self-study guides for COMP3430 (NNU, Fall 2026)
site_url: https://annie983284450-1.github.io/NNU-CS3430-selfstudyguide/
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    # navigation.sections removed 10-23: weeks fold in the sidebar, only the open week is expanded
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Source Serif 4
    code: JetBrains Mono

extra_css:
  - assets/extra.css
extra_javascript:
  - assets/extra.js

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      linenums_style: pymdownx-inline
      anchor_linenums: false
  - toc:
      permalink: "¶"
      toc_depth: 3

plugins:
  - search

# Top tabs are the parts of the course, not single weeks, so the bar stays short as weeks are added:
# Home, Introduction, Virtualization, Concurrency, Persistence (add when its first week exists), Labs.
# Each week goes under its part; the left sidebar then lists the weeks of that part.
